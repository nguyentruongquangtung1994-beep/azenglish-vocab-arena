<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0102b">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>AZ Vocab Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: phone-width column (max 480px) floating over the Arena's hand-drawn quest map; paper cards, Lumina the lion as coach. Tokens follow AZ Vocab Arena. */
:root{
  --paper:#fcfbfa; --paper-2:#f2f0ee; --ink:#1a1210; --ink-soft:#5c534f; --line:#e6e1dc;
  --red:#e0102b; --red-ink:#8f0a1c; --red-bg:#fcebeb;
  --green:#1e7a4c; --green-bg:#e7f4ec; --amber:#a5680a; --amber-bg:#faf1de;
  --lvl-a:#a5680a; --lvl-a-bg:#faf1de; --lvl-b1:#1e7a4c; --lvl-b1-bg:#e7f4ec; --lvl-b2:#1d6fa5; --lvl-b2-bg:#e6f1f9; --lvl-c1:#7c3aed; --lvl-c1-bg:#f1eafe;
  --veil:rgba(252,251,250,.80); --bubble:#ffffff;
  --card-shadow:0 1px 0 rgba(26,18,16,.04), 0 12px 28px -18px rgba(26,18,16,.35);
  --font-display:"Nunito","Be Vietnam Pro",-apple-system,sans-serif;
  --font-body:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161211; --paper-2:#1f1a18; --ink:#f3ece9; --ink-soft:#b8aca6; --line:#332b28;
  --red:#ff4d5e; --red-ink:#ff8f98; --red-bg:#3a1f22; --green:#4cc38a; --green-bg:#16271e; --amber:#e6a63a; --amber-bg:#2b2215;
  --lvl-a:#e6a63a; --lvl-a-bg:#2b2215; --lvl-b1:#4cc38a; --lvl-b1-bg:#16271e; --lvl-b2:#5aaee6; --lvl-b2-bg:#132331; --lvl-c1:#b08cff; --lvl-c1-bg:#241a3a;
  --veil:rgba(22,18,17,.84); --bubble:#262020;
  --card-shadow:0 1px 0 rgba(0,0,0,.2), 0 20px 40px -20px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161211; --paper-2:#1f1a18; --ink:#f3ece9; --ink-soft:#b8aca6; --line:#332b28;
  --red:#ff4d5e; --red-ink:#ff8f98; --red-bg:#3a1f22; --green:#4cc38a; --green-bg:#16271e; --amber:#e6a63a; --amber-bg:#2b2215;
  --lvl-a:#e6a63a; --lvl-a-bg:#2b2215; --lvl-b1:#4cc38a; --lvl-b1-bg:#16271e; --lvl-b2:#5aaee6; --lvl-b2-bg:#132331; --lvl-c1:#b08cff; --lvl-c1-bg:#241a3a;
  --veil:rgba(22,18,17,.84); --bubble:#262020;
  --card-shadow:0 1px 0 rgba(0,0,0,.2), 0 20px 40px -20px rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.backdrop{position:fixed;inset:0;z-index:0;background:var(--paper) url(assets/map-bg.jpg) center 62%/cover no-repeat;pointer-events:none}
.backdrop::after{content:"";position:absolute;inset:0;background:var(--veil)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

.shell{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px 20px;gap:14px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.topbar b{color:var(--ink);font-weight:700}
.crumbbtn{background:none;border:0;padding:4px 0;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sound{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip[aria-pressed="false"]{color:var(--ink-soft);opacity:.75}

#app{flex:1;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--card-shadow)}
.eyebrow{font-family:var(--font-display);font-weight:800;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.title{font-family:var(--font-display);font-weight:900;line-height:.95;letter-spacing:-.01em}
.title .az{color:var(--red)}

/* START */
.scene{position:relative;height:210px;border-radius:20px;overflow:hidden;background:#6cae5a url(assets/map-bg.jpg) center 22%/cover no-repeat;box-shadow:var(--card-shadow)}
.scene-lion{position:absolute;right:6px;bottom:-14px;height:190px;width:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3));animation:lionIdle 3.2s ease-in-out infinite;transform-origin:bottom center}
@keyframes lionIdle{50%{transform:translateY(-4px) rotate(-1.5deg)}}
.bubble{position:absolute;background:var(--bubble);color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:14px;line-height:1.3;padding:9px 13px;border-radius:14px;box-shadow:0 6px 16px -6px rgba(0,0,0,.35);max-width:62%}
.scene .bubble{left:14px;top:16px;animation:bubbleIn .5s cubic-bezier(.2,1.4,.4,1) both .2s}
.scene .bubble::after{content:"";position:absolute;right:-7px;top:18px;border:8px solid transparent;border-left-color:var(--bubble);border-right:0}
@keyframes bubbleIn{from{opacity:0;transform:scale(.7) translateY(6px)}}
.hero{display:grid;gap:6px}
.hero .title{font-size:clamp(40px,12.5vw,58px)}
.tagline{font-family:var(--font-display);font-weight:800;font-size:20px}
.tagline span{color:var(--red)}
.panel{padding:16px;display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label,.flabel{font-size:12px;font-weight:700;color:var(--ink-soft)}
.field select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper-2);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--paper-2);cursor:pointer;font-family:var(--font-display);font-weight:800}
.seg button[aria-pressed="true"]{border-color:var(--red);color:var(--red);background:var(--paper)}
.pool{font-size:12.5px;color:var(--ink-soft)} .pool b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stats div{background:var(--paper);padding:10px 8px;text-align:center;font-size:11.5px;color:var(--ink-soft)}
.stats b{display:block;font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}

.btn{appearance:none;border:0;border-radius:14px;padding:16px 18px;font-family:var(--font-display);font-weight:900;font-size:18px;letter-spacing:.02em;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
.btn:active{transform:translateY(2px)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-ink)}
.btn-red:active{box-shadow:0 2px 0 var(--red-ink)}
.btn-ink{background:var(--ink);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn-ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.dock{margin-top:auto;display:grid;gap:10px}
.linkbtn{background:none;border:0;color:var(--ink-soft);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:6px 12px 6px 6px;box-shadow:var(--card-shadow)}
.hud img{width:30px;height:30px;border-radius:50%;background:var(--red-bg);object-fit:cover}
.prog{display:flex;gap:4px}
.prog span{flex:1;height:7px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line);transition:background .3s}
.prog span.done-ok{background:var(--green);border-color:var(--green)}
.prog span.done-bad{background:var(--red-bg);border-color:var(--red)}
.prog span.now{background:var(--red);border-color:var(--red)}
.meters{display:flex;gap:10px;font-family:var(--font-display);font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
.meters .xp{color:var(--amber)} .meters .streak{color:var(--red)}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.4)}}

/* QUESTION */
.qcard{padding:22px 18px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;position:relative}
.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.98)}}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.topic{font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:99px;padding:4px 11px 4px 7px}
.lvl{font-family:var(--font-display);font-size:12px;font-weight:900;border-radius:99px;padding:3px 10px;background:var(--lvl-a-bg);color:var(--lvl-a)}
.lvl.B1{background:var(--lvl-b1-bg);color:var(--lvl-b1)} .lvl.B2{background:var(--lvl-b2-bg);color:var(--lvl-b2)} .lvl.C1,.lvl.C2{background:var(--lvl-c1-bg);color:var(--lvl-c1)}
.emoji{font-size:44px;line-height:1;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.clue{font-family:var(--font-display);font-weight:900;font-size:clamp(26px,8vw,34px);line-height:1.1;text-wrap:balance;color:var(--ink)}
.pos{font-size:13px;color:var(--ink-soft);margin-top:-8px}
.tiles{display:flex;justify-content:center;gap:5px;width:100%}
.tile{flex:1 1 0;min-width:0;max-width:40px;aspect-ratio:.82;display:grid;place-items:center;border:2px solid var(--line);border-radius:9px;background:var(--paper-2);font-family:var(--font-display);font-weight:900;font-size:clamp(17px,5.6vw,24px);text-transform:uppercase;color:var(--ink)}
.tile.first{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 3px 0 var(--red-ink)}
.tile.filled{border-color:var(--ink-soft);background:var(--paper);animation:pop .2s ease}
.tile.gap{border:0;background:transparent;max-width:12px}
.tilebox{position:relative;width:100%;margin:0}
.tilebox input{position:absolute;inset:-8px 0;width:100%;height:calc(100% + 16px);opacity:0;border:0;padding:0;font-size:16px;cursor:text;z-index:2}
.tilebox input:disabled{cursor:default}
.tile.cur{border-color:var(--red);background:var(--paper);position:relative}
.tilebox:focus-within .tile.cur{box-shadow:0 0 0 3px var(--red-bg)}
.tilebox:focus-within .tile.cur::after{content:"";width:2px;height:52%;background:var(--red);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tilebox.locked .tile:not(.first){opacity:.55}
.tap{font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:-6px}
.submitbtn.ready{animation:ready 1s ease infinite}
@keyframes ready{50%{transform:scale(1.03)}}
@keyframes pop{50%{transform:translateY(-4px) scale(1.06)}}
.lettercount{font-size:12px;font-weight:700;color:var(--ink-soft)}
[data-clock]{width:100%;display:grid;justify-items:center;gap:8px}
.timer{width:100%;display:grid;gap:6px}
.timer .bar{height:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.timer .fill{height:100%;background:var(--green);border-radius:99px;transform-origin:left;transition:transform .1s linear, background .3s}
.timer.mid .fill{background:var(--amber)}
.timer.low .fill{background:var(--red)}
.timer.low{animation:shake .4s ease infinite}
@keyframes shake{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.timer .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.timer .lbl b{font-family:var(--font-display);font-weight:900;color:var(--ink)}
.timer.low .lbl b{color:var(--red)}
.count{font-family:var(--font-display);font-weight:900;font-size:68px;line-height:1;color:var(--red);height:70px;display:grid;place-items:center}
.count span{animation:countin .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes countin{from{transform:scale(2);opacity:0}35%{transform:scale(1);opacity:1}}
.coach{display:flex;align-items:center;gap:10px;align-self:stretch}
.coach img{width:44px;height:44px;border-radius:50%;background:var(--red-bg);flex:none;object-fit:cover;border:2px solid var(--paper)}
.coach .say{position:relative;background:var(--bubble);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13.5px;font-weight:600;line-height:1.35;animation:bubbleIn .4s cubic-bezier(.2,1.4,.4,1) both}
.answer{display:grid;grid-template-columns:1fr auto;gap:8px}
.answer input{width:100%;min-width:0;padding:15px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.03em}
.answer input:disabled{border-color:var(--line);color:var(--ink-soft);background:var(--paper-2)}
.answer .btn{padding-inline:20px}
.hintline{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
.hintbtn{background:var(--paper);border:1.5px dashed var(--ink-soft);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.hintbtn[disabled]{opacity:.5;cursor:default}
.hinttext{font-size:13.5px;background:var(--amber-bg);color:var(--ink);border-radius:12px;padding:8px 12px}
.notice{font-size:12.5px;font-weight:600;color:var(--red)}

/* REVEAL */
.verdict-row{display:flex;align-items:flex-end;gap:12px;min-height:96px}
.verdict-row .lion{height:112px;width:auto;flex:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));transform-origin:bottom center}
.lion.happy{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
.lion.sad{animation:sway .8s ease}
@keyframes jump{30%{transform:translateY(-18px) rotate(-4deg)}60%{transform:translateY(0) rotate(2deg)}}
@keyframes sway{25%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
.vbox{display:grid;gap:6px;padding-bottom:10px;flex:1;min-width:0}
.verdict{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:900;font-size:24px}
.verdict .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:#fff}
.verdict.ok{color:var(--green)} .verdict.ok .ic{background:var(--green)}
.verdict.bad{color:var(--red)} .verdict.bad .ic{background:var(--red)}
.verdict.neutral{color:var(--ink)} .verdict.neutral .ic{background:var(--ink);color:var(--paper)}
.vbox .say{background:var(--bubble);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:13.5px;font-weight:600;line-height:1.35;animation:bubbleIn .4s cubic-bezier(.2,1.4,.4,1) both .15s}
.rcard{padding:20px 18px;display:grid;gap:10px;position:relative}
.rword{font-family:var(--font-display);font-weight:900;font-size:clamp(40px,12.5vw,56px);line-height:1;letter-spacing:-.01em;overflow-wrap:anywhere}
.rword.long{font-size:clamp(32px,9.8vw,46px)} .rword.xlong{font-size:clamp(26px,7.8vw,38px)}
.reveal-in .rword{animation:wordin .55s cubic-bezier(.2,.8,.2,1)}
@keyframes wordin{from{letter-spacing:.25em;opacity:0}}
.ipa{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-soft)}
.speak{border:1px solid var(--line);background:var(--paper-2);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer}
.rmean{font-family:var(--font-display);font-weight:900;font-size:21px;color:var(--red);line-height:1.2}
.rmean small{font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--ink-soft);margin-left:6px}
.example{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:3px}
.example p{margin:0}
.example .en{font-size:15.5px}
.example .en mark{background:var(--amber-bg);color:var(--ink);font-weight:700;border-radius:4px;padding:0 3px}
.example .vi{font-size:13px;color:var(--ink-soft)}
.yours{font-size:13px;color:var(--ink-soft)} .yours s{color:var(--red)}
.xpfloat{position:absolute;right:16px;top:-14px;font-family:var(--font-display);font-weight:900;font-size:22px;color:var(--amber);background:var(--amber-bg);border-radius:99px;padding:2px 12px;animation:floatUp 1.4s ease both}
@keyframes floatUp{0%{opacity:0;transform:translateY(16px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.1)}35%{transform:scale(1)}100%{opacity:1}}
.gain{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gain > div{padding:12px 14px}
.gain .k{font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.gain .v{font-family:var(--font-display);font-weight:900;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.gain .xp .v{color:var(--amber)} .gain .st .v{color:var(--red)}
.gain ul{margin:2px 0 0;padding:0;list-style:none;font-size:11.5px;color:var(--ink-soft)}

/* RESULT */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 16px}
.podium{position:relative;width:100%;height:170px;border-radius:16px;overflow:hidden;background:#6cae5a url(assets/map-bg.jpg) center 8%/cover no-repeat}
.podium img{position:absolute;left:50%;bottom:-10px;height:180px;transform:translateX(-50%);filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.podium .bubble{right:10px;top:12px;max-width:46%;text-align:left}
.big{font-family:var(--font-display);font-weight:900;font-size:clamp(76px,24vw,104px);line-height:.95;font-variant-numeric:tabular-nums;margin-top:6px}
.big span{color:var(--ink-soft);font-weight:800}
.msg{font-family:var(--font-display);font-weight:900;font-size:28px;color:var(--red)}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;width:100%;margin-top:8px}
.rstats div{background:var(--paper);padding:12px 6px}
.rstats b{display:block;font-family:var(--font-display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.rstats .a{color:var(--amber)} .rstats .r{color:var(--red)}
.rstats span{font-size:11.5px;color:var(--ink-soft)}
.recap{width:100%;display:grid;margin-top:6px;text-align:left}
.recap div{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;font-size:13.5px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.recap b{font-family:var(--font-display);font-weight:900}
.recap .m{color:var(--ink-soft);font-size:12.5px}
.recap .ok{color:var(--green);font-weight:900} .recap .bad{color:var(--red);font-weight:900}

.empty{margin:auto 0;text-align:center;display:grid;gap:10px;padding:26px 16px;justify-items:center}
.empty img{height:120px}
.empty h2{font-family:var(--font-display);font-weight:900;font-size:22px;margin:0}

details.inspect{font-size:12px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.inspect summary{cursor:pointer}
details.inspect pre{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--paper-2);border-radius:10px;padding:10px;overflow:auto;max-height:240px;color:var(--ink)}

/* REEL */
.reelwrap{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:20;padding:16px}
.reelcol{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.reelframe{width:min(46vh,calc(100vw - 32px),428px);aspect-ratio:9/16;max-width:100%;background:var(--paper) url(assets/map-bg.jpg) center/cover no-repeat;color:var(--ink);border-radius:18px;overflow:hidden;position:relative;container-type:inline-size}
.reelframe::before{content:"";position:absolute;inset:0;background:var(--veil)}
.reelinner{position:absolute;inset:0;padding:9% 7% 15%;display:flex;flex-direction:column}
.reelinner .screen{gap:4cqw}
.reelinner .screen > :nth-child(2){margin-top:auto}
.reelinner .screen > :last-child{margin-bottom:auto}
.reelinner .qcard,.reelinner .rcard{padding:6cqw 5cqw}
.reelinner .clue{font-size:8.5cqw}
.reelinner .rword{font-size:13cqw} .reelinner .rword.long{font-size:10cqw} .reelinner .rword.xlong{font-size:8cqw}
.reelinner .tile{font-size:6.2cqw}
.reelinner .count{font-size:20cqw;height:20cqw}
.reelinner .verdict-row .lion{height:26cqw}
.reellogo{position:absolute;right:6%;bottom:5%;font-family:var(--font-display);font-weight:900;font-size:4.2cqw;z-index:2}
.reellogo span{color:var(--red)}
.reelbar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center;color:#fff;font-size:12.5px}
.reelbar button{background:#fff;color:#111;border:0;border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer}
.hook,.cta{margin:auto 0;display:grid;gap:3cqw;text-align:center;justify-items:center}
.hook .title{font-size:12.5cqw}
.cta .title{font-size:10cqw}
.hook .title span,.cta .title span{color:var(--red)}
.hook p,.cta p{margin:0;font-size:4.4cqw;color:var(--ink-soft)}
.hook img,.cta img{height:48cqw;animation:jump 1s cubic-bezier(.3,1.6,.5,1) .3s both}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===== utils ===== */
const shuffle = (arr, rnd = Math.random) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const normalizeAnswer = s => String(s || '').normalize('NFKC').toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9' -]/g, '').replace(/[-']/g, ' ').replace(/\s+/g, ' ').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ===== game/audio — same sound language as AZ Vocab Arena (Web Audio tones + clips + BGM + Lumina voice) ===== */
const AZ_AUDIO = (() => {
  const C = AZ_GAME_CONFIG.audio;
  const pref = Object.assign({ music: 'sunny', sfx: true }, store.get('azgame.sound', {}));
  let ctx = null, bgm = null, tickClip = null, voiceClip = null, unlocked = false;
  const getCtx = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; };
  function tone(freq, dur, type = 'sine', delay = 0, vol = 0.16) {
    if (!pref.sfx) return; const c = getCtx(); if (!c) return;
    try { const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + delay;
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02); } catch {}
  }
  function clip(name, vol = 0.5) {
    if (!pref.sfx) return null;
    try { const a = new Audio(ASSET + C.clips[name]); a.volume = vol; a.play().catch(() => {}); return a; } catch { return null; }
  }
  function fadeOut(a, ms = 300) { if (!a) return; const v0 = a.volume, steps = 6; let i = 0; const t = setInterval(() => { i++; a.volume = Math.max(0, v0 * (1 - i / steps)); if (i >= steps) { clearInterval(t); a.pause(); } }, ms / steps); }
  function keyClick(back) {
    if (!pref.sfx) return; const c = getCtx(); if (!c) return;
    try { const t0 = c.currentTime, n = Math.max(1, Math.floor(c.sampleRate * 0.018)), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = (back ? 1700 : 3000) + Math.random() * 300; f.Q.value = 1.1; g.gain.value = 0.1;
      src.connect(f); f.connect(g); g.connect(c.destination); src.start(t0);
      const o = c.createOscillator(), og = c.createGain(); o.type = 'triangle'; o.frequency.value = back ? 380 : 560;
      og.gain.setValueAtTime(0.07, t0); og.gain.exponentialRampToValueAtTime(0.0001, t0 + (back ? 0.05 : 0.02));
      o.connect(og); og.connect(c.destination); o.start(t0); o.stop(t0 + 0.06); } catch {}
  }
  function music(play) {
    const tr = C.tracks[pref.music];
    if (!play || !tr) { if (bgm) { bgm.pause(); bgm = null; } return; }
    if (bgm && bgm.dataset.k === pref.music) { bgm.play().catch(() => {}); return; }
    if (bgm) bgm.pause();
    try { bgm = new Audio(ASSET + tr[1]); bgm.dataset.k = pref.music; bgm.loop = true; bgm.volume = C.musicVolume; bgm.play().catch(() => {}); } catch {}
  }
  const duck = on => { if (bgm) bgm.volume = on ? C.duckVolume : C.musicVolume; };
  return {
    pref,
    unlock() { unlocked = true; getCtx(); music(true); },
    cycleMusic() { const keys = [...Object.keys(C.tracks), 'off']; pref.music = keys[(keys.indexOf(pref.music) + 1) % keys.length]; store.set('azgame.sound', pref); if (unlocked) music(pref.music !== 'off'); },
    toggleSfx() { pref.sfx = !pref.sfx; store.set('azgame.sound', pref); if (!pref.sfx) this.clockStop(); },
    musicLabel() { const t = C.tracks[pref.music]; return t ? '♪ ' + t[0] : '♪ Tắt nhạc'; },
    key: keyClick,
    count() { tone(880, 0.07, 'square', 0, 0.06); },
    go() { tone(523.25, 0.1, 'triangle', 0, 0.2); tone(783.99, 0.18, 'triangle', 0.08, 0.2); },
    correct(streak) { const off = Math.min(streak * 60, 400); tone(660 + off, 0.12, 'sine'); tone(880 + off, 0.18, 'sine', 0.1); },
    wrong() { tone(170, 0.28, 'sawtooth', 0, 0.12); },
    reveal() { tone(587.33, 0.12, 'triangle', 0, 0.14); tone(880, 0.2, 'triangle', 0.1, 0.14); },
    clockStart() { if (!tickClip) { tickClip = clip('tick', 0.5); if (tickClip) tickClip.loop = true; } },
    clockHurry() { if (tickClip) { tickClip.playbackRate = 1.6; tickClip.volume = 0.75; } },
    clockStop() { if (tickClip) { fadeOut(tickClip, 150); tickClip = null; } },
    whistle() { clip('whistle', 0.45); },
    fanfare(big) { (big ? [523.25, 659.25, 783.99, 1046.5] : [523.25, 659.25, 783.99]).forEach((f, i) => tone(f, 0.4, 'triangle', i * 0.11, 0.22)); },
    clap() { clip('clap', 0.5); },
    trombone() { clip('trombone', 0.45); },
    fireworks() { clip('fireworks', 0.55); },
    voice(name) { if (!pref.sfx) return; if (voiceClip) voiceClip.pause(); voiceClip = clip(name, 1); if (voiceClip) { duck(true); voiceClip.onended = () => duck(false); } },
    stopAll() { this.clockStop(); if (voiceClip) voiceClip.pause(); duck(false); },
  };
})();

/* ===== fx — confetti / fireworks particles (Arena celebration style) ===== */
const FX = (() => {
  const cv = document.getElementById('fx'), g = cv.getContext && cv.getContext('2d');
  let parts = [], running = false;
  const colors = ['#e0102b', '#ffb020', '#1e7a4c', '#1d6fa5', '#ffffff', '#7c3aed'];
  const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() { const r = devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; g.setTransform(r, 0, 0, r, 0, 0); }
  function loop() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) { p.vy += p.grav; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.life -= 1; p.rot += p.vr;
      g.save(); g.globalAlpha = Math.min(1, p.life / 30); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.c;
      if (p.round) { g.beginPath(); g.arc(0, 0, p.s / 2, 0, 7); g.fill(); } else g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); }
    if (parts.length) requestAnimationFrame(loop); else running = false;
  }
  function burst(x, y, n = 24, big = false) {
    if (!g || reduce()) return; if (!running) size();
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = (big ? 3 : 2) + Math.random() * (big ? 6 : 4);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (big ? 2 : 1.5), grav: 0.14, life: 60 + Math.random() * 40, s: 5 + Math.random() * 6, c: pick(colors), rot: Math.random() * 6, vr: (Math.random() - .5) * .3, round: Math.random() < .35 }); }
    if (!running) { running = true; requestAnimationFrame(loop); }
  }
  function at(el, n, big) { if (!el) return; const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n, big); }
  function celebrate(big) { const w = innerWidth, h = innerHeight; for (let i = 0; i < (big ? 5 : 3); i++) setTimeout(() => burst(w * (0.2 + Math.random() * 0.6), h * (0.15 + Math.random() * 0.35), big ? 40 : 26, true), i * 180); }
  return { burst, at, celebrate };
})();

/* ===== game/adapters/vocabularyAdapter — Arena record {w,p,m,lvl,t,ipa,s,sv,e} → GameVocabularyItem ===== */
const POS = { n: 'danh từ', v: 'động từ', adj: 'tính từ', adv: 'trạng từ', prep: 'giới từ', conj: 'liên từ', pron: 'đại từ', phr: 'cụm từ', int: 'thán từ' };
function toGameItem(r, arenaKey, topics) {
  if (!r || !r.w || !r.m) return null;
  const word = String(r.w).trim();
  if (!/^[A-Za-z][A-Za-z' -]*$/.test(word)) return null;
  const t = topics[r.t] || [];
  return { id: `${arenaKey}:${r.t || 'misc'}:${word.toLowerCase()}`, word, meaning: r.m,
    pronunciation: r.ipa ? `/${r.ipa}/` : undefined, partOfSpeech: r.p, category: t[0], categoryIcon: t[1], categoryKey: r.t, level: r.lvl,
    example: r.s ? r.s.replace(/_{2,}/g, word) : undefined, exampleVi: r.sv, emoji: r.e, audio: undefined, image: undefined };
}
function loadArena(key) {
  const a = AZ_VOCAB_SOURCE && AZ_VOCAB_SOURCE[key];
  if (!a) return { topics: [], items: [] };
  const topics = Object.fromEntries(a.topics.map(t => [t[0], [t[1], t[2]]]));
  return { name: a.name, topics: a.topics, items: a.words.map(w => toGameItem(w, key, topics)).filter(Boolean) };
}

/* ===== game/engine/questionGenerator ===== */
function eligible(items, { topic, level }) {
  const seen = new Set();
  return items.filter(it => {
    if (topic && topic !== 'all' && it.categoryKey !== topic) return false;
    if (level && level !== 'all' && it.level !== level) return false;
    const k = it.word.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true;
  });
}
const generateQuestions = (items, filter, count) => shuffle(eligible(items, filter)).slice(0, count);

/* ===== game/engine/scoring ===== */
function scoreAnswer({ correct, answeredIn, hintUsed, newStreak }) {
  const X = AZ_GAME_CONFIG.xp, parts = [];
  if (!correct) return { total: 0, parts, fast: false };
  parts.push(['Đúng', X.correct]);
  const fast = !hintUsed && answeredIn <= AZ_GAME_CONFIG.fastAnswerWithinSeconds;
  if (fast) parts.push(['Trả lời nhanh', X.fastAnswer]);
  if (newStreak === 5) parts.push(['Chuỗi 5', X.streak5]);
  if (newStreak === 10) parts.push(['Chuỗi 10', X.streak10]);
  return { total: parts.reduce((s, p) => s + p[1], 0), parts, fast };
}

/* ===== game/engine/gameReducer — pure, serializable state ===== */
const initialState = () => ({
  status: 'idle', mode: 'guess-word', questionIndex: 0, totalQuestions: 0, questions: [],
  currentWordId: '', userAnswer: '', isCorrect: undefined, score: 0, xp: 0, lastGain: null,
  streak: 0, bestStreak: 0, correctAnswers: 0, timeRemaining: 0, countdown: 0,
  hintUsed: false, notice: null, history: [], perfectBonus: 0, autoplay: false,
});
function judge(s, timedOut) {
  const q = s.questions[s.questionIndex];
  const correct = !timedOut && normalizeAnswer(s.userAnswer).replace(/ /g, '') === normalizeAnswer(q.word).replace(/ /g, '');
  const answeredIn = +(AZ_GAME_CONFIG.answerTimeSeconds - s.timeRemaining).toFixed(1);
  const streak = correct ? s.streak + 1 : 0;
  const gain = scoreAnswer({ correct, answeredIn, hintUsed: s.hintUsed, newStreak: streak });
  return { ...s, status: 'revealing', isCorrect: correct, streak, bestStreak: Math.max(s.bestStreak, streak),
    correctAnswers: s.correctAnswers + (correct ? 1 : 0), score: s.score + (correct ? 1 : 0), xp: s.xp + gain.total, lastGain: gain, notice: null,
    history: [...s.history, { id: q.id, word: q.word, meaning: q.meaning, answer: s.userAnswer, correct, timedOut, answeredIn, xp: gain.total, streakBefore: s.streak }] };
}
function gameReducer(s, a) {
  switch (a.type) {
    case 'START':
      if (!a.questions.length) return { ...initialState(), status: 'empty' };
      return { ...initialState(), autoplay: !!a.autoplay, questions: a.questions, totalQuestions: a.questions.length,
        status: 'countdown', countdown: AZ_GAME_CONFIG.countdownSeconds, currentWordId: a.questions[0].id };
    case 'COUNTDOWN_TICK':
      if (s.status !== 'countdown') return s;
      return s.countdown > 1 ? { ...s, countdown: s.countdown - 1 } : { ...s, status: 'answering', countdown: 0, timeRemaining: AZ_GAME_CONFIG.answerTimeSeconds };
    case 'TICK': {
      if (s.status !== 'answering') return s;
      const t = Math.max(0, +(s.timeRemaining - a.dt).toFixed(2));
      if (t > 0) return { ...s, timeRemaining: t };
      return s.autoplay ? gameReducer({ ...s, timeRemaining: 0 }, { type: 'AUTO_REVEAL' }) : judge({ ...s, timeRemaining: 0 }, true);
    }
    case 'TYPE': return s.status === 'answering' ? { ...s, userAnswer: String(a.value).slice(0, 40), notice: null } : s;
    case 'HINT': return s.status === 'answering' ? { ...s, hintUsed: true } : s;
    case 'SUBMIT':
      if (s.status !== 'answering') return s;
      if (!normalizeAnswer(s.userAnswer)) return { ...s, notice: 'empty' };
      return judge(s, false);
    case 'AUTO_REVEAL':
      if (s.status !== 'answering' && s.status !== 'countdown') return s;
      return { ...s, status: 'revealing', isCorrect: undefined, lastGain: null };
    case 'NEXT': {
      if (s.status !== 'revealing') return s;
      const i = s.questionIndex + 1;
      if (i >= s.totalQuestions) {
        const perfect = !s.autoplay && s.correctAnswers === s.totalQuestions ? AZ_GAME_CONFIG.xp.perfectRound : 0;
        return { ...s, status: 'finished', perfectBonus: perfect, xp: s.xp + perfect };
      }
      return { ...s, status: 'countdown', countdown: AZ_GAME_CONFIG.countdownSeconds, questionIndex: i,
        currentWordId: s.questions[i].id, userAnswer: '', isCorrect: undefined, hintUsed: false, notice: null, lastGain: null };
    }
    case 'RESET': return initialState();
    default: return s;
  }
}

/* ===== game/engine/GameEngine — owns timers, cleaned on every status change ===== */
function createGameEngine(onChange) {
  let state = initialState(), timer = null, timerKey = '';
  const stop = () => { if (timer) clearInterval(timer); timer = null; timerKey = ''; };
  function syncTimers() {
    const key = state.status + ':' + state.questionIndex;
    if (key === timerKey) return;
    stop();
    if (state.status === 'countdown') { timerKey = key; timer = setInterval(() => dispatch({ type: 'COUNTDOWN_TICK' }), 1000); }
    else if (state.status === 'answering') { timerKey = key; let last = performance.now();
      timer = setInterval(() => { const now = performance.now(); dispatch({ type: 'TICK', dt: (now - last) / 1000 }); last = now; }, 100); }
  }
  function dispatch(action) { const prev = state; state = gameReducer(state, action); if (state !== prev) { syncTimers(); onChange(state, prev, action); } }
  return { dispatch, getState: () => state, destroy: stop };
}

    }
    if (s.userAnswer !== prev.userAnswer) {

function afterFullRender(s, prev) {

  if (!el) return; if (matchMedia('(prefers-reduced-motion: reduce)').matches || !to) { el.textContent = prefix + to; return; }
  const t0 = performance.now(), d = 700;
  (function f(now) { const p = Math.min(1, (now - t0) / d); el.textContent = prefix + Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); })(t0);
}
function speak(word) { if (!AZ_AUDIO.pref.sfx) return; try { const u = new SpeechSynthesisUtterance(word); u.lang = 'en-US'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {} }
const saveSetup = () => store.set('azgame.setup', setup);
const currentQuestions = () => generateQuestions(loadArena(setup.arena).items, setup, setup.count);
function startGame() { AZ_AUDIO.unlock(); game.dispatch({ type: 'START', questions: currentQuestions() }); }
function backToArena() { AZ_AUDIO.stopAll(); location.href = '../'; }
document.getElementById('crumb-back').onclick = backToArena;
function onGameChange(s, prev) { renderInteractive(s, prev); }

/* sound chips */
const musicBtn = document.getElementById('music-btn'), sfxBtn = document.getElementById('sfx-btn');
function paintSound() { musicBtn.textContent = AZ_AUDIO.musicLabel(); musicBtn.setAttribute('aria-pressed', AZ_AUDIO.pref.music !== 'off'); sfxBtn.textContent = AZ_AUDIO.pref.sfx ? '🔊 Hiệu ứng' : '🔇 Hiệu ứng'; sfxBtn.setAttribute('aria-pressed', AZ_AUDIO.pref.sfx); }
musicBtn.onclick = () => { AZ_AUDIO.cycleMusic(); AZ_AUDIO.unlock(); paintSound(); };
sfxBtn.onclick = () => { AZ_AUDIO.toggleSfx(); paintSound(); };
paintSound();

/* light / dark */
const themeBtn = document.getElementById('theme-btn'), darkMQ = matchMedia('(prefers-color-scheme: dark)');
let themePref = store.get('azgame.theme', null);
const effTheme = () => themePref || (darkMQ.matches ? 'dark' : 'light');
function applyTheme() {
  if (themePref) document.documentElement.setAttribute('data-theme', themePref);
  const dark = effTheme() === 'dark';
  themeBtn.textContent = dark ? '🌙 Tối' : '☀️ Sáng';
  themeBtn.setAttribute('aria-label', dark ? 'Đang ở chế độ tối, bấm để chuyển sang sáng' : 'Đang ở chế độ sáng, bấm để chuyển sang tối');
}
themeBtn.onclick = () => { themePref = effTheme() === 'dark' ? 'light' : 'dark'; store.set('azgame.theme', themePref); applyTheme(); };
darkMQ.addEventListener?.('change', applyTheme);
applyTheme();

/* ===== Reel mode — same engine + same views, auto-play timeline in a 9:16 frame ===== */
function openReel() {
  const questions = currentQuestions(); if (!questions.length) return;
  AZ_AUDIO.unlock();
  const wrap = document.createElement('div');
  wrap.className = 'reelwrap';
  wrap.innerHTML = `<div class="reelcol" role="dialog" aria-label="Xem trước Reel">
    <div class="reelframe"><div class="reellogo"><span>AZ</span>English</div><div class="reelinner" id="reel-stage"></div></div>
    <div class="reelbar"><span>1080×1920 · 30fps · auto-play</span><button type="button" id="reel-replay">Phát lại</button><button type="button" id="reel-close">Đóng</button></div></div>`;
  document.body.appendChild(wrap);
  const stage = wrap.querySelector('#reel-stage');
  const timeouts = [], later = (fn, ms) => timeouts.push(setTimeout(fn, ms));
  const R = AZ_GAME_CONFIG.reel;
  const engine = createGameEngine((s, prev) => {
    if (s.status === 'idle') return;
    if (s.status === 'finished') { stage.innerHTML = `<section class="screen"><div class="cta enter"><img src="${ASSET}lion.webp" alt=""><div class="eyebrow">Bạn đoán đúng mấy từ?</div><div class="title">Learn English.<br><span>Speak with Confidence.</span></div><p>Học tiếng Anh. Tự tin cất lời.</p></div></section>`; AZ_AUDIO.fanfare(true); return; }
    const full = !prev || screenKey(s) !== screenKey(prev);
    if (s.status === 'revealing') { if (full) { stage.innerHTML = revealView(s, { reel: true }); AZ_AUDIO.clockStop(); AZ_AUDIO.reveal(); later(() => engine.dispatch({ type: 'NEXT' }), R.revealHoldMs); } return; }
    if (full) stage.innerHTML = questionView(s, { reel: true });
    const clock = stage.querySelector('[data-clock]');
    if (s.status === 'countdown') { clock.innerHTML = countHTML(s); if (full || s.countdown !== prev.countdown) AZ_AUDIO.count(); }
    if (s.status === 'answering') {
      if (prev.status !== 'answering') { AZ_AUDIO.go(); AZ_AUDIO.clockStart(); later(() => engine.dispatch({ type: 'AUTO_REVEAL' }), R.answerWindowMs); }
      clock.innerHTML = timerHTML(s.timeRemaining);
    }
  });
  function play() {
    timeouts.splice(0).forEach(clearTimeout); engine.dispatch({ type: 'RESET' });
    const cat = questions[0].category || 'Từ vựng';
    stage.innerHTML = `<section class="screen"><div class="hook enter"><img src="${ASSET}lion.webp" alt=""><div class="eyebrow">AZ Vocab Challenge · ${esc(cat)}</div><div class="title">${questions.length} từ.<br><span>Bạn đoán</span> được mấy?</div><p>Nhìn nghĩa, đoán từ tiếng Anh trước khi hết giờ.</p></div></section>`;
    later(() => engine.dispatch({ type: 'START', questions, autoplay: true }), R.hookMs);
  }
  const close = () => { AZ_AUDIO.clockStop(); timeouts.splice(0).forEach(clearTimeout); engine.destroy(); wrap.remove(); document.getElementById('reel')?.focus(); };
  wrap.querySelector('#reel-close').onclick = close;
  wrap.querySelector('#reel-replay').onclick = play;
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  wrap.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  wrap.querySelector('#reel-close').focus();
  play();
}

if (location.hash === '#debug') document.getElementById('inspect').hidden = false;
renderInteractive(game.getState());
</script>
