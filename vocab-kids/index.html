<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#170D1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Thẻ từ vựng tiếng Anh vui cho bé: lật thẻ, nghe giọng, chọn hình đúng.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overscroll-behavior:none}button{touch-action:manipulation}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vocab Kid Flash Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Pacifico&display=swap" rel="stylesheet">
<style>

/* Layout: một cột như app hẹn hò trên điện thoại — thanh trên, chip bộ từ, xấp thẻ "hồ sơ từ vựng", 2 nút quẹt, thanh tab dưới. Giao diện đêm khuya cố định (một theme). */
:root{
  --ink:#170D1C; --panel:#241629; --panel2:#30203A; --line:#45304D;
  --text:#FBEFF5; --muted:#B49DB8;
  --flame1:#FF3D7F; --flame2:#FF8A3D; --mint:#36E2B4; --gold:#FFC94D; --bad:#FF5A5A;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,sans-serif;
  --script:"Pacifico","Be Vietnam Pro",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#3A1530 0%,var(--ink) 60%) var(--ink);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fe{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.28em;object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* thanh trên */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:12px 8px;gap:8px}
.logo{font-family:var(--script);font-size:26px;background:linear-gradient(90deg,var(--flame1),var(--flame2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.chips{display:flex;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:4px}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}

/* chọn bộ từ */
.cats{display:flex;gap:6px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.cat.on{border-color:var(--flame1);background:rgba(255,61,127,.16)}
.cat small{color:var(--muted);font-weight:500}

/* xấp thẻ */
.deck{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 18px 40px rgba(0,0,0,.45);will-change:transform;cursor:grab}
.card.under{transform:scale(.94) translateY(14px);filter:brightness(.6);cursor:default;pointer-events:none}
.art{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:32%}
.art .fe,.art .fe-n{width:clamp(130px,42vw,190px);height:clamp(130px,42vw,190px);filter:drop-shadow(0 16px 30px rgba(0,0,0,.4));animation:float 3.2s ease-in-out infinite}
.art .fe-n{font-size:clamp(100px,32vw,150px);display:grid;place-items:center}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.dots{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:5px;z-index:2}
.dots i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}
.dots i.on{background:#fff}
.ctag{position:absolute;top:24px;left:14px;z-index:2;display:flex;align-items:center;gap:4px;background:rgba(10,4,12,.45);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em}
.info{position:absolute;left:0;right:0;bottom:0;padding:70px 18px 18px;background:linear-gradient(to top,rgba(10,4,12,.95) 0%,rgba(10,4,12,.75) 55%,transparent 100%);display:flex;flex-direction:column;gap:6px}
.nm{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nm small{font-family:var(--body);font-weight:500;font-size:22px;opacity:.9}
.meta{font-size:14px;color:#EBDDF0;display:flex;flex-direction:column;gap:3px}
.bio{font-size:17px;line-height:1.5;font-weight:500}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
.hint{font-size:12px;color:var(--muted)}
.say{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;width:max-content}
.stamp{position:absolute;top:58px;padding:4px 12px;border:4px solid;border-radius:10px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.03em;opacity:0;z-index:3;pointer-events:none;white-space:nowrap}
.st-r{left:18px;color:var(--flame1);border-color:var(--flame1);transform:rotate(-14deg)}
.st-l{right:18px;color:var(--mint);border-color:var(--mint);transform:rotate(14deg)}

.controls{display:flex;justify-content:center;align-items:flex-start;gap:56px;padding-block:14px 8px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--muted)}
.rb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:38px;transition:transform .15s}
.rb .fe{width:42px;height:42px}
.rb:active{transform:scale(.88)}
.rb:hover .fe{transform:scale(1.12) rotate(-6deg)}
.rb .fe{transition:transform .2s}
.rb.l{background:radial-gradient(circle at 30% 25%,#45324D,#1D1222);border:2px solid rgba(180,157,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.rb.r{background:linear-gradient(135deg,var(--flame1),var(--flame2));box-shadow:0 8px 28px rgba(255,61,127,.5),inset 0 2px 0 rgba(255,255,255,.3)}
.mean{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 11px;display:flex;flex-direction:column;gap:3px;font-size:14px;line-height:1.45}
.mean .k{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:4px}
.mean b{font-size:17px}
.mean .exr{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.mean .say{padding:4px 9px;flex:none}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px;background:var(--panel);border-radius:22px}
.empty .big{font-size:72px}
.empty h3{margin:0;font-size:20px}
.empty p{margin:0;color:var(--muted);max-width:30ch;line-height:1.5}

.btn{background:linear-gradient(90deg,var(--flame1),var(--flame2));color:#fff;font-weight:800;border-radius:999px;padding:13px 22px;font-size:15px}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}

/* tin nhắn */
.scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
h2{font-size:20px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none;position:relative}
.av b{position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;background:var(--flame1);border:2px solid var(--ink)}
.row .t{flex:1;min-width:0}
.row .n{font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center}
.row .p{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--gold);white-space:nowrap}
.newm{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px}
.newm button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;flex:none}
.newm .av{width:64px;height:64px;font-size:34px;border:2px solid var(--flame1)}
.blank{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.6}

.chathead{display:flex;align-items:center;gap:10px;padding-block:4px 10px;border-bottom:1px solid var(--line)}
.chathead .av{width:42px;height:42px;font-size:24px}
.back{font-size:22px;padding:4px 8px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-block:12px}
.m{max-width:80%;padding:10px 14px;border-radius:18px;line-height:1.45;font-size:15px}
.m.w{background:var(--panel2);align-self:flex-start;border-bottom-left-radius:6px}
.m.me{background:linear-gradient(90deg,var(--flame1),var(--flame2));align-self:flex-end;border-bottom-right-radius:6px;color:#fff;font-weight:500}
.m em{font-style:normal;color:var(--gold);font-weight:700}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-5px)}}
.reply{display:flex;flex-wrap:wrap;gap:8px;padding-block:10px 12px;border-top:1px solid var(--line)}
.qr{border:1.5px solid var(--flame1);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--panel)}
.reply form{display:flex;gap:8px;width:100%}
.reply input{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;color:var(--text);font:inherit}
.done{color:var(--gold);font-weight:700;text-align:center;width:100%;padding:6px}

/* bạn */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.streak{background:linear-gradient(90deg,rgba(255,61,127,.18),rgba(255,138,61,.18));border:1px solid rgba(255,138,61,.4);border-radius:16px;padding:14px;margin-bottom:14px;font-weight:700;line-height:1.5}
.set{margin-bottom:16px}
.set label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;font-weight:700}
.seg{display:flex;background:var(--panel);border-radius:999px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-weight:700;font-size:14px}
.seg button.on{background:linear-gradient(90deg,var(--flame1),var(--flame2));color:#fff}
.exs{display:flex;flex-wrap:wrap;gap:6px}
.exs span,.exs button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;display:flex;align-items:center;gap:4px}

/* tab dưới */
nav{display:flex;border-top:1px solid var(--line);padding-block:6px max(8px,env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px;position:relative}
nav button .ic{font-size:24px;filter:grayscale(1) opacity(.55);line-height:1}
nav button.on{color:var(--text)} nav button.on .ic{filter:none}
nav .badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--flame1);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}

/* lớp phủ */
.ov{position:fixed;inset:0;z-index:50;background:rgba(12,5,15,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:420px;max-height:100%;overflow-y:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.mt{font-family:var(--script);font-size:clamp(36px,11vw,50px);line-height:1.25;background:linear-gradient(90deg,var(--flame1),var(--flame2));-webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(-4deg)}
.pair{display:flex;justify-content:center}
.pair .av{width:100px;height:100px;font-size:56px;border:3px solid #fff}
.pair .av+.av{margin-left:-16px}
.word{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.02em}
.vi{font-size:22px;font-weight:800}
.ex{color:var(--muted);font-style:italic;line-height:1.5}
.sass{background:var(--panel);border-radius:14px;padding:10px 14px;font-weight:700}
.acts{display:flex;flex-direction:column;gap:10px}
.ob h1{margin:0}
.tag1{color:var(--muted);margin:0;line-height:1.5}
.rules{display:grid;gap:8px;text-align:left}
.rules div{background:var(--panel);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;line-height:1.4}
.rules b{font-size:30px;line-height:1}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 8px;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center}
.pick button span{font-size:32px;line-height:1}
.pick button.on{border-color:var(--flame1);background:rgba(255,61,127,.14)}
.yr{width:100%;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:700 16px var(--body);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.olabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;text-align:left}

.mpop{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(420px,calc(100% - 32px));z-index:45;display:flex;gap:12px;align-items:center;padding:10px 14px 10px 10px;border-radius:18px;background:linear-gradient(90deg,var(--flame1),var(--flame2));color:#fff;box-shadow:0 12px 30px rgba(255,61,127,.45);cursor:pointer;animation:drop .35s cubic-bezier(.2,1.4,.4,1);transition:opacity .4s,transform .4s}
.mpop.out{opacity:0;transform:translateX(-50%) translateY(-20px)}
.mpop .av{width:46px;height:46px;font-size:26px;border:2px solid #fff}
.mpop .t{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.mpop b{font-family:var(--script);font-weight:400;font-size:18px}
.mpop span{font-size:15px}.mpop small{font-size:12px;opacity:.9}
@keyframes drop{from{transform:translateX(-50%) translateY(-30px);opacity:0}}
nav button.bump .ic{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.4) rotate(-10deg)}}
.itabs{display:flex;background:var(--panel);border-radius:999px;padding:4px;gap:4px;border:1px solid var(--line);margin:4px 0 14px}
.itabs button{flex:1;padding:9px 6px;border-radius:999px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.itabs button.on{background:linear-gradient(90deg,var(--flame1),var(--flame2));color:#fff}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.exc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:10px;align-items:center;text-align:left}
.exc .av{width:40px;height:40px;font-size:22px}
.exc b{display:block;font-size:15px}.exc span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exc .t{min-width:0}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#1A0B1E;font-weight:800;padding:11px 16px;border-radius:14px;max-width:min(400px,calc(100% - 32px));text-align:center;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .25s}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}}
.heart{position:fixed;z-index:55;font-size:28px;pointer-events:none;animation:rise 1.6s ease-out forwards}
.heart .fe{width:34px;height:34px}
@keyframes rise{to{transform:translateY(-60vh) rotate(30deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* ---- riêng Vocab Kid: thẻ lật 2 mặt, trò đoán hình ---- */
.card.kcard{overflow:visible;background:none!important;box-shadow:none;perspective:1400px}
.kcard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.kcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.face.back{transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:26px 22px;text-align:center}
.face.front .info{padding-top:50px}
.big-vi{font-size:clamp(28px,8vw,36px);font-weight:800;line-height:1.2}
.back .bw{font-family:var(--display);font-weight:800;font-size:22px;opacity:.85}
.back .art2 .fe{width:96px;height:96px}
.back .exb{background:rgba(10,4,12,.35);border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.5}
.back .exb i b{color:var(--gold);font-style:normal}
.back .exb small{display:block;color:#EBDDF0;margin-top:4px;font-size:14px}
.lang{cursor:pointer}
.q-word{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.02em}
.q-pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-pic{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;place-items:center;aspect-ratio:1.25}
.q-pic .fe,.q-pic .fe-n{width:64px;height:64px;font-size:52px}
.q-pic.ok,.opt.ok{border-color:var(--mint);background:rgba(54,226,180,.18)}
.q-pic.no,.opt.no{border-color:var(--bad);background:rgba(255,90,90,.18);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opts{display:grid;gap:8px}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;font-family:var(--display);font-weight:800;font-size:20px}
.q-art .fe,.q-art .fe-n{width:120px;height:120px;font-size:96px}
.qbar{display:flex;gap:4px}.qbar i{flex:1;height:6px;border-radius:6px;background:var(--panel2)}.qbar i.on{background:linear-gradient(90deg,var(--flame1),var(--flame2))}
.dots3{display:flex;gap:3px;margin-top:3px}.dots3 i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots3 i.on{background:var(--gold)}
.play{width:100%;margin-bottom:14px}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="logo">Vocab Kid</div>
    <div class="chips"><button class="chip lang" id="langChip" aria-label="Đổi ngôn ngữ"></button><span class="chip" id="starChip"></span></div>
  </div>

const ARENA_URL="https://nguyentruongquangtung1994-beep.github.io/azenglish-vocab-arena/";

const KEY="vocabkid.v1";
const hue=i=>(i*47+180)%360;
const grad=i=>`linear-gradient(160deg,hsl(${hue(i)} 72% 58%),hsl(${(hue(i)+40)%360} 68% 40%))`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function fresh(){return{lang:"vi",topic:"all",stars:0,deck:[],pos:0,learn:{},known:[],streak:{last:"",n:0}}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const pool=t=>W.map((_,i)=>i).filter(i=>(t==="all"||W[i].t===t)&&!(i in S.learn)&&!S.known.includes(i));
function buildDeck(){S.deck=shuffle(pool(S.topic));S.pos=0}
if(!S.deck.length||S.bank!==W.length){buildDeck();S.bank=W.length}
(function(){const t=today();if(S.streak.last!==t){const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();S.streak.n=S.streak.last===ys?S.streak.n+1:1;S.streak.last=t;save()}})();
const tx=k=>T[S.lang][k];
const topicName=k=>k==="all"?tx("all"):S.lang==="en"?(TOPIC_EN[k]||k):TOPICS[k][0];
const topicIc=k=>k==="all"?"🎲":TOPICS[k][1];

let tab="learn",busy=false;
const $main=document.getElementById("main");
document.querySelectorAll("[data-fe]").forEach(el=>el.innerHTML=fe(el.dataset.fe));

let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Ava","Allison","Susan","Zira","Karen"];
  VOICE=pref.map(n=>vs.find(v=>v.name.includes(n)&&/US|en-US/i.test(v.lang+v.name))||vs.find(v=>v.name.includes(n))).find(Boolean)||vs.find(v=>/en-US/i.test(v.lang))||vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(VOICE)u.voice=VOICE;u.pitch=1.55;u.rate=1;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let toastT;
function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}
function hearts(set){for(let k=0;k<16;k++){const h=document.createElement("span");h.className="heart";h.innerHTML=fe(pick(set));h.style.left=Math.random()*92+"vw";h.style.top=(70+Math.random()*30)+"vh";h.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),2200)}}
function overlay(html){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(o);busy=true;return o}
function closeOv(o){o.remove();busy=false}

function hud(){
  document.getElementById("starChip").innerHTML=fe("⭐")+" "+S.stars;
  document.getElementById("langChip").innerHTML=(S.lang==="vi"?fe("🇻🇳")+" VI":fe("🇬🇧")+" EN");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=tx(el.dataset.t));
  const n=Object.keys(S.learn).length;const b=document.getElementById("badge");b.hidden=!n;b.textContent=n;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab===tab));
  document.documentElement.lang=S.lang;
}
document.getElementById("langChip").onclick=()=>{S.lang=S.lang==="vi"?"en":"vi";save();render()};
function go(t){tab=t;render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
function render(){hud();if(tab==="learn")renderLearn();else if(tab==="review")renderReview();else renderMe()}

function backFace(i){
  const w=W[i];const hl=esc(w.exh).replace(/___/g,`<b>${esc(w.w)}</b>`);
  return S.lang==="vi"
    ?`<div class="bw">${esc(w.w)}</div><div class="big-vi">${esc(w.vi)}</div><div class="exb"><i>${hl}</i>${w.exv?`<small>${esc(w.exv)}</small>`:""}</div><div class="hint">${tx("tapBack")}</div>`
    :`<div class="art2">${fe(w.emo)}</div><div class="big-vi" style="font-family:var(--display)">${esc(w.w)}</div><div class="exb"><i>${hl}</i></div><button class="say" style="margin:0 auto" data-say="${esc(w.ex)}">${fe("🔊")} ${tx("listen")}</button><div class="hint">${tx("tapBack")}</div>`;
}
function cardEl(i,under){
  const w=W[i];const c=document.createElement("div");c.className="card kcard"+(under?" under":"");
  c.innerHTML=`<div class="inner"><div class="face front" style="background:${grad(i)}"><div class="ctag">${fe(topicIc(w.t))} ${esc(topicName(w.t)).toUpperCase()}</div><div class="art">${fe(w.emo)}</div>
   <div class="info"><div class="nm">${esc(w.w)}</div><div class="tags">${w.ipa?`<span class="tag">${esc(w.ipa)}</span>`:""}<span class="tag">${esc(w.lvl)}</span></div><button class="say" data-say="${esc(w.w)}">${fe("🔊")} ${tx("listen")}</button><div class="hint">${tx("tapFlip")}</div></div></div>
   <div class="face back" style="background:${grad(i+3)}">${backFace(i)}</div></div>
   <div class="stamp st-r">${tx("stLearn")} ${fe("📚")}</div><div class="stamp st-l">${tx("stKnown")} ${fe("⭐")}</div>`;
  return c;
}
function renderLearn(){
  const topics=["all",...Object.keys(TOPICS)];
  $main.innerHTML=`<div class="view"><div class="cats">${topics.map(k=>`<button class="cat${S.topic===k?" on":""}" data-top="${k}">${fe(topicIc(k))} ${esc(topicName(k))} <small>${pool(k).length}</small></button>`).join("")}</div><div class="deck" id="deck"></div>
  <div class="controls">
   <div class="ctl"><button class="rb l" id="bL" aria-label="${tx("known")}">${fe("⭐")}</button>${tx("known")}</div>
   <div class="ctl"><button class="rb r" id="bR" aria-label="${tx("learn")}">${fe("📚")}</button>${tx("learn")}</div>
  </div></div>`;
  $main.querySelectorAll("[data-top]").forEach(b=>b.onclick=()=>{S.topic=b.dataset.top;buildDeck();save();renderLearn()});
  const on=$main.querySelector(".cat.on");if(on)on.scrollIntoView({inline:"center",block:"nearest"});
  const deck=document.getElementById("deck");
  while(S.pos<S.deck.length&&((S.deck[S.pos] in S.learn)||S.known.includes(S.deck[S.pos])))S.pos++;
  if(S.pos>=S.deck.length){
    deck.innerHTML=`<div class="empty"><div class="big">${fe("🏆")}</div><h3>${tx("doneTitle")}</h3><p>${tx("doneP")}</p><button class="btn" id="toRev">${tx("goReview")}</button></div>`;
    document.getElementById("toRev").onclick=()=>go("review");
    ["bL","bR"].forEach(id=>document.getElementById(id).disabled=true);return;
  }
  for(let k=1;k<=4;k++)if(S.pos+k<S.deck.length)needFe(W[S.deck[S.pos+k]].emo);
  if(S.pos+1<S.deck.length)deck.appendChild(cardEl(S.deck[S.pos+1],true));
  const c=cardEl(S.deck[S.pos],false);deck.appendChild(c);bindCard(c,S.deck[S.pos]);
  document.getElementById("bL").onclick=()=>fling(c,"left");
  document.getElementById("bR").onclick=()=>fling(c,"right");
}
function setStamps(c,dx){c.querySelector(".st-r").style.opacity=Math.max(0,Math.min(1,dx/100));c.querySelector(".st-l").style.opacity=Math.max(0,Math.min(1,-dx/100))}
function bindCard(c,i){
  let d=null;
  c.addEventListener("pointerdown",e=>{
    if(busy)return;
    const s=e.target.closest("[data-say]");if(s){say(s.dataset.say);return}
    d={x:e.clientX,y:e.clientY,dx:0,dy:0,moved:false};c.setPointerCapture(e.pointerId);c.style.transition="none";
  });
  c.addEventListener("pointermove",e=>{
    if(!d)return;d.dx=e.clientX-d.x;d.dy=e.clientY-d.y;if(Math.hypot(d.dx,d.dy)>6)d.moved=true;
    c.style.transform=`translate(${d.dx}px,${d.dy*.3}px) rotate(${d.dx/18}deg)`;setStamps(c,d.dx);
  });
  const end=()=>{
    if(!d)return;const {dx,moved}=d;d=null;
    if(!moved){c.classList.toggle("flipped");c.style.transform="";if(c.classList.contains("flipped"))say(W[i].w);return}
    if(dx>110)fling(c,"right");else if(dx<-110)fling(c,"left");
    else{c.style.transition="transform .3s cubic-bezier(.2,1.4,.4,1)";c.style.transform="";setStamps(c,0)}
  };
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
}
function fling(c,dir){
  if(busy||S.pos>=S.deck.length)return;busy=true;
  const i=S.deck[S.pos];const x=dir==="right"?innerWidth*1.2:-innerWidth*1.2;
  setStamps(c,dir==="right"?120:-120);
  c.style.transition="transform .32s ease-in";c.style.transform=`translate(${x}px,40px) rotate(${x/25}deg)`;
  buzz(15);say(W[i].w+"!");
  setTimeout(()=>{S.pos++;
    if(dir==="left"){if(!S.known.includes(i))S.known.push(i);S.stars+=1;toast(pick(tx("praise")))}
    else{S.learn[i]={p:0};pop(i)}
    save();busy=false;renderLearn();hud()},300);
}
function pop(i){
  const w=W[i];document.querySelectorAll(".mpop").forEach(x=>x.remove());
  const p=document.createElement("div");p.className="mpop";
  p.innerHTML=`<div class="av" style="background:${grad(i)}">${fe(w.emo)}</div><div class="t"><b>${tx("added")}</b><span><strong>${esc(w.w)}</strong>${S.lang==="vi"?" = "+esc(w.vi):""}</span><small>${tx("tapPop")}</small></div>`;
  p.onclick=()=>{p.remove();go("review")};
  document.body.appendChild(p);setTimeout(()=>p.classList.add("out"),2400);setTimeout(()=>p.remove(),2800);
  const b=document.getElementById("tab-review");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");
}
document.addEventListener("keydown",e=>{
  if(tab!=="learn"||busy||document.querySelector(".ov"))return;
  const c=document.querySelector(".card:not(.under)");if(!c)return;
  if(e.key==="ArrowLeft")fling(c,"left");else if(e.key==="ArrowRight")fling(c,"right");else if(e.key===" "){e.preventDefault();c.classList.toggle("flipped")}
});

/* ---------- ÔN BÀI: trò đoán hình ---------- */
let revTab="learn";
function renderReview(){
  const L=Object.keys(S.learn).map(Number).reverse(), K=S.known.slice().reverse();
  const list=revTab==="learn"?L:K;
  $main.innerHTML=`<div class="view"><div class="scroll">
   <div class="itabs"><button data-rt="learn" class="${revTab==="learn"?"on":""}">${fe("📚")} ${tx("toLearn")} <small>${L.length}</small></button><button data-rt="known" class="${revTab==="known"?"on":""}">${fe("⭐")} ${tx("knownList")} <small>${K.length}</small></button></div>
   ${revTab==="learn"&&L.length?`<button class="btn play" id="play">${tx("play")}</button>`:""}
   ${list.length?`<div class="exgrid">${list.map(i=>`<button class="exc" data-x="${i}"><div class="av" style="background:${grad(i)}">${fe(W[i].emo)}</div><div class="t"><b>${esc(W[i].w)}</b><span>${S.lang==="vi"?esc(W[i].vi):esc(W[i].lvl)}</span>${revTab==="learn"?`<div class="dots3">${[0,1,2].map(k=>`<i class="${S.learn[i].p>k?"on":""}"></i>`).join("")}</div>`:""}</div></button>`).join("")}</div>`
     :`<p class="blank">${revTab==="learn"?tx("emptyLearn"):tx("emptyKnown")}</p>`}
  </div></div>`;
  $main.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{revTab=b.dataset.rt;renderReview()});
  $main.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>wordSheet(+b.dataset.x));
  const p=document.getElementById("play");if(p)p.onclick=()=>game(L);
}
function wordSheet(i){
  const w=W[i];say(w.w);
  const isKnown=S.known.includes(i);
  const o=overlay(`<div class="pair"><div class="av" style="background:${grad(i)}">${fe(w.emo)}</div></div>
   <div><div class="q-word">${esc(w.w)}</div><div style="color:var(--muted)">${esc(w.ipa)}</div>${S.lang==="vi"?`<div class="vi" style="margin-top:6px">${esc(w.vi)}</div>`:""}</div>
   <div class="ex">“${esc(w.ex)}”${S.lang==="vi"&&w.exv?`<br><span style="font-style:normal">${esc(w.exv)}</span>`:""}</div>
   <div class="acts"><button class="btn ghost" id="wSay">${fe("🔊")} ${tx("listen")}</button>${isKnown?`<button class="btn" id="wAgain">${tx("learnAgain")}</button>`:""}<button class="btn ghost" id="wClose">${tx("close")}</button></div>`);
  o.querySelector("#wSay").onclick=()=>say(w.ex);
  o.querySelector("#wClose").onclick=()=>{closeOv(o);renderReview()};
  const a=o.querySelector("#wAgain");if(a)a.onclick=()=>{S.known=S.known.filter(k=>k!==i);S.learn[i]={p:0};save();closeOv(o);revTab="learn";render()};
}
// Mỗi lượt tối đa 8 câu; xen kẽ "nghe/đọc từ → chọn hình" và "nhìn hình → chọn từ". Đúng 3 lần = thuộc.
function game(list){
  const qs=shuffle(list).slice(0,8);let k=0,score=0;
  const o=overlay("");const sh=o.querySelector(".sheet");
  const others=i=>{const used=new Set([W[i].emo]),out=[];for(const j of shuffle(W.map((_,x)=>x))){if(out.length===3)break;if(!used.has(W[j].emo)&&W[j].w!==W[i].w){used.add(W[j].emo);out.push(j)}}return out};
  function show(){
    if(k>=qs.length){hearts(["⭐","🎉","🏆","🌈"]);sh.innerHTML=`<div style="font-size:72px">${fe("🏆")}</div><div class="mt" style="transform:none;font-size:36px">${tx("finish")}</div><p class="tag1">${tx("finishP")(score)}</p><div class="acts"><button class="btn" id="gAgain">${tx("again")}</button><button class="btn ghost" id="gClose">${tx("close")}</button></div>`;
      sh.querySelector("#gClose").onclick=()=>{closeOv(o);render()};
      sh.querySelector("#gAgain").onclick=()=>{closeOv(o);const L=Object.keys(S.learn).map(Number);if(L.length)game(L);else render()};return}
    const i=qs[k],opts=shuffle([i,...others(i)]),pic=k%2===0;
    for(const j of opts)needFe(W[j].emo);
    sh.innerHTML=`<div class="qbar">${qs.map((_,x)=>`<i class="${x<k?"on":""}"></i>`).join("")}</div>
     ${pic?`<h3 style="margin:0;color:var(--muted)">${tx("qPick")}</h3><div class="q-word">${esc(W[i].w)}</div><button class="say" style="margin:0 auto" id="qSay">${fe("🔊")} ${tx("listen")}</button><div class="q-pics">${opts.map(j=>`<button class="q-pic" data-a="${j}" aria-label="${esc(W[j].w)}">${fe(W[j].emo)}</button>`).join("")}</div>`
       :`<h3 style="margin:0;color:var(--muted)">${tx("qWord")}</h3><div class="q-art">${fe(W[i].emo)}</div><div class="opts">${opts.map(j=>`<button class="opt" data-a="${j}">${esc(W[j].w)}</button>`).join("")}</div>`}`;
    if(pic){say(W[i].w);sh.querySelector("#qSay").onclick=()=>say(W[i].w)}
    sh.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
      if(sh.dataset.lock)return;sh.dataset.lock=1;
      const a=+b.dataset.a,ok=a===i;
      sh.querySelectorAll("[data-a]").forEach(x=>{if(+x.dataset.a===i)x.classList.add("ok");else if(x===b)x.classList.add("no")});
      if(ok){score++;S.stars+=2;buzz(20);say(W[i].w+"!");
        if(S.learn[i]){S.learn[i].p++;if(S.learn[i].p>=3){delete S.learn[i];if(!S.known.includes(i))S.known.push(i);toast(`${W[i].w}: ${tx("mastered")}`);hearts(["⭐","🏆","🎉"])}else toast(pick(tx("right")))}
      }else{buzz([40,40,40]);say(W[i].w);toast(`${tx("wrong")} ${W[i].w}${S.lang==="vi"?" = "+W[i].vi:""}`)}
      save();hud();
      setTimeout(()=>{delete sh.dataset.lock;k++;show()},ok?900:1700);
    });
  }
  show();
}

/* ---------- BÉ ---------- */
let confirmReset=false;
function renderMe(){
  $main.innerHTML=`<div class="view"><div class="scroll">
   <div class="streak">${tx("streak")(S.streak.n)}</div>
   <div class="stats">
    <div class="stat"><b>${S.stars}</b><span>${fe("⭐")} ${tx("stars")}</span></div>
    <div class="stat"><b>${S.known.length}</b><span>${fe("🏆")} ${tx("learned")}</span></div>
    <div class="stat"><b>${Object.keys(S.learn).length}</b><span>${fe("📚")} ${tx("learning")}</span></div>
    <div class="stat"><b>${W.length}</b><span>${fe("🃏")} Flash card</span></div>
   </div>
   <div class="set"><label>${tx("lang")}</label><div class="seg" id="segLang"><button data-v="vi">🇻🇳 Tiếng Việt</button><button data-v="en">🇬🇧 English</button></div></div>
   <div class="set"><a class="btn ghost" href="${ARENA_URL}" style="display:block;text-align:center;text-decoration:none">${fe("🏟️")} ${tx("back")}</a></div>
   <div class="set"><button class="btn ghost" id="reset" style="width:100%">${confirmReset?tx("resetSure"):tx("reset")}</button></div>
  </div></div>`;
  document.querySelectorAll("#segLang button").forEach(b=>{b.classList.toggle("on",S.lang===b.dataset.v);b.onclick=()=>{S.lang=b.dataset.v;save();render()}});
  document.getElementById("reset").onclick=()=>{if(!confirmReset){confirmReset=true;return renderMe()}
    S=Object.assign(fresh(),{lang:S.lang,streak:S.streak});buildDeck();S.bank=W.length;confirmReset=false;save();render()};
}
render();
</script>
