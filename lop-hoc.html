<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AZ Vocab Live — Lớp học</title>
<meta name="theme-color" content="#e0102b" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* Sân khấu lớp học: máy chiếu (giáo viên) chữ to · điện thoại (học viên) nút màu to bằng ngón tay */
  :root{
    --bg:#fffaf3; --card:#fffdf9; --soft:#fdf3e4; --line:#f0e3cf; --ink:#241a12; --muted:#6b5c50;
    --red:#e0102b; --red-ink:#8f0a1c; --red-bg:#fde6e8; --gold:#c47f0e; --ok:#1e7a4c; --ok-bg:#e3f5ea;
    --a:#e0102b; --b:#1d6fa5; --c:#d98a00; --d:#1e7a4c;
    --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#1f1612; --card:#2a1f19; --soft:#33251c; --line:#4a382c; --ink:#fbeee2; --muted:#cbb6a6;
    --red:#ff5a68; --red-ink:#b3202f; --red-bg:#3d1c1f; --gold:#f0a83d; --ok:#5fd394; --ok-bg:#1d3527; color-scheme:dark } }
  *{ box-sizing:border-box; }
  html,body{ min-height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:500 16px/1.45 var(--body); -webkit-tap-highlight-color:transparent; }
  button,input,select,textarea{ font:inherit; color:inherit; }
  button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{ outline:3px solid var(--red); outline-offset:2px; }
  [hidden]{ display:none !important; }
  .app{ min-height:100vh; max-width:1180px; margin:0 auto; padding:14px 16px 28px; display:flex; flex-direction:column; gap:16px; }
  .top{ display:flex; align-items:center; gap:10px; }
  .logo{ width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:var(--red); color:#fff; font:800 15px var(--display); box-shadow:0 3px 0 var(--red-ink); text-decoration:none; }
  .brand{ font:800 18px/1.1 var(--display); } .brand small{ display:block; font:700 11px var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--red); }
  .sp{ flex:1; }
  .pill{ padding:5px 12px; border-radius:99px; background:var(--soft); color:var(--muted); font:700 12.5px var(--body); white-space:nowrap; }
  .pill.live{ background:var(--ok-bg); color:var(--ok); }
  .icon-btn{ width:40px; height:40px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); cursor:pointer; display:grid; place-items:center; }
  .screen{ flex:1; display:flex; flex-direction:column; gap:16px; animation:up .35s cubic-bezier(.22,1,.36,1); }
  @keyframes up{ from{ opacity:0; transform:translateY(12px); } }
  h1{ margin:0; font:800 clamp(28px,5vw,48px)/1.1 var(--display); text-wrap:balance; }
  h2{ margin:0; font:800 22px var(--display); }
  .muted{ color:var(--muted); }
  .card{ background:var(--card); border:1.5px solid var(--line); border-radius:22px; padding:18px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 22px; border-radius:16px; border:0; cursor:pointer;
    background:var(--red); color:#fff; font:800 17px var(--display); box-shadow:0 5px 0 var(--red-ink); transition:transform .12s ease; text-decoration:none; }
  .btn:hover:not(:disabled){ transform:translateY(-2px); } .btn:active:not(:disabled){ transform:translateY(3px); box-shadow:0 2px 0 var(--red-ink); }
  .btn:disabled{ opacity:.45; cursor:default; box-shadow:none; }
  .btn.ghost{ background:var(--card); color:var(--ink); border:1.5px solid var(--line); box-shadow:0 3px 0 var(--line); }
  .btn.sm{ min-height:40px; padding:0 14px; font-size:14px; border-radius:12px; }
  .btn.big{ min-height:64px; font-size:21px; width:100%; }
  .row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  /* Lumina */
  .lumi{ position:relative; display:block; width:150px; flex:none; }
  .rig{ position:relative; display:block; transform-origin:50% 100%; filter:drop-shadow(0 10px 16px rgba(0,0,0,.18)); animation:breath 3.4s ease-in-out infinite; }
  .rig img{ display:block; width:100%; height:auto; }
  .rig .tl,.hd{ position:absolute; left:0; top:0; width:100%; height:100%; }
  .rig .tl{ transform-origin:30.65% 75.38%; animation:tail 1.8s ease-in-out infinite; }
  .hd{ transform-origin:51.08% 43.27%; animation:head 4.6s ease-in-out infinite; } .hd img{ position:absolute; inset:0; }
  .lid{ position:absolute; border-radius:50%; background:radial-gradient(ellipse at 50% 30%,#FFDDB8,#F6C99C); border-bottom:2px solid #4A2A22; transform:scaleY(0); transform-origin:50% 0; animation:blink 4.2s infinite; }
  .lid.l{ left:36.84%; top:24.62%; width:13%; height:7.31%; } .lid.r{ left:61.3%; top:21.15%; width:10.53%; height:7.69%; }
  .lumi.cheer .rig{ animation:hop .7s ease 3; }
  @keyframes breath{ 50%{ transform:scale(1.015,1.035); } } @keyframes tail{ 0%,100%{ transform:rotate(-7deg); } 50%{ transform:rotate(11deg); } }
  @keyframes head{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2.5deg); } } @keyframes blink{ 0%,90%,100%{ transform:scaleY(0); } 94%,96%{ transform:scaleY(1); } }
  @keyframes hop{ 30%{ transform:translateY(-22px) rotate(-5deg); } 55%{ transform:scale(1.07,.93); } }
  .say{ position:relative; margin:0; padding:12px 16px; border-radius:20px 20px 20px 6px; background:var(--red-bg); font:700 17px/1.4 var(--body); max-width:560px; }
  .say b{ color:var(--red); font-family:var(--display); }
  /* trang đầu */
  .hero{ display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .hero .txt{ flex:1; min-width:260px; display:flex; flex-direction:column; gap:14px; }
  .choices{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .choice{ display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:18px; border-radius:20px; border:2px solid var(--line); background:var(--card); cursor:pointer; text-align:left; transition:transform .15s ease, border-color .15s ease; }
  .choice:hover{ transform:translateY(-3px); border-color:var(--red); }
  .choice b{ font:800 20px var(--display); } .choice > span{ color:var(--muted); font-size:14px; }
  .ci{ width:84px; height:84px; border-radius:22px; display:grid; place-items:center; transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
  .ci svg{ width:62px; height:62px; overflow:visible; }
  .ci-t{ background:var(--red-bg); color:var(--red); } .ci-s{ background:color-mix(in srgb, var(--b) 16%, transparent); color:var(--b); }
  .choice:hover .ci{ transform:rotate(-6deg) scale(1.08); }
  .ci .bar{ transform-box:fill-box; transform-origin:50% 100%; animation:grow 2.4s cubic-bezier(.34,1.56,.64,1) infinite; } .ci .b2{ animation-delay:.2s; } .ci .b3{ animation-delay:.4s; }
  .ci .stick{ transform-origin:52px 50px; animation:point 2.4s ease-in-out infinite; }
  .ci .spark{ transform-box:fill-box; transform-origin:center; animation:tw 2.4s ease-in-out infinite; }
  .ci .k{ animation:tap 2s steps(1) infinite; opacity:.35; } .ci .k2{ animation-delay:.5s; } .ci .k3{ animation-delay:1s; } .ci .k4{ animation-delay:1.5s; }
  .ci .ring{ transform-box:fill-box; transform-origin:center; animation:ripple 2s ease-out infinite; }
  .ci .phone{ transform-origin:50% 90%; animation:wob 2s ease-in-out infinite; }
  @keyframes grow{ 0%,15%{ transform:scaleY(.15); } 45%,85%{ transform:none; } 100%{ transform:scaleY(.15); } }
  @keyframes point{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(-14deg); } }
  @keyframes tw{ 0%,40%,100%{ transform:scale(0); opacity:0; } 60%{ transform:scale(1) rotate(45deg); opacity:1; } }
  @keyframes tap{ 0%{ opacity:1; } 25%,100%{ opacity:.35; } }
  @keyframes ripple{ 0%{ transform:scale(.3); opacity:.9; } 70%,100%{ transform:scale(1.6); opacity:0; } }
  @keyframes wob{ 0%,100%{ transform:rotate(-4deg); } 50%{ transform:rotate(4deg); } }
  .note{ font-size:13.5px; color:var(--muted); padding:10px 14px; border-radius:14px; background:var(--soft); }
  /* thiết lập */
  .tabs{ display:flex; gap:4px; padding:4px; border-radius:14px; background:var(--soft); width:max-content; max-width:100%; overflow-x:auto; }
  .tabs button{ border:0; background:transparent; padding:9px 16px; border-radius:10px; cursor:pointer; font-weight:800; color:var(--muted); white-space:nowrap; }
  .tabs button.on{ background:var(--card); color:var(--ink); box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
  label.f{ display:flex; flex-direction:column; gap:6px; font-weight:700; font-size:14px; }
  select,textarea,input[type=text]{ width:100%; min-height:48px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); padding:10px 12px; font:500 15px var(--body); }
  textarea{ min-height:160px; resize:vertical; line-height:1.5; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chips button{ min-height:40px; padding:0 14px; border-radius:99px; border:1.5px solid var(--line); background:var(--card); cursor:pointer; font-weight:800; }
  .chips button.on{ border-color:var(--red); background:var(--red-bg); color:var(--red); }
  .pool{ font-weight:700; color:var(--ok); } .pool.bad{ color:var(--red); }
  .help{ font-size:13px; color:var(--muted); background:var(--soft); border-radius:14px; padding:10px 14px; line-height:1.6; }
  .help code{ background:var(--card); padding:1px 6px; border-radius:6px; font-size:12.5px; }
  /* trình soạn câu hỏi */
  .qlist{ display:flex; flex-direction:column; gap:10px; }
  .qe{ display:flex; flex-direction:column; gap:8px; padding:14px; border-radius:18px; border:1.5px solid var(--line); background:var(--card); }
  .qe-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .qe-n{ font:800 15px var(--display); color:var(--muted); }
  .tag{ padding:3px 10px; border-radius:99px; font:800 12px var(--body); background:var(--soft); }
  .tag.mcq{ color:var(--b); } .tag.tf{ color:var(--gold); } .tag.type{ color:var(--ok); }
  .qe input[type=text]{ min-height:42px; }
  .qe-opts{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .qe-o{ display:flex; align-items:center; gap:6px; }
  .qe-o button{ flex:none; width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:var(--card); cursor:pointer; font-weight:800; color:var(--muted); }
  .qe-o button.ok{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .qe-x{ margin-left:auto; border:0; background:none; color:var(--muted); cursor:pointer; font-size:18px; padding:4px 8px; }
  .qe select{ min-height:36px; width:auto; padding:4px 8px; font-size:13px; border-radius:10px; }
  .x2{ border:1.5px solid var(--line); background:var(--card); border-radius:10px; padding:4px 10px; font:800 13px var(--body); cursor:pointer; }
  .x2.on{ background:var(--gold); border-color:var(--gold); color:#fff; }
  @media (max-width:560px){ .qe-opts{ grid-template-columns:1fr; } }
  /* sảnh chờ */
  .lobby{ display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; }
  .pinbox{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px; border-radius:22px; background:var(--card); border:1.5px solid var(--line); }
  .pin-l{ font:800 13px var(--body); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .pin{ font:800 clamp(48px,8vw,84px)/1 var(--display); letter-spacing:.06em; color:var(--ink); font-variant-numeric:tabular-nums; }
  .qr{ background:#fff; padding:10px; border-radius:14px; } .qr img,.qr canvas{ display:block; width:168px; height:168px; }
  .url{ font:700 13px var(--body); color:var(--muted); word-break:break-all; text-align:center; max-width:260px; }
  @media (max-width:760px){ .lobby{ grid-template-columns:1fr; } }
  .players{ display:flex; flex-wrap:wrap; gap:8px; }
  .pl{ position:relative; padding:8px 14px; border-radius:99px; background:var(--card); border:1.5px solid var(--line); font:800 17px var(--display); animation:pop .4s cubic-bezier(.34,1.56,.64,1); cursor:pointer; }
  .pl:hover{ border-color:var(--red); }
  .pl.kick{ background:var(--red); color:#fff; border-color:var(--red); }
  .pl.bot{ border-style:dashed; color:var(--muted); }
  @keyframes pop{ from{ transform:scale(.3); opacity:0; } }
  .count{ font:800 clamp(40px,7vw,64px)/1 var(--display); color:var(--red); }
  .credit{ font-size:12px; color:var(--muted); }
  /* câu hỏi */
  .qbar{ display:flex; align-items:center; gap:12px; }
  .qbar .n{ font:800 16px var(--display); color:var(--muted); }
  .timer{ position:relative; width:76px; height:76px; flex:none; }
  .timer svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .timer circle{ fill:none; stroke-width:8; } .timer .bg{ stroke:var(--soft); } .timer .fg{ stroke:var(--red); stroke-linecap:round; transition:stroke-dashoffset .25s linear; }
  .timer b{ position:absolute; inset:0; display:grid; place-items:center; font:800 26px var(--display); font-variant-numeric:tabular-nums; }
  .timer.low b{ color:var(--red); animation:pulse .5s ease infinite alternate; } @keyframes pulse{ to{ transform:scale(1.15); } }
  .prompt{ text-align:center; padding:26px 16px; }
  .prompt small{ display:block; font:800 13px var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .prompt .w{ font:800 clamp(30px,6vw,64px)/1.15 var(--display); word-break:break-word; text-wrap:balance; }
  .ready{ height:10px; border-radius:99px; background:var(--soft); overflow:hidden; } .ready i{ display:block; height:100%; width:0; background:var(--red); animation:fill linear forwards; }
  @keyframes fill{ to{ width:100%; } }
  .x2b{ display:inline-block; margin-left:8px; padding:2px 10px; border-radius:99px; background:var(--gold); color:#fff; font:800 14px var(--body); vertical-align:middle; animation:pulse .6s ease infinite alternate; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt{ position:relative; display:flex; align-items:center; gap:14px; min-height:84px; padding:14px 18px; border-radius:18px; border:0; color:#fff; text-align:left;
    font:800 clamp(17px,2.4vw,26px)/1.25 var(--display); box-shadow:0 5px 0 rgba(0,0,0,.22); transition:opacity .25s ease, transform .2s ease; animation:optIn .35s cubic-bezier(.34,1.56,.64,1) both; }
  .opt:nth-child(2){ animation-delay:.06s; } .opt:nth-child(3){ animation-delay:.12s; } .opt:nth-child(4){ animation-delay:.18s; }
  @keyframes optIn{ from{ transform:scale(.85); opacity:0; } }
  .opt .sh{ flex:none; width:36px; height:36px; display:grid; place-items:center; font-size:26px; }
  .o0{ background:var(--a); } .o1{ background:var(--b); } .o2{ background:var(--c); } .o3{ background:var(--d); }
  .opt.dim{ opacity:.28; } .opt.right{ transform:scale(1.03); box-shadow:0 0 0 5px var(--card), 0 0 0 9px var(--ok); }
  .opt .cnt{ margin-left:auto; padding:2px 12px; border-radius:99px; background:rgba(0,0,0,.25); font-size:18px; }
  .typebox{ text-align:center; padding:20px; border-radius:20px; background:var(--card); border:2px dashed var(--line); font:800 22px var(--display); color:var(--muted); }
  .accepted{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .accepted span{ padding:8px 16px; border-radius:99px; background:var(--ok-bg); color:var(--ok); font:800 22px var(--display); }
  .answered{ font:800 18px var(--display); }
  /* bảng điểm có xếp vị trí */
  .board{ position:relative; display:flex; flex-direction:column; gap:8px; max-width:760px; width:100%; margin:0 auto; }
  .br{ display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:16px; background:var(--card); border:1.5px solid var(--line); will-change:transform; }
  .br .r{ width:38px; font:800 22px var(--display); color:var(--muted); text-align:center; }
  .br .nm{ flex:1; min-width:0; font:800 21px var(--display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .br .mv{ font:800 14px var(--body); min-width:42px; text-align:center; }
  .br .mv.up{ color:var(--ok); } .br .mv.down{ color:var(--red); }
  .br .g{ font:800 14px var(--body); color:var(--ok); } .br .s{ font:800 21px var(--display); color:var(--gold); font-variant-numeric:tabular-nums; min-width:80px; text-align:right; }
  .br.top1{ border-color:#f2b705; background:color-mix(in srgb, #f2b705 14%, var(--card)); }
  .br.flash{ animation:flash 1.2s ease 1.1s; } @keyframes flash{ 30%{ box-shadow:0 0 0 4px var(--ok); } }
  /* bục vinh danh lần lượt */
  .podium{ display:grid; grid-template-columns:1fr 1.15fr 1fr; align-items:end; gap:10px; max-width:680px; width:100%; margin:0 auto; padding-top:40px; min-height:330px; }
  .pc{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; opacity:0; transform:translateY(80px); transition:opacity .4s ease, transform .7s cubic-bezier(.34,1.56,.64,1); }
  .pc.show{ opacity:1; transform:none; }
  .pc .nm{ font:800 clamp(17px,2.6vw,26px) var(--display); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pc .s{ font:800 16px var(--body); color:var(--gold); }
  .pc .blk{ width:100%; border-radius:16px 16px 6px 6px; display:grid; place-items:center; color:#fff; font:800 44px var(--display); }
  .p1 .blk{ height:180px; background:linear-gradient(180deg,#f2b705,#c98f00); } .p2 .blk{ height:126px; background:linear-gradient(180deg,#b8c1cc,#8a95a3); } .p3 .blk{ height:94px; background:linear-gradient(180deg,#cd7f32,#a35f1c); }
  .crown{ font-size:38px; animation:sway 2.4s ease-in-out infinite; } @keyframes sway{ 50%{ transform:rotate(10deg) translateY(-4px); } }
  .drum{ text-align:center; font:800 22px var(--display); color:var(--muted); animation:pulse .3s ease infinite alternate; }
  .conf{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50; }
  .conf i{ position:absolute; top:-16px; width:10px; height:14px; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translate(var(--dx),110vh) rotate(var(--r)); } }
  /* học viên */
  .ph{ max-width:560px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .ph.center{ align-items:center; text-align:center; }
  .ph .opts{ gap:10px; } .ph .opt{ min-height:120px; justify-content:center; text-align:center; flex-direction:column; gap:6px; font-size:18px; cursor:pointer; }
  .ph .opt:active{ transform:scale(.96); }
  .ph .opts.two .opt{ min-height:180px; font-size:24px; }
  .pinput{ font:800 34px var(--display) !important; text-align:center; letter-spacing:.2em; min-height:64px !important; }
  .res{ text-align:center; padding:28px 16px; border-radius:24px; }
  .res.ok{ background:var(--ok-bg); } .res.no{ background:var(--red-bg); }
  .res .big{ font:800 42px/1.1 var(--display); } .res.ok .big{ color:var(--ok); } .res.no .big{ color:var(--red); }
  .res .pts{ font:800 22px var(--display); margin-top:6px; }
  .rankcard{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:20px; background:var(--card); border:1.5px solid var(--line); }
  .rankcard .rk{ font:800 44px/1 var(--display); color:var(--red); }
  .rankcard .gap{ font-size:14.5px; color:var(--muted); } .rankcard .gap b{ color:var(--ink); }
  .streak{ display:inline-flex; align-items:center; gap:4px; padding:4px 12px; border-radius:99px; background:color-mix(in srgb, #ff6b1a 18%, transparent); color:#d9480f; font:800 16px var(--display); }
  .err{ color:var(--red); font-weight:700; }
  @media (max-width:560px){ .opts{ grid-template-columns:1fr; } .opt{ min-height:68px; } .ph .opts{ grid-template-columns:1fr 1fr; } .lumi{ width:110px; } }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } .pc{ opacity:1; transform:none; } }
  /* đếm ngược 3-2-1-GO */
  .cd{ position:relative; height:clamp(150px,28vh,250px); display:grid; place-items:center; }

  // ---------- nguồn câu hỏi ----------

  function vocabPool(){

  // Dán nhanh: [30s] [x2] Câu hỏi | *Đúng | Sai…  ·  Câu | Đúng/Sai  ·  Câu | =đáp án 1 / đáp án 2
  function parseQuiz(text){
    const out = [], errs = [];
    text.split(/\n/).forEach((raw, ln) => {
      let l = raw.trim(); if(!l) return;

      while((m = l.match(/^\[(\d{1,3})s\]\s*/i)) || (m = l.match(/^\[x2\]\s*/i))){ if(/x2/i.test(m[0])) x2 = true; else time = +m[1]; l = l.slice(m[0].length); }

  function drawQ(){

        '<input type="text" data-f="p" data-k="' + k + '" value="' + esc(q.p) + '" placeholder="Nội dung câu hỏi">' + body + '</div>';

  // ---------- Lumina soạn giúp (AI) ----------

  function aiPrompt(){
    const ty = ai.types.map(t => ({ mcq:"multiple choice", tf:"true/false", type:"typed answer" })[t]).join(", ");

      "Multiple choice: Question | *correct option | wrong option | wrong option | wrong option\n" +

      "Typed answer: Question | =accepted answer / other accepted spelling\n\n" +

  function aiChips(box, vals, key, label, multi){

  async function aiRun(){
    const st = $("aiSt"), go = $("aiGo"), stop = $("aiStop"), res = $("aiRes"), out = $("aiOut");
    if(ai.text.trim().length < 3){ st.textContent = "Dán chủ đề hoặc bài đọc vào ô trên đã nha."; $("aiText").focus(); return; }
    if(!window.LIVE_AI){ // chưa có AI trên trang: chép lệnh để dán vào Claude/ChatGPT
      try{ await navigator.clipboard.writeText(aiPrompt()); st.textContent = "📋 Đã chép lệnh. Dán vào Claude hoặc ChatGPT, rồi chép kết quả vào ô bên dưới."; }
      catch(e){ st.textContent = "Không chép tự động được, chép lệnh trong ô bên dưới nhé."; out.value = aiPrompt(); }
      res.hidden = false; out.focus(); return;
    }
    aiCtl = new AbortController(); go.disabled = true; stop.hidden = false; st.className = "ai-st run"; st.textContent = "Lumina đang soạn";
    res.hidden = false; out.value = "";
    try{
      const text = await window.LIVE_AI(aiPrompt(), t => { out.value = t; st.textContent = "Lumina đang viết"; }, aiCtl.signal);
      const lines = String(text || "").split(/\n/).map(s => s.replace(/^\s*(?:\d+[.)]|[-•*]\s)\s*/, "").trim()).filter(s => s.includes("|"));
      out.value = lines.join("\n"); ai.out = out.value; aiSave();
      const n = parseQuiz(out.value).out.length;
      st.className = "ai-st"; st.textContent = n ? "✓ Xong " + n + " câu. Xem lại rồi bấm “Thêm vào bộ câu”." : "Lumina viết chưa đúng mẫu, bấm soạn lại nha.";
    }catch(e){
      st.className = "ai-st";
      const code = e && e.code;
      st.textContent = code === "cancelled" ? "Đã dừng." : code === "not_granted" ? "Chưa cho phép dùng Claude nên Lumina chưa soạn được." : code === "rate_limited" ? "Lumina hơi mệt, chờ một phút rồi thử lại nha." : code === "unavailable" ? "Trang này chưa nối được Claude nên Lumina chưa soạn được." : "Lumina chưa soạn được, thử lại sau nha.";
      if(e && e.text){ out.value = e.text; }
    }finally{ go.disabled = false; stop.hidden = true; aiCtl = null; }
  }

  async function library(box){

  function reveal(){
    if(ph !== "question") return;
    stopTick(); ph = "reveal"; speedUp(false); duck(.1);
    const q = qs[i], r = roster(), dist = (q.o || []).map(() => 0); let right = 0;
    const before = ranking().map(p => p.id);
    r.forEach(p => {
      if(!(p.id in scores)) scores[p.id] = 0;
      const a = answers[p.id]; let gain = 0;
      if(a && q.t !== "type" && dist[+a.c] != null) dist[+a.c]++;
      if(isRight(q, a)){
        right++; streak[p.id] = (streak[p.id] || 0) + 1;
        let t = a.ms != null ? a.ms : (a.at && a.at.toMillis && qAtMs ? a.at.toMillis() - qAtMs : q.time * 500);
        t = Math.min(1, Math.max(0, t / (q.time * 1000)));
        gain = Math.round(1000 * (1 - t / 2)) * (q.x2 ? 2 : 1) + Math.min(500, (streak[p.id] - 1) * 100);
      } else streak[p.id] = 0;
      scores[p.id] += gain; p.gain = gain; p.ok = isRight(q, a); p.ans = !!a;
    });
    logQuestion(q, r);
    before.forEach((id, k) => { prevRank[id] = k + 1; });
    const rank = ranking(), me = {};
    rank.forEach((p, k) => { if(p.id.startsWith("bot")) return; const ahead = rank[k - 1];
      const rp = r.find(x => x.id === p.id) || {};
      me[p.id] = [p.s, k + 1, rp.gain || 0, rp.ok ? 1 : 0, streak[p.id] || 0, ahead ? ahead.n : "", ahead ? ahead.s - p.s : 0]; });
    const pct = r.length ? right / r.length : 0;
    const line = !r.length ? "Chưa có ai chơi, Lumina buồn ghê 🥲" : pct >= .7 ? "Lớp mình đỉnh vậy trời! 🔥" : pct >= .35 ? "Cũng được, nhưng chưa đủ đô nha!" : "Ơ kìa, câu này học rồi mà ta 😅";
    upRoom({ ph:"reveal", res:{ ok:q.ok || null, acc:q.acc || null, dist, me, np:rank.length } }).catch(() => {});
    if(q.t === "type"){ const tb = view.querySelector(".typebox"); if(tb) tb.outerHTML = '<div class="accepted">' + q.acc.map(x => '<span>✓ ' + esc(x) + '</span>').join("") + '</div>'; }
    else view.querySelectorAll(".opt").forEach((el, k) => { el.classList.add(q.ok.includes(k) ? "right" : "dim"); el.insertAdjacentHTML("beforeend", '<span class="cnt">' + (dist[k] || 0) + '</span>'); });
    const ans = $("ans"); if(ans) ans.textContent = right + "/" + r.length + " trả lời đúng";
    const sk = $("skip"); if(sk) sk.outerHTML = '<p class="say" style="flex:1"><b>Lumina:</b> ' + line + '</p><button class="btn" id="toBoard" type="button">Bảng xếp hạng →</button>';
    $("toBoard").addEventListener("click", board);
    beep(pct >= .5 ? 880 : 330, .3, "triangle", .14);
  }
  function ranking(){ const r = roster(), nm = {}; r.forEach(p => nm[p.id] = p.n);
    return Object.keys(scores).filter(id => id in nm).map(id => ({ id, n:nm[id], s:scores[id] })).sort((a, b) => b.s - a.s); }
  function board(){
    ph = "board"; playMusic("lobby", .3);
    const rank = ranking(), last = i >= qs.length - 1, show = rank.slice(0, 5);
    upRoom({ ph:"board" }).catch(() => {});
    view.innerHTML = '<div class="row"><h1>Bảng xếp hạng</h1><span class="sp"></span><span class="pill">Sau câu ' + (i + 1) + '/' + qs.length + '</span></div>' +
      '<div class="board" id="brd">' + show.map((p, k) => {
        const pr = prevRank[p.id] || k + 1, mv = pr - (k + 1);
        return '<div class="br' + (k === 0 ? " top1" : "") + (mv > 0 ? " flash" : "") + '" data-from="' + (pr - (k + 1)) + '"><span class="r">' + (k + 1) + '</span><span class="nm">' + esc(p.n) + '</span>' +
          '<span class="mv ' + (mv > 0 ? "up" : mv < 0 ? "down" : "") + '">' + (mv > 0 ? "▲" + mv : mv < 0 ? "▼" + (-mv) : "") + '</span>' +
          '<span class="s" data-to="' + p.s + '" data-from-s="' + Math.max(0, p.s - (lastGain(p.id))) + '">' + fmt(Math.max(0, p.s - lastGain(p.id))) + '</span></div>'; }).join("") +
      (rank.length ? "" : '<p class="muted">Chưa có điểm.</p>') + '</div>' +
      '<div class="row"><span class="sp"></span><button class="btn big" style="max-width:360px" id="go" type="button">' + (last ? "Xem ai vô địch 👑" : "Câu tiếp ▶") + '</button></div>';
    // xếp vị trí: hàng đi từ vị trí cũ sang vị trí mới, điểm chạy lên
    const rows = [...view.querySelectorAll(".br")];
    rows.forEach(el => { const from = +el.dataset.from, h = el.getBoundingClientRect().height + 8; el.style.transform = "translateY(" + (from * h) + "px)"; if(from > 4 || from < -4) el.style.opacity = "0"; });
    requestAnimationFrame(() => requestAnimationFrame(() => rows.forEach(el => { el.style.transition = "transform .9s cubic-bezier(.34,1.3,.64,1) .35s, opacity .4s ease .35s"; el.style.transform = "none"; el.style.opacity = "1"; })));
    view.querySelectorAll("[data-to]").forEach(el => { const to = +el.dataset.to, from = +el.dataset.fromS, t0 = performance.now() + 350;
      const step = now => { const p = Math.min(1, Math.max(0, (now - t0) / 900)); el.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)))); if(p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); });
    $("go").addEventListener("click", () => last ? end() : next());
  }
  function lastGain(id){ const q = qs[i]; const a = answers[id]; if(!isRight(q, a)) return 0; let t = a.ms != null ? a.ms : (a.at && a.at.toMillis && qAtMs ? a.at.toMillis() - qAtMs : q.time * 500);
    t = Math.min(1, Math.max(0, t / (q.time * 1000))); return Math.round(1000 * (1 - t / 2)) * (q.x2 ? 2 : 1) + Math.min(500, ((streak[id] || 1) - 1) * 100); }
  async function end(){
    stopTick(); ph = "end"; stopMusic();
    const rank = ranking(), top = rank.slice(0, 3), me = {}; finalRank = rank;
    rank.forEach((p, k) => { if(!p.id.startsWith("bot")) me[p.id] = [p.s, k + 1, 0, 0, 0, "", 0]; });
    upRoom({ ph:"end", res:{ me, np:rank.length, top:top.map(p => ({ n:p.n, s:p.s })) } }).catch(() => {});
    return drawEnd(false);
  }
  async function drawEnd(instant){
    const rank = finalRank, top = rank.slice(0, 3);
    const col = (x, cls, place) => '<div class="pc ' + cls + '" id="pod' + place + '">' + (place === 1 ? '<span class="crown">👑</span>' : '') + '<span class="nm">' + (x ? esc(x.n) : "—") + '</span><span class="s">' + (x ? fmt(x.s) + " điểm" : "") + '</span><div class="blk">' + place + '</div></div>';
    view.innerHTML = '<div class="row"><h1>Ai là quán quân?</h1><span class="sp"></span><span class="lumi" id="endLumi" style="width:110px">' + LUMI + '</span></div>' +
      '<p class="drum" id="drum">🥁 Trống đâu… trống đâu…</p>' +
      '<div class="podium">' + col(top[1], "p2", 2) + col(top[0], "p1", 1) + col(top[2], "p3", 3) + '</div>' +
      '<div class="board" id="rest" hidden>' + rank.slice(3, 10).map((x, k) => '<div class="br"><span class="r">' + (k + 4) + '</span><span class="nm">' + esc(x.n) + '</span><span class="s">' + fmt(x.s) + '</span></div>').join("") + '</div>' +
      '<div class="row" id="endBtns" hidden><button class="btn ghost" id="again" type="button">↻ Chơi lại (giữ người chơi)</button><button class="btn ghost" id="newset" type="button">⚙ Bộ câu mới</button><span class="sp"></span><button class="btn" id="rep" type="button">📊 Báo cáo trận</button></div>';
    if(instant){ ["pod3", "pod2", "pod1"].forEach(id => $(id).classList.add("show")); $("drum").textContent = top[0] ? "👏 Quán quân: " + top[0].n + "!" : "Hết trận!"; }
    else {
    drumroll(1600); await wait(1700); if(ph !== "end") return; $("pod3").classList.add("show"); beep(523, .2, "triangle", .14);
    drumroll(1600); await wait(1800); if(ph !== "end") return; $("pod2").classList.add("show"); beep(659, .2, "triangle", .14);
    drumroll(2200); await wait(2400); if(ph !== "end") return; $("pod1").classList.add("show"); $("drum").textContent = top[0] ? "👏 Quán quân: " + top[0].n + "!" : "Hết trận!";
    $("endLumi").classList.add("cheer"); confettiBurst();
    setTimeout(() => { if(ph === "end") playMusic("lobby", .4); }, 1800); }
    $("rest").hidden = false; $("endBtns").hidden = false;
    $("rep").addEventListener("click", report);
    $("again").addEventListener("click", async () => { qs = cfg.src === "quiz" || cfg.src === "lib" ? cleanQuiz() : vocabQuestions(); i = -1; scores = {}; streak = {}; prevRank = {}; log = []; finalRank = [];
      await upRoom({ ph:"lobby", i:-1, n:qs.length, res:null, q:null }); ph = "lobby"; lobby(); playMusic("lobby", .35); });
    $("newset").addEventListener("click", async () => { await endRoom(); setup(); });
  }
  async function endRoom(){ stopAll(); if(roomRef) await upRoom({ ph:"closed" }).catch(() => {}); pin = null; roomRef = null; }
  function stopTick(){ if(tick){ clearInterval(tick); tick = null; } if(readyT){ clearTimeout(readyT); readyT = null; } }
  function stopAll(){ stopTick(); [unPlayers, unAnswers, unRoom].forEach(u => u && u()); unPlayers = unAnswers = unRoom = null; }
  window.addEventListener("beforeunload", e => { if(pin && ph !== "end" && ph !== "report" && ph !== "setup"){ e.preventDefault(); e.returnValue = ""; } });
  return { setup, stopAll };
})();

// =================================================================
// HỌC VIÊN
// =================================================================
const P = (() => {
  let pin = null, nick = ls("azl_nick") || "", unRoom = null, unMe = null, joined = false, st = null, lastKey = "", answeredI = -1, qStart = 0, deadline = 0, tickT = null;
  function start(pre){
    stopAll(); musBtn.hidden = true;
    view.innerHTML = '<div class="ph center"><span class="lumi">' + LUMI + '</span><h1>Vào phòng chơi</h1>' +
      '<input class="pinput" type="text" id="pin" inputmode="numeric" maxlength="6" placeholder="Mã PIN" autocomplete="off" value="' + esc(pre) + '">' +
      '<input type="text" id="nick" maxlength="18" placeholder="' + esc(nick || "Biệt danh của bạn") + '" autocomplete="off">' +
      '<button class="btn big" id="enter" type="button">Vào phòng ▶</button><p class="err" id="jErr"></p><button class="btn ghost sm" id="bk" type="button">← Quay lại</button></div>';
    $(pre ? "nick" : "pin").focus();
    const go = () => join($("pin").value.replace(/\D/g, ""), ($("nick").value.trim() || nick).slice(0, 18));
    $("enter").addEventListener("click", go);
    ["pin", "nick"].forEach(id => $(id).addEventListener("keydown", e => { if(e.key === "Enter") go(); }));
    $("bk").addEventListener("click", () => { history.replaceState(null, "", location.pathname); home(); });
  }
  async function join(p, n){
    const err = $("jErr"), btn = $("enter");
    if(p.length !== 6){ err.textContent = "Mã PIN gồm 6 số nha."; return; }
    if(!n){ err.textContent = "Nhập biệt danh đã nè."; return; }
    if(badName(n)){ err.textContent = "Biệt danh này Lumina không duyệt đâu 😤 Đổi cái khác nha!"; return; }
    if(!UID){ err.textContent = "Chưa kết nối được, thử tải lại trang."; return; }
    btn.disabled = true; btn.textContent = "Đang vào…";
    try{
      const s = await getDoc(doc(db, "live_rooms", p));
      if(!s.exists() || s.data().ph === "closed"){ throw "Không tìm thấy phòng " + p + ". Xem lại mã PIN trên màn hình nha."; }
      if(s.data().locked){ throw "Phòng đã khoá. Nhờ giáo viên mở phòng nha."; }
      await setDoc(doc(db, "live_rooms", p, "players", UID), { n, at:serverTimestamp() });
    }catch(e){ err.textContent = typeof e === "string" ? e : "Không vào được phòng, thử lại nha."; btn.disabled = false; btn.textContent = "Vào phòng ▶"; return; }
    pin = p; nick = n; ls("azl_nick", n); joined = true; lastKey = "";
    history.replaceState(null, "", location.pathname + "?pin=" + p);
    unRoom = onSnapshot(doc(db, "live_rooms", p), s => { st = s.data() || null; render(); });
    unMe = onSnapshot(doc(db, "live_rooms", p, "players", UID), s => { if(joined && !s.exists()){ joined = false; stopAll(); kicked(); } });
    beep(880, .1);
  }
  function kicked(){ view.innerHTML = '<div class="ph center"><span class="lumi">' + LUMI + '</span><h1>Bạn đã được mời ra khỏi phòng</h1><p class="muted">Nếu nhầm lẫn, hỏi giáo viên rồi vào lại nha.</p><button class="btn" id="rj" type="button">Vào lại</button></div>';
    $("rj").addEventListener("click", () => start(pin || "")); }
  function wait_(msg){ view.innerHTML = '<div class="ph center"><span class="lumi">' + LUMI + '</span><h1>' + esc(nick) + '</h1><p class="say"><b>Lumina:</b> ' + msg + '</p></div>'; }
  function render(){
    if(!st) return wait_("Phòng không còn nữa rồi 🥲");
    const key = st.ph + ":" + st.i + ((st.ph === "reveal" || st.ph === "end") && st.res ? "+res" : "");
    if(key === lastKey) return; // chỉ vẽ lại khi đổi giai đoạn
    lastKey = key;
    if(tickT){ clearInterval(tickT); tickT = null; }
    const q = st.q || {};
    if(st.ph === "closed") return wait_("Giáo viên đã đóng phòng. Cảm ơn bạn đã chơi nha! 👋");
    if(st.ph === "lobby"){ answeredI = -1; return wait_("Vào phòng rồi! Nhìn lên màn hình lớp và chờ giáo viên bắt đầu nha 👀"); }
    if(st.ph === "ready"){
      view.innerHTML = '<div class="ph center"><p class="pill">Câu ' + (st.i + 1) + '/' + st.n + (q.x2 ? ' · x2 điểm' : '') + '</p><h1>Ready?</h1>' +
        '<p class="cd-l">' + ({ tf:"Đúng hay sai?", type:"Gõ đáp án", mcq:"Chọn đáp án" })[q.t] + '</p>' + '<div class="cd" aria-label="Chuẩn bị"><b>3</b><b>2</b><b>1</b><b class="go">GO!</b><i class="ring"></i></div>' + '</div>';
      return;
    }
    if(st.ph === "question"){
      if(answeredI === st.i) return lockedView();
      qStart = Date.now(); deadline = Date.now() + (q.dur || 20) * 1000;
      let body;
      if(q.t === "type") body = '<input type="text" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án…" style="font:800 22px var(--display);text-align:center;min-height:64px">' +
        '<button class="btn big" id="send" type="button">Gửi ▶</button>';
      else body = '<div class="opts' + (q.t === "tf" ? " two" : "") + '">' + q.o.map((o, k) => '<button type="button" class="opt o' + (q.t === "tf" ? (k ? 0 : 1) : k) + '" data-k="' + k + '"><span class="sh">' + (q.t === "tf" ? (k ? "✗" : "✓") : SHAPES[k]) + '</span><span>' + esc(o) + '</span></button>').join("") + '</div>';
      view.innerHTML = '<div class="ph"><div class="qbar"><span class="n">Câu ' + (st.i + 1) + '/' + st.n + '</span><span class="sp"></span><span class="answered" id="pt"></span></div>' +
        '<div class="card prompt" style="padding:14px"><div class="w" style="font-size:clamp(22px,6.5vw,34px)">' + esc(q.p) + '</div></div>' + body + '</div>';
      if(q.t === "type"){ const inp = $("typed"); inp.focus(); const send = () => { const v = inp.value.trim(); if(v) answer({ a:v }); };
        $("send").addEventListener("click", send); inp.addEventListener("keydown", e => { if(e.key === "Enter") send(); }); }
      else view.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer({ c:+b.dataset.k })));
      const pt = $("pt"); tickT = setInterval(() => { const left = Math.max(0, deadline - Date.now()); pt.textContent = "⏱ " + Math.ceil(left / 1000) + "s"; }, 250);
      return;
    }
    if(st.ph === "reveal" || st.ph === "board"){
      const r = st.res && st.res.me && st.res.me[UID];
      if(!r){ return wait_(answeredI === st.i ? "Đang chấm… hồi hộp ghê 😬" : "Hết giờ rồi! Câu sau nhanh tay hơn nha ⏰"); }
      const [score, rank, gain, ok, stk, aheadN, aheadGap] = r, answered = answeredI === st.i;
      const right = q.t === "type" ? (st.res.acc || []).join(" / ") : (st.res.ok || []).map(k => (q.o || [])[k]).join(" / ");
      view.innerHTML = '<div class="ph"><div class="res ' + (ok ? "ok" : "no") + '"><div class="big">' + (ok ? "Chuẩn luôn! ✓" : answered ? "Trật rồi ✗" : "Hết giờ ⏰") + '</div>' +
        '<div class="pts">' + (ok ? "+" + fmt(gain) + " điểm" : "+0 điểm") + '</div>' + (stk >= 2 ? '<p><span class="streak">🔥 Chuỗi đúng ' + stk + '</span></p>' : '') +
        (!ok && right ? '<p class="muted">Đáp án: <b>' + esc(right) + '</b></p>' : '') + '</div>' +
        '<div class="rankcard"><span class="rk">#' + rank + '</span><div><b>' + fmt(score) + ' điểm</b><div class="gap">' +
        (rank === 1 ? "Bạn đang dẫn đầu! Giữ vững nha 👑" : aheadGap > 0 ? "Kém <b>" + esc(aheadN) + "</b> " + fmt(aheadGap) + " điểm" : "Đang bằng điểm <b>" + esc(aheadN) + "</b>") + '</div></div></div></div>';
      if(st.ph === "reveal") ok ? beep(880, .2, "triangle", .12) : beep(260, .25, "sawtooth", .06);
      return;
    }
    if(st.ph === "end"){
      const e = st.res && st.res.me && st.res.me[UID], top = (st.res && st.res.top) || [];
      view.innerHTML = '<div class="ph center"><span class="lumi cheer">' + LUMI + '</span>' +
        '<h1>' + (e && e[1] <= 3 ? ["", "Vô địch! 👑", "Á quân! 🥈", "Hạng 3! 🥉"][e[1]] : "Hết trận!") + '</h1>' +
        (e ? '<p class="say"><b>Lumina:</b> ' + esc(nick) + ' được ' + fmt(e[0]) + ' điểm, hạng ' + e[1] + '/' + st.res.np + '. ' + (e[1] <= 3 ? "Đỉnh của chóp!" : "Về ôn lại là lần sau lên bục liền!") + '</p>' : '') +
        '<div class="board">' + top.map((t, k) => '<div class="br"><span class="r">' + ["🥇", "🥈", "🥉"][k] + '</span><span class="nm">' + esc(t.n) + '</span><span class="s">' + fmt(t.s) + '</span></div>').join("") + '</div></div>';
      if(e && e[1] <= 3) setTimeout(confettiBurst, 6500);
    }
  }
  async function answer(a){
    if(!st || st.ph !== "question" || answeredI === st.i) return;
    answeredI = st.i; beep(700, .08); lockedView();
    try{ await setDoc(doc(db, "live_rooms", pin, "answers", st.i + "_" + UID), Object.assign({ uid:UID, q:st.i, at:serverTimestamp() }, a)); }
    catch(e){ answeredI = -1; lastKey = ""; render(); }
  }
  function lockedView(){ if(tickT){ clearInterval(tickT); tickT = null; }
    view.innerHTML = '<div class="ph center"><span class="lumi">' + LUMI + '</span><h1>Đã chốt!</h1><p class="say"><b>Lumina:</b> Chờ cả lớp xíu… hồi hộp ghê 😬</p></div>'; }
  function stopAll(){ [unRoom, unMe].forEach(u => u && u()); unRoom = unMe = null; if(tickT){ clearInterval(tickT); tickT = null; } }
  return { start, stopAll };
})();
</script>
