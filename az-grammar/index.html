PART.clause"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M06-07-0007","type":"mcq","cefr":"B1","difficulty":2,"context":"thpt","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"___ all her money, she couldn't buy a ticket home.","options":["Having spent","Spent","Spending","Being spent"],"answer":0,"distractor_tags":[null,"PART.clause","PART.clause","PART.clause"],"explanation_vi":"Đã tiêu hết tiền (trước) → Having spent.","error_tags":["PART.clause"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M06-07-0008","type":"mcq","cefr":"B1","difficulty":4,"context":"thpt","uses":["lesson","review"],"instruction_vi":"Chọn câu đúng.","stem":"Which sentence is correct?","options":["Walking in the park, a dog bit me.","Walking in the park, I was bitten by a dog.","Walked in the park, I was bitten by a dog.","Having walked in the park, a dog bit me."],"answer":1,"distractor_tags":["PART.clause",null,"PART.clause","PART.clause"],"explanation_vi":"Hai vế phải cùng chủ ngữ (I đi bộ, I bị cắn).","error_tags":["PART.clause"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M06-07-0009","type":"mcq","cefr":"B1","difficulty":4,"context":"thpt","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"___ from the top of the hill, the town looks very beautiful.","options":["Seeing","Seen","Having seen","To see"],"answer":1,"distractor_tags":["PART.clause",null,"PART.clause","PART.clause"],"explanation_vi":"Thị trấn được nhìn (bị động) → Seen.","error_tags":["PART.clause"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M06-07-0010","type":"error_identification","cefr":"B1","difficulty":3,"context":"thpt","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["Having read"," the book, ","the film"," ","seemed"," boring ","to me","."],"underline":[0,2,4,6],"answer":1,"correction":["I found the film"],"explanation_vi":"Hai vế phải cùng chủ ngữ: người đọc sách (I) → Having read the book, I found the film boring.","error_tags":["PART.clause"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M06-07-0011","type":"transformation","cefr":"B1","difficulty":3,"context":"thpt","uses":["lesson","review"],"instruction_vi":"Viết lại câu sao cho nghĩa không đổi, bắt đầu bằng phần cho sẵn.","original":"After she had finished her report, she sent it to her teacher.","cue":"Having","answers":["Having finished her report, she sent it to her teacher."],"required_patterns":["^having finished her report, she sent it to her teacher"],"explanation_vi":"Cùng chủ ngữ, xảy ra trước → Having + V3.","error_tags":["PART.clause"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M06-07-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"thpt","uses":["lesson"],"instruction_vi":"Mệnh đề phân từ.","task_vi":"Viết 2 câu có mệnh đề phân từ: 1 câu với V-ing, 1 câu với Having + V3 (hai vế cùng chủ ngữ).","model_answers":["Feeling hungry, I made a sandwich. Having finished my homework, I watched a film.","Hearing a strange noise, my dog started barking. Having lived in Nha Trang for years, my family loves the sea."],"rubric":["V-ing cho hành động chủ động cùng lúc/nguyên nhân","Having + V3 cho hành động xảy ra trước","Hai vế cùng chủ ngữ"],"min_words":10,"explanation_vi":"Câu mẫu: Feeling hungry, I made… / Having finished my homework, I watched…","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M06-10":{"kind":"skill","schema_version":1,"skill_id":"G-M06-10","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Chọn đúng to V hay V-ing (hoặc V nguyên mẫu) sau động từ và các mẫu câu hay gặp: would rather, had better, get used to, be busy, be about to.","est_minutes":15,"source":["az-grammar-2nd:p28","az-original"],"explanation":[{"kind":"text","title_vi":"Động từ + V-ing hay + to V?","text_vi":"Nhóm CHỈ đi với V-ing (danh động từ): avoid, consider, suggest, recommend, enjoy, finish, mind, deny, admit, quit, postpone, delay, practice, risk, appreciate, keep.","list":["Nhóm CHỈ đi với to V: decide, want, hope, expect, promise, agree, offer, plan, refuse, afford, manage, fail.","Một số động từ ĐỔI NGHĨA tuỳ theo V-ing hay to V: remember/forget + V-ing (nhớ/quên đã LÀM rồi) >< remember/forget + to V (nhớ/quên PHẢI làm); stop + V-ing (dừng hẳn việc đang làm) >< stop + to V (dừng lại ĐỂ làm việc khác).","Cấu trúc \"V + O + to V\": require, ask, tell, want, expect, allow, encourage, invite, remind, advise + tân ngữ + to V.","Ba động từ đặc biệt \"let/make/have + O + V nguyên mẫu KHÔNG \"to\"\" (khiến/cho phép ai làm gì) — khác với nhóm \"V + O + to V\" ở trên.","\"It is + adj (essential/important/necessary/advisable) + to V\" — diễn tả điều cần thiết/quan trọng phải làm, luôn dùng to V."]},{"kind":"text","title_vi":"Mẫu câu đặc biệt hay gặp trong TOEIC","text_vi":"\"Would rather + V nguyên mẫu (không \"to\")\" >< \"Would prefer + to V\" — cùng nghĩa \"thích/muốn hơn\" nhưng cấu trúc khác nhau.","list":["\"It's (high) time + S + V (chia ở quá khứ đơn)\" — diễn tả điều lẽ ra phải làm nhưng chưa làm, dù đang nói về hiện tại/tương lai.","\"Used to + V nguyên mẫu\" (đã từng làm gì, nay không còn) >< \"be/get used to + V-ing\" (quen với việc gì ở hiện tại) — \"to\" trong trường hợp sau là giới từ.","Thể sai khiến (causative): \"have/get + O (vật) + V-ed/V3\" (bị động — nhờ ai làm cho mình) >< \"have + O (người) + V nguyên mẫu\" (chủ động — nhờ ai đó trực tiếp làm).","\"Had better + V nguyên mẫu (không \"to\")\" — lời khuyên mạnh, mang tính cảnh báo nếu không làm theo. Phủ định: \"had better not + V0\".","\"Be busy + V-ing\" (bận làm gì), \"be about to + V\" (sắp sửa làm gì), \"spend/waste time + V-ing\" (dành/lãng phí thời gian làm gì)."]}],"worked_examples":[{"en":"We decided to postpone the meeting.","analysis_vi":"decide + to V.","highlight":["decided to postpone"]},{"en":"She is used to working late before a product launch.","analysis_vi":"be/get used to + V-ing (quen với việc…).","highlight":["is used to working"]}],"common_mistakes":[{"wrong":"I suggest to send the file today.","right":"I suggest sending the file today.","why_vi":"suggest + V-ing.","error_tag":"GER.inf_vs_ing"},{"wrong":"You had better to check the contract.","right":"You had better check the contract.","why_vi":"had better + V nguyên mẫu.","error_tag":"GER.inf_vs_ing"}],"vn_difficulties_vi":["Tiếng Việt không đổi dạng động từ thứ hai (\"quyết định hoãn\", \"đề nghị gửi\"), nên phải học thuộc động từ nào đi với to V, động từ nào đi với V-ing.","used to V (đã từng) và be used to V-ing (quen với) dễ nhầm."],"review_recommendations_vi":["Ghi 2 cột: động từ + to V và động từ + V-ing, mỗi ngày thêm 3 động từ."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M06-10-0001"],"guided":["Q-M06-10-0002","Q-M06-10-0003","Q-M06-10-0004","Q-M06-10-0005"],"independent":["Q-M06-10-0006","Q-M06-10-0007","Q-M06-10-0008","Q-M06-10-0009","Q-M06-10-0010","Q-M06-10-0011"],"writing":["Q-M06-10-0012"]}},"questions":[{"id":"Q-M06-10-0001","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"The manager suggested ___ the meeting to next Monday.","options":["postponing","to postpone","postpone","postponed"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Quản lý đề xuất hoãn cuộc họp sang thứ Hai tuần sau. — \"suggest\" luôn theo sau bởi V-ing (danh động từ), không dùng \"to V\". Mẹo thêm: nhóm động từ chỉ đi với V-ing cần nhớ: avoid, consider, suggest, enjoy, finish, mind, deny, admit, quit, postpone, delay, practice, risk, recommend.","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-1"}},{"id":"Q-M06-10-0002","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"We have decided ___ the new marketing strategy starting next quarter.","options":["to implement","implementing","implement","implemented"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Chúng tôi đã quyết định triển khai chiến lược marketing mới bắt đầu từ quý tới. — \"decide\" luôn theo sau bởi \"to V\". Mẹo thêm: nhóm động từ chỉ đi với \"to V\" cần nhớ: decide, want, hope, expect, promise, agree, offer, plan, refuse, afford, manage, fail.","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-1"}},{"id":"Q-M06-10-0003","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"I remember ___ the door before I left the office yesterday.","options":["locking","to lock","lock","locked"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Tôi nhớ là mình đã khóa cửa trước khi rời văn phòng hôm qua. — \"remember + V-ing\" = nhớ đã làm gì (đã xảy ra trong quá khứ). Mẹo thêm: phân biệt với \"remember + to V\" = nhớ PHẢI làm gì (một việc chưa xảy ra) — ví dụ: \"Remember to lock the door before you leave\" (nhắc nhở).","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-1"}},{"id":"Q-M06-10-0004","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Don't forget ___ the client before the deadline.","options":["to contact","contacting","contact","contacted"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Đừng quên liên hệ với khách hàng trước hạn chót. — \"forget + to V\" = quên PHẢI làm gì (việc chưa làm). Mẹo thêm: \"forget + V-ing\" = quên rằng đã làm gì đó trong quá khứ (thường dùng trong câu phủ định như \"I'll never forget visiting Paris\").","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-1"}},{"id":"Q-M06-10-0005","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The technician stopped ___ the machine when he noticed unusual noise.","options":["to check","checking","check","checked"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Kỹ thuật viên dừng lại để kiểm tra máy khi anh nghe thấy tiếng ồn bất thường. — \"stop + to V\" = dừng việc đang làm ĐỂ làm việc khác (to V ở đây mang nghĩa mục đích). Mẹo thêm: \"stop + V-ing\" = dừng hẳn việc đang làm (ví dụ: \"He stopped smoking\" = anh ấy đã bỏ hút thuốc).","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-1"}},{"id":"Q-M06-10-0006","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"Would you mind ___ the window? It's getting cold in here.","options":["closing","to close","close","closed"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Bạn có phiền đóng cửa sổ lại không? Trong này đang lạnh dần. — \"would you mind + V-ing\" là cấu trúc lịch sự để nhờ vả ai đó làm gì, luôn theo sau bởi V-ing. Mẹo thêm: đây là mẫu câu giao tiếp rất phổ biến trong TOEIC — \"mind\" không bao giờ theo sau bởi \"to V\".","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-1"}},{"id":"Q-M06-10-0007","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"The HR policy requires all new hires ___ an orientation session within their first week.","options":["to attend","attending","attend","attended"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Chính sách nhân sự yêu cầu tất cả nhân viên mới tham dự một buổi định hướng trong tuần đầu tiên. — Cấu trúc \"require + O + to V\" (yêu cầu ai làm gì). Mẹo thêm: các động từ đi theo mẫu \"V + O + to V\" thường gặp: require, ask, tell, want, expect, allow, encourage, invite, remind, advise.","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-1"}},{"id":"Q-M06-10-0008","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The supervisor let the new employee ___ the client meeting on her own.","options":["handle","to handle","handling","handled"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Người giám sát để nhân viên mới tự xử lý buổi họp với khách hàng. — \"let/make/have + O + V (nguyên mẫu không \"to\")\" là các động từ khiến/cho phép đặc biệt. Mẹo thêm: 3 động từ đặc biệt này (let, make, have) không dùng \"to V\" như các động từ \"V + O + to V\" thông thường khác (như \"allow/require/ask + O + to V\").","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-1"}},{"id":"Q-M06-10-0009","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Customers appreciate ___ prompt responses to their inquiries.","options":["receiving","to receive","receive","received"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Khách hàng đánh giá cao việc nhận được phản hồi nhanh chóng cho các câu hỏi của họ. — \"appreciate\" chỉ đi với V-ing, không dùng \"to V\". Mẹo thêm: \"appreciate\" thường xuất hiện trong email/thông báo TOEIC với nghĩa \"đánh giá cao/biết ơn về việc gì\" + V-ing.","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-1"}},{"id":"Q-M06-10-0010","type":"error_identification","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["The company ","plans"," ","opening"," a new branch ","in"," Da Nang ","next year","."],"underline":[1,3,5,7],"answer":1,"correction":["to open"],"explanation_vi":"Sau plan (dự định) dùng to V: plans to open.","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M06-10-0011","type":"gap_fill","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chia động từ trong ngoặc.","stem":"Please avoid ___ (use) your phone during the meeting.","answers":[["using"]],"explanation_vi":"Sau avoid (tránh) luôn dùng V-ing: avoid using.","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M06-10-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Kế hoạch của bạn.","task_vi":"Viết 2 câu về kế hoạch học tập/công việc: 1 câu với plan/decide/hope + to V, 1 câu với enjoy/avoid/consider + V-ing.","model_answers":["I plan to take the TOEIC test in March. I enjoy listening to English podcasts on the bus.","We decided to open a new class. I am considering joining an online course."],"rubric":["plan/decide/hope + to V","enjoy/avoid/consider + V-ing","Không dùng to sau had better / would rather"],"min_words":12,"explanation_vi":"Câu mẫu: plan to take / enjoy listening.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M06-10-0013","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"It is essential ___ all safety procedures before operating this equipment.","options":["to review","reviewing","review","reviewed"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Điều cần thiết là phải xem xét lại tất cả quy trình an toàn trước khi vận hành thiết bị này. — Cấu trúc \"It is + adj (essential/important/necessary/advisable) + to V\" diễn tả điều cần thiết/quan trọng phải làm. Mẹo thêm: đây là mẫu câu rất phổ biến trong thông báo/quy định TOEIC Part 6-7 — luôn dùng \"to V\" sau tính từ chỉ mức độ cần thiết.","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-1"}},{"id":"Q-M06-10-0014","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"I would rather ___ overtime this week than work on the weekend.","options":["work","to work","working","worked"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Tôi thà làm thêm giờ tuần này còn hơn là làm việc vào cuối tuần. — \"would rather + V nguyên mẫu (không \"to\")\" diễn tả sự lựa chọn ưu tiên. Mẹo thêm: so sánh với \"would prefer + to V\" (cùng nghĩa \"thích hơn\") nhưng \"would prefer\" cần \"to V\" còn \"would rather\" thì không.","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-2"}},{"id":"Q-M06-10-0015","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"I would prefer ___ the report by email rather than by phone.","options":["to receive","receiving","receive","received"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Tôi muốn nhận báo cáo qua email hơn là qua điện thoại. — \"would prefer + to V\" diễn tả sự ưu tiên/thích hơn. Mẹo thêm: cấu trúc đầy đủ \"would prefer to V (rather than V0)\" — phần sau \"rather than\" dùng động từ nguyên mẫu không \"to\".","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-2"}},{"id":"Q-M06-10-0016","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"It's high time the company ___ its outdated software system.","options":["updated","update","updates","to update"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Đã đến lúc công ty phải cập nhật hệ thống phần mềm lỗi thời của mình. — Cấu trúc \"It's (high) time + S + V (quá khứ đơn)\" diễn tả điều lẽ ra phải làm nhưng chưa làm (mang tính giả định). Mẹo thêm: dù nói về hiện tại/tương lai, động từ sau \"it's time\" luôn chia ở dạng QUÁ KHỨ ĐƠN — điểm rất dễ gây nhầm lẫn.","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-2"}},{"id":"Q-M06-10-0017","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"She used to ___ in the finance department before she was promoted.","options":["work","working","worked","works"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Cô ấy từng làm việc ở phòng tài chính trước khi được thăng chức. — \"used to + V nguyên mẫu\" = đã từng làm gì trong quá khứ (nay không còn). Mẹo thêm: phân biệt với \"be/get used to + V-ing\" = quen với việc gì (ở hiện tại) — hai cấu trúc rất dễ nhầm vì đều có \"used to\".","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-2"}},{"id":"Q-M06-10-0018","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"After moving to Hanoi, he quickly got used to ___ public transportation.","options":["using","use","to use","used"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Sau khi chuyển đến Hà Nội, anh ấy nhanh chóng quen với việc sử dụng phương tiện công cộng. — \"get used to + V-ing\" = dần trở nên quen với việc gì. Mẹo thêm: \"to\" trong \"be/get used to\" là giới từ, nên theo sau luôn là V-ing hoặc danh từ, KHÔNG phải \"to V nguyên mẫu\".","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-2"}},{"id":"Q-M06-10-0019","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"You had better ___ the contract carefully before signing it.","options":["review","to review","reviewing","reviewed"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Bạn nên xem lại hợp đồng cẩn thận trước khi ký. — \"had better + V nguyên mẫu (không \"to\")\" mang nghĩa khuyên nhủ mạnh (nên làm gì, nếu không sẽ có hậu quả). Mẹo thêm: dạng phủ định là \"had better not + V0\" (ví dụ: \"You had better not be late\").","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-2"}},{"id":"Q-M06-10-0020","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The staff are busy ___ for the upcoming product launch.","options":["preparing","to prepare","prepare","prepared"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Nhân viên đang bận chuẩn bị cho buổi ra mắt sản phẩm sắp tới. — \"be busy + V-ing\" = bận rộn làm gì. Mẹo thêm: đây là một trong nhóm cấu trúc cố định luôn theo sau bởi V-ing, tương tự \"spend/waste time + V-ing\".","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-2"}},{"id":"Q-M06-10-0021","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The board is about ___ a final decision on the merger.","options":["to make","making","make","made"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Hội đồng quản trị sắp đưa ra quyết định cuối cùng về việc sáp nhập. — \"be about to + V\" = sắp sửa làm gì (tương lai rất gần). Mẹo thêm: không nhầm với \"be about + V-ing\" — \"about\" ở đây là một phần cố định của cụm \"be about to V\", không phải giới từ đứng một mình.","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-2"}},{"id":"Q-M06-10-0022","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Employees should not ___ submitting their expense reports until the last minute.","options":["delay","to delay","delaying","delayed"],"answer":0,"distractor_tags":[null,"GER.inf_vs_ing","GER.inf_vs_ing","GER.inf_vs_ing"],"explanation_vi":"Dịch: Nhân viên không nên trì hoãn việc nộp báo cáo chi phí đến phút chót. — \"delay + V-ing\" = trì hoãn việc gì. Mẹo thêm: \"delay\" cùng nhóm với \"postpone\" — cả hai đều chỉ đi với V-ing, không dùng \"to V\".","error_tags":["GER.inf_vs_ing"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-2"}}]},"G-M07-04":{"kind":"skill","schema_version":1,"skill_id":"G-M07-04","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Dùng đúng so sánh bằng, hơn, nhất, gấp bội và các dấu hiệu so sánh hay gặp trong TOEIC Part 5.","est_minutes":15,"source":["az-grammar-2nd:p21","az-original"],"explanation":[{"kind":"text","title_vi":"Phân loại tính từ & 3 cấp so sánh cơ bản","text_vi":"Tính từ ngắn (1 âm tiết, hoặc 2 âm tiết kết thúc bằng \"y\"): so sánh hơn thêm \"-er\", so sánh nhất thêm \"the -est\". Ví dụ: high→higher→the highest, early→earlier→the earliest.","list":["Tính từ dài (từ 2 âm tiết trở lên, không kết thúc bằng \"y\"): so sánh hơn dùng \"more + adj\", so sánh nhất dùng \"the most + adj\". Ví dụ: efficient→more efficient→the most efficient.","So sánh ngang bằng: \"S + be/V + as + adj/adv (nguyên thể) + as\". Phủ định: \"not as/so + adj + as\".","Tính từ/trạng từ bất quy tắc cần nhớ: good/well→better→the best, bad→worse→the worst, far→farther/further→the farthest/furthest, little→less→the least, many/much→more→the most."]},{"kind":"text","title_vi":"So sánh nâng cao & dấu hiệu nhận biết","text_vi":"So sánh gấp bội: \"twice/three times/four times + as + adj + as\" (gấp đôi/ba/bốn lần).","list":["So sánh kép (càng...càng...): \"The + so sánh hơn + S + V, the + so sánh hơn + S + V\". Ví dụ: The more you practice, the better you become.","Tăng dần theo thời gian (ngày càng...): tính từ ngắn lặp \"-er and -er\" (bigger and bigger), tính từ dài dùng \"more and more + adj\".","Chỉ so sánh giữa HAI đối tượng (\"of the two\", \"between the two\") → dùng so sánh HƠN, KHÔNG dùng so sánh nhất dù nghĩa tiếng Việt có thể dịch là \"nhất\".","So sánh giữa từ BA đối tượng trở lên (\"of all\", \"among all\", \"in the department/company\") → dùng so sánh NHẤT, luôn có \"the\" đứng trước.","Cấu trúc \"one of the + so sánh nhất + N số nhiều\" (một trong những... nhất) — danh từ theo sau luôn ở dạng số nhiều.","Trạng từ nhấn mạnh mức độ chênh lệch (far/much/a lot/considerably/significantly) chỉ đứng trước so sánh HƠN/NHẤT, không đứng trực tiếp trước tính từ nguyên thể. \"Very\" KHÔNG được dùng với so sánh hơn.","\"Lately\" (gần đây, trạng từ chỉ thời gian) dễ nhầm với \"later\" (so sánh hơn của \"late\") — hai từ khác nghĩa hoàn toàn dù nhìn giống nhau."]}],"worked_examples":[{"en":"This model is more efficient than the previous one.","analysis_vi":"Tính từ dài efficient → more + adj + than.","highlight":["more efficient than"]},{"en":"Sales this year were twice as high as last year.","analysis_vi":"So sánh gấp bội: twice / three times + as + adj + as.","highlight":["twice as high as"]}],"common_mistakes":[{"wrong":"This is the most cheap option.","right":"This is the cheapest option.","why_vi":"Tính từ ngắn → -est.","error_tag":"CMP.form"},{"wrong":"Our prices are more lower than theirs.","right":"Our prices are lower than theirs.","why_vi":"Không dùng more cùng -er.","error_tag":"CMP.form"}],"vn_difficulties_vi":["Người Việt hay thêm more cho mọi tính từ vì tiếng Việt chỉ nói \"hơn\".","Dấu hiệu than / the + -est / as … as thường nằm xa chỗ trống trong câu TOEIC."],"review_recommendations_vi":["Khoanh dấu hiệu than, as, the, of all trước khi chọn dạng so sánh."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M07-04-0001"],"guided":["Q-M07-04-0002","Q-M07-04-0003","Q-M07-04-0004","Q-M07-04-0005"],"independent":["Q-M07-04-0006","Q-M07-04-0007","Q-M07-04-0008","Q-M07-04-0009","Q-M07-04-0010","Q-M07-04-0011"],"writing":["Q-M07-04-0012"]}},"questions":[{"id":"Q-M07-04-0001","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"This year's sales figures are ___ than last year's.","options":["higher","high","highest","more high"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Doanh số năm nay cao hơn năm ngoái. — So sánh hơn với tính từ ngắn \"high\" (1 âm tiết) → thêm \"-er\": \"higher than\". Mẹo thêm: không dùng \"more\" trước tính từ ngắn — \"more high\" là lỗi sai phổ biến.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-1"}},{"id":"Q-M07-04-0002","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The new software is ___ than the previous version.","options":["more efficient","efficienter","most efficient","more efficiently"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Phần mềm mới hiệu quả hơn phiên bản trước. — Tính từ dài \"efficient\" (3 âm tiết) dùng \"more + adj\" để so sánh hơn, không thêm đuôi \"-er\". Mẹo thêm: phân biệt với đáp án gây nhiễu \"more efficiently\" (trạng từ) — sau \"is\" cần tính từ, không phải trạng từ.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-1"}},{"id":"Q-M07-04-0003","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Of all the candidates, Mr. Tran has ___ experience.","options":["the most","the more","most","more"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Trong số tất cả ứng viên, ông Trần có nhiều kinh nghiệm nhất. — So sánh nhất với danh từ không đếm được \"experience\" dùng \"the most\". Mẹo thêm: cụm \"of all the + N\" là dấu hiệu nhận biết so sánh NHẤT (từ 3 đối tượng trở lên), luôn có \"the\" đứng trước.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-1"}},{"id":"Q-M07-04-0004","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Please try to arrive as ___ as possible to avoid missing the opening remarks.","options":["early","earlier","earliest","more early"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Vui lòng cố gắng đến càng sớm càng tốt để không bỏ lỡ phần phát biểu khai mạc. — Cấu trúc \"as + adj/adv (nguyên thể) + as possible\" (càng...càng tốt) luôn dùng dạng nguyên thể, không chia so sánh hơn/nhất. Mẹo thêm: \"as soon as possible\", \"as much as possible\" đều theo mẫu này — rất hay gặp trong email/thông báo TOEIC.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-1"}},{"id":"Q-M07-04-0005","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Customer satisfaction this quarter is not as ___ as we had hoped.","options":["high","higher","highest","highly"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Mức độ hài lòng của khách hàng quý này không cao như chúng tôi mong đợi. — \"not as + adj (nguyên thể) + as\" diễn tả so sánh ngang bằng ở dạng phủ định (không bằng). Mẹo thêm: giữa 2 \"as\" luôn là tính từ/trạng từ ở dạng NGUYÊN THỂ, không chia so sánh hơn.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-1"}},{"id":"Q-M07-04-0006","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"This is by far the ___ decision the board has ever made.","options":["worst","worse","bad","more bad"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Đây là quyết định tệ nhất mà hội đồng quản trị từng đưa ra. — \"bad\" là tính từ bất quy tắc: bad → worse (hơn) → the worst (nhất). Mẹo thêm: \"by far + so sánh nhất\" nhấn mạnh \"vượt trội hẳn\" — cụm này là dấu hiệu chắc chắn của câu so sánh nhất.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-1"}},{"id":"Q-M07-04-0007","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"Employees who arrive early tend to be ___ productive than those who arrive late.","options":["more","most","much","very"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Nhân viên đến sớm có xu hướng làm việc hiệu quả hơn những người đến muộn. — \"productive\" là tính từ dài, so sánh hơn cần \"more + adj + than\". Mẹo thêm: \"much/very\" không tự tạo thành so sánh hơn nếu thiếu \"than\" — chỉ \"more...than\" mới đúng cấu trúc so sánh hơn.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-1"}},{"id":"Q-M07-04-0008","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The farther you travel from the city center, the ___ the rent becomes.","options":["cheaper","cheap","cheapest","more cheap"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Càng đi xa trung tâm thành phố, tiền thuê nhà càng rẻ. — Cấu trúc so sánh kép \"The + so sánh hơn + S + V, the + so sánh hơn + S + V\" (càng...càng...) — vế sau cần \"the cheaper\" (tính từ ngắn thêm -er). Mẹo thêm: cả 2 vế của câu so sánh kép đều bắt đầu bằng \"the\" + dạng so sánh hơn, không phải so sánh nhất.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-1"}},{"id":"Q-M07-04-0009","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"As the company grows, its logistics needs become ___ and more complex.","options":["more","most","much","the most"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Khi công ty phát triển, nhu cầu về hậu cần trở nên ngày càng phức tạp hơn. — \"more and more + adj\" (ngày càng...) diễn tả xu hướng tăng dần theo thời gian, dùng với tính từ dài. Mẹo thêm: với tính từ ngắn dùng dạng lặp \"-er and -er\" (ví dụ: \"bigger and bigger\").","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-1"}},{"id":"Q-M07-04-0010","type":"error_identification","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["The new office is ","much"," ","more larger"," than the old one, ","so"," we can hire ","more staff","."],"underline":[1,3,5,7],"answer":1,"correction":["larger"],"explanation_vi":"large là tính từ ngắn → larger; không dùng more cùng -er.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M07-04-0011","type":"gap_fill","cefr":"A2","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Điền dạng so sánh đúng.","stem":"This is the ___ (good) result our team has ever achieved.","answers":[["best"]],"explanation_vi":"the + so sánh nhất của good → best (bất quy tắc).","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M07-04-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"So sánh hai sản phẩm.","task_vi":"So sánh 2 điện thoại hoặc 2 khoá học bạn biết: 1 câu so sánh hơn, 1 câu so sánh nhất.","model_answers":["The new phone is lighter than the old one, but it is more expensive. It is the best phone I have ever used.","The online course is cheaper than the class course. It is the most flexible way to study."],"rubric":["So sánh hơn: -er than / more … than","So sánh nhất: the -est / the most …","Không dùng more cùng -er"],"min_words":12,"explanation_vi":"Câu mẫu: lighter than, more expensive, the best.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M07-04-0013","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The new factory can produce ___ as many units as the old one.","options":["twice","two","double","twofold"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Nhà máy mới có thể sản xuất gấp đôi số lượng sản phẩm so với nhà máy cũ. — So sánh gấp bội dùng \"twice/three times/four times + as + adj/adv + as\". Mẹo thêm: \"twice\" đứng riêng trước \"as...as\", trong khi \"double\" thường dùng như động từ/tính từ (double the amount), không đặt trực tiếp theo cách này.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-1"}},{"id":"Q-M07-04-0014","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Of the two proposals, the marketing team's plan is ___.","options":["more practical","most practical","practical","practicaler"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Trong hai đề xuất, kế hoạch của đội marketing thực tế hơn. — Khi so sánh CHỈ GIỮA HAI đối tượng (\"of the two\"), phải dùng so sánh HƠN, không dùng so sánh NHẤT dù trong tiếng Việt có thể dịch là \"nhất\". Mẹo thêm: dấu hiệu \"of the two/between the two\" luôn đi với so sánh hơn — bẫy rất hay gặp trong TOEIC Part 5.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-2"}},{"id":"Q-M07-04-0015","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"This model is considerably ___ than the one we purchased last year.","options":["more advanced","advanced","most advanced","advance"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Mẫu này tiên tiến hơn đáng kể so với mẫu chúng tôi đã mua năm ngoái. — Trạng từ nhấn mạnh mức độ như \"considerably/significantly/much/far/a lot\" thường đứng trước so sánh HƠN để nhấn mạnh mức độ chênh lệch. Mẹo thêm: các trạng từ nhấn mạnh này chỉ đi với so sánh hơn/nhất, không đi trực tiếp với tính từ nguyên thể.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-2"}},{"id":"Q-M07-04-0016","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"She is one of the ___ engineers in the company.","options":["most talented","more talented","talented","most talent"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Cô ấy là một trong những kỹ sư tài năng nhất công ty. — Cấu trúc \"one of the + so sánh nhất + N số nhiều\" (một trong những... nhất). Mẹo thêm: sau \"one of the + so sánh nhất\" luôn là danh từ SỐ NHIỀU, vì \"one of\" ngụ ý có nhiều đối tượng cùng đạt mức độ đó.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-2"}},{"id":"Q-M07-04-0017","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The report was submitted ___ than the deadline required.","options":["later","more late","latest","lately"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Báo cáo được nộp trễ hơn so với yêu cầu của hạn chót. — \"late\" khi là trạng từ so sánh hơn thêm \"-er\" thành \"later\". Mẹo thêm: \"lately\" là trạng từ chỉ thời gian (= recently, \"gần đây\"), không phải dạng so sánh của \"late\" — rất dễ nhầm vì hình thức gần giống nhau.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-2"}},{"id":"Q-M07-04-0018","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The less experience a candidate has, the ___ training they will need.","options":["more","most","much","many"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Ứng viên càng ít kinh nghiệm thì càng cần nhiều đào tạo hơn. — Câu so sánh kép \"the less... the more...\" — \"more\" đi với danh từ không đếm được \"training\". Mẹo thêm: \"much\" là dạng gốc của \"more/most\" khi đi với danh từ không đếm được (much → more → most).","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-2"}},{"id":"Q-M07-04-0019","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Our new office is ___ larger than the old one — almost double the size.","options":["far","very","so","too"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Văn phòng mới của chúng tôi rộng hơn nhiều so với văn phòng cũ — gần gấp đôi diện tích. — \"far/much/a lot/considerably\" dùng để nhấn mạnh so sánh hơn (\"far larger than\"). Mẹo thêm: \"very\" KHÔNG được dùng trực tiếp với so sánh hơn (không nói \"very larger\") — lỗi rất hay gặp.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-2"}},{"id":"Q-M07-04-0020","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Among all the branches, the Hanoi office generates ___ revenue.","options":["the most","most","more","the more"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Trong số tất cả các chi nhánh, văn phòng Hà Nội tạo ra doanh thu nhiều nhất. — \"Among all the + N\" là dấu hiệu so sánh NHẤT (giữa từ 3 đối tượng trở lên), với danh từ không đếm được \"revenue\" dùng \"the most\". Mẹo thêm: \"among\" (giữa nhiều đối tượng) khác với \"between\" (giữa 2 đối tượng) — quyết định dùng so sánh nhất hay so sánh hơn.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-2"}},{"id":"Q-M07-04-0021","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Employee turnover this year is much ___ than it was five years ago.","options":["lower","low","lowest","more low"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Tỷ lệ nghỉ việc năm nay thấp hơn nhiều so với 5 năm trước. — Tính từ ngắn \"low\" so sánh hơn thêm \"-er\": \"lower\". Mẹo thêm: \"much\" đứng trước so sánh hơn để nhấn mạnh (\"much lower than\"), không đứng trước tính từ nguyên thể trong câu so sánh.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-2"}},{"id":"Q-M07-04-0022","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"This contract is ___ favorable to us as the previous one was.","options":["as","so","more","most"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Hợp đồng này có lợi cho chúng ta ngang bằng với hợp đồng trước. — So sánh ngang bằng cần cặp \"as...as\" — đáp án đầu tiên phải là \"as\". Mẹo thêm: \"so...as\" chỉ đúng trong câu PHỦ ĐỊNH (\"not so...as\"), còn câu khẳng định luôn dùng \"as...as\".","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-2"}},{"id":"Q-M07-04-0023","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The report is good, but I think the previous one was ___.","options":["better","more good","best","gooder"],"answer":0,"distractor_tags":[null,"CMP.form","CMP.form","CMP.form"],"explanation_vi":"Dịch: Báo cáo này tốt, nhưng tôi nghĩ báo cáo trước còn tốt hơn. — \"good\" là tính từ bất quy tắc: good → better (hơn) → the best (nhất), không thêm \"-er\" hay dùng \"more\". Mẹo thêm: các tính từ bất quy tắc thường gặp: good/well→better→best, bad→worse→worst, far→farther/further→farthest/furthest.","error_tags":["CMP.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ss-2"}}]},"G-M07-08":{"kind":"skill","schema_version":1,"skill_id":"G-M07-08","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Dùng đúng giới từ chỉ thời gian at, on, in và for, since, during, until, by.","est_minutes":10,"source":["az-grammar-2nd:p22","az-original"],"explanation":[{"kind":"table","title_vi":"Giới từ chỉ thời gian","head":["Mục","Cách dùng / ví dụ"],"rows":[["IN — ON — AT","IN: tháng/năm/mùa/buổi · ON: thứ/ngày/ngày lễ · AT: thời điểm cụ thể"],["FOR — SINCE — DURING — WITHIN — BY","FOR + khoảng thời gian · SINCE + mốc thời gian · DURING + danh từ sự kiện · WITHIN + khoảng thời gian giới hạn · BY + mốc thời gian (hạn chót)"]]},{"kind":"table","title_vi":"at · on · in","head":["Giới từ","Dùng với","Ví dụ"],"rows":[["at","giờ, thời điểm","at 7 o'clock, at noon, at night, at the weekend"],["on","ngày, thứ, ngày tháng cụ thể","on Monday, on 2 September, on my birthday"],["in","tháng, năm, mùa, buổi, thế kỷ","in May, in 2025, in summer, in the morning"]]}],"worked_examples":[{"en":"The exam starts at 7:30 on Monday.","analysis_vi":"Giờ → at; thứ → on.","highlight":["at 7:30","on Monday"]},{"en":"My birthday is in October.","analysis_vi":"Tháng → in.","highlight":["in October"]}],"common_mistakes":[{"wrong":"I was born on 2010.","right":"I was born in 2010.","why_vi":"Năm → in.","error_tag":"PREP.t e opened"]},{"en":"Your application has been received.","analysis_vi":"Hồ sơ được nhận (đã xong, kết quả hiện tại) → has been received.","highlight":["has been received"]}],"common_mistakes":[{"wrong":"The package was deliver yesterday.","right":"The package was delivered yesterday.","why_vi":"Bị động: be + V3.","error_tag":"PASS.form"},{"wrong":"The meeting has postponed.","right":"The meeting has been postponed.","why_vi":"Cuộc họp không tự hoãn → bị động: has been postponed.","error_tag":"PASS.form"}],"vn_difficulties_vi":["Tiếng Việt hay bỏ \"được/bị\", nên người Việt dùng chủ động cho cả câu đáng lẽ bị động (The report has written).","Quên be ở thì hoàn thành (has postponed thay vì has been postponed)."],"review_recommendations_vi":["Tự hỏi: chủ ngữ có tự làm hành động không? Không → bị động."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M08-02-0001"],"guided":["Q-M08-02-0002","Q-M08-02-0003","Q-M08-02-0004","Q-M08-02-0005"],"independent":["Q-M08-02-0006","Q-M08-02-0007","Q-M08-02-0008","Q-M08-02-0009","Q-M08-02-0010","Q-M08-02-0011"],"writing":["Q-M08-02-0012"]}},"questions":[{"id":"Q-M08-02-0001","type":"mcq","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"All orders ___ within 24 hours.","options":["process","are processed","are processing","processing"],"answer":1,"distractor_tags":["PASS.form",null,"PASS.form","PASS.form"],"explanation_vi":"Đơn hàng không tự xử lý → bị động hiện tại: are processed.","error_tags":["PASS.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M08-02-0002","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The conference room ___ for the training session tomorrow.","options":["will reserve","will be reserved","reserves","reserving"],"answer":1,"distractor_tags":["PASS.form",null,"PASS.form","PASS. M08-06-0010","Q-M08-06-0011"],"writing":["Q-M08-06-0012"]}},"questions":[{"id":"Q-M08-06-0001","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"The company had the entire office ___ before the client's visit.","options":["renovated","renovate","to renovate","renovating"],"answer":0,"distractor_tags":[null,"CAUS.form","CAUS.form","CAUS.form"],"explanation_vi":"Dịch: Công ty đã cho sửa sang lại toàn bộ văn phòng trước chuyến thăm của khách hàng. — Cấu trúc bị động \"have + O (vật) + V-ed/V3\" (nhờ/thuê ai đó làm gì cho mình) — vật \"the entire office\" bị tác động nên dùng V-ed. Mẹo thêm: nếu là \"have + O (người) + V0\" thì chủ động — ví dụ: \"have the technician fix the printer\" (nhờ kỹ thuật viên sửa máy in).","error_tags":["CAUS.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài ct-2"}},{"id":"Q-M08-06-0002","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"We need to have these documents ___ before the meeting.","options":["translate","translated","translating","to translate"],"answer":1,"distractor_tags":["CAUS.form",null,"CAUS.form","CAUS.form"],"explanation_vi":"have + vật (these documents) + V3 → translated.","error_tags":["CAUS.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M08-06-0003","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Ms Nga had her assistant ___ the hotel rooms.","options":["book","booked","to book","booking"],"answer":0,"distractor_tags":[null,"CAUS.form","CAUS.form","CAUS.form"],"explanation_vi":"have + người + V nguyên mẫu → book.","error_tags":["CAUS.form"],"source":"az-original", "difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Viết lại câu, nghĩa không đổi.","original":"A technician repaired our photocopier yesterday.","cue":"We had","answers":["We had our photocopier repaired yesterday."],"required_patterns":["^we had our photocopier repaired"],"explanation_vi":"Nhờ người làm: had + vật + V3.","error_tags":["CAUS.form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M08-06-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Nhờ người khác làm.","task_vi":"Viết 2 câu về những việc bạn hoặc công ty nhờ người khác làm (have/get + something + V3).","model_answers":["I have my hair cut every month. Our company had the meeting room redecorated last week.","We got our website redesigned last year. I need to have my laptop fixed."],"rubric":["have/get + vật + V3","Thì của have/get đúng mốc thời gian","Không dùng V nguyên mẫu sau vật"],"min_words":12,"explanation_vi":"Câu mẫu: have my hair cut / had the meeting room redecorated.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M09-01":{"kind":"skill","schema_version":1,"skill_id":"G-M09-01","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Chọn đúng đại từ quan hệ who, which, that, whose, whom trong mệnh đề quan hệ xác định.","est_minutes":15,"source":["az-grammar-2nd:p19","az-original"],"explanation":[{"kind":"table","title_vi":"Đại từ quan hệ (Relative Pronouns)","head":["Mục","Cách dùng / ví dụ"],"rows":[["WHO / WHOM — chỉ người","WHO (làm chủ ngữ) · WHOM (làm tân ngữ)"],["WHICH — chỉ vật, hoặc cả mệnh đề","WHICH (chủ ngữ hoặc tân ngữ, chỉ vật/sự việc)"],["THAT — chỉ người, vật, nơi chốn, thời gian","THAT (chủ ngữ hoặc tân ngữ)"],["WHOSE — sở hữu","WHOSE + danh từ (thay cho tính từ sở hữu)"]]},{"kind":"table","title_vi":"Trạng từ quan hệ (Relative Adverbs)","head":["Mục","Cách dùng / ví dụ"],"rows":[["WHEN / WHERE / WHY","WHEN = in/on/at + which (thời gian) · WHERE = in/on/at + which (nơi chốn) · WHY = for which (lý do)"]]}],"worked_examples":[{"en":"The candidate who applied last week has excellent experience.","analysis_vi":"Thay cho người (the candidate), làm chủ ngữ của applied → who.","highlight":["who"]},{"en":"The company whose products won the award is based in Hanoi.","analysis_vi":"Sở hữu (sản phẩm của công ty) → whose + danh từ.","highlight":["whose products"]}],"common_mistakes":[{"wrong":"The man which called you is my manager.","right":"The man who called you is my manager.","why_vi":"Thay cho người → who.","error_tag":"REL.pronoun"},{"wrong":"The report who you sent was very clear.","right":"The report that/which you sent was very clear.","why_vi":"Thay cho vật → which/that.","error_tag":"REL.pronoun"}],"vn_difficulties_vi":["Tiếng Việt chỉ có \"mà\", \"người mà\", nên người Việt khó chọn giữa who / which / whose.","Hay bỏ sót động từ trong mệnh đề quan hệ hoặc thêm đại từ thừa (the man who he called)."],"review_recommendations_vi":["Gạch chân danh từ đứng trước chỗ trống: người hay vật, và chỗ trống thiếu chủ ngữ, tân ngữ hay sở hữu."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M09-01-0001"],"guided":["Q-M09-01-0002","Q-M09-01-0003","Q-M09-01-0004","Q-M09-01-0005"],"independent":["Q-M09-01-0006","Q-M09-01-0007","Q-M09-01-0008","Q-M09-01-0009","Q-M09-01-0010","Q-M09-01-0011"],"writing":["Q-M09-01-0012"]}},"questions":[{"id":"Q-M09-01-0001","type":"mcq","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"The employee ___ won the award has worked here for ten years.","options":["who","which","whose","whom"],"answer":0,"distractor_tags":[null,"REL.pronoun","REL.pronoun","REL.pronoun"],"explanation_vi":"Thay cho người, làm chủ ngữ của won → who.","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0002","type":"mcq","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The laptop ___ I bought last month has stopped working.","options":["who","which","whose","whom"],"answer":1,"distractor_tags":["REL.pronoun",null,"REL.pronoun","REL.pronoun"],"explanation_vi":"Thay cho vật (the laptop), làm tân ngữ của bought → which.","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0003","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Ms Hoa is the consultant ___ advice helped us most.","options":["who","which","whose","whom"],"answer":2,"distractor_tags":["REL.pronoun","REL.pronoun",null,"REL.pronoun"],"explanation_vi":"Sở hữu (lời khuyên của cô ấy) + danh từ advice → whose.","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0004","type":"mcq","cefr":"B1","difficulty":4,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The client to ___ we sent the proposal has replied.","options":["who","whom","which","that"],"answer":1,"distractor_tags":["REL.pronoun",null,"REL.pronoun","REL.pronoun"],"explanation_vi":"Sau giới từ to, thay cho người → whom.","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0005","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"This is the hotel ___ we stayed during the conference.","options":["which","where","who","when"],"answer":1,"distractor_tags":["REL.pronoun",null,"REL.pronoun","REL.pronoun"],"explanation_vi":"Thay cho nơi chốn, trong mệnh đề có đủ S + V (we stayed) → where.","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0006","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"Products ___ are damaged can be returned within 30 days.","options":["who","which","whose","where"],"answer":1,"distractor_tags":["REL.pronoun",null,"REL.pronoun","REL.pronoun"],"explanation_vi":"Thay cho vật, làm chủ ngữ của are → which.","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0007","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"The day ___ the new branch opened was very busy.","options":["which","where","when","who"],"answer":2,"distractor_tags":["REL.pronoun","REL.pronoun",null,"REL.pronoun"],"explanation_vi":"Thay cho thời gian (the day) → when.","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0008","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"We need a supplier ___ can deliver within 24 hours.","options":["who","that","whose","where"],"answer":1,"distractor_tags":["REL.pronoun",null,"REL.pronoun","REL.pronoun"],"explanation_vi":"supplier (nhà cung cấp, công ty) làm chủ ngữ của can deliver → that (which cũng đúng nhưng không có trong phương án).","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0009","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Anyone ___ wants to attend must register online.","options":["who","which","whose","whom"],"answer":0,"distractor_tags":[null,"REL.pronoun","REL.pronoun","REL.pronoun"],"explanation_vi":"Thay cho người (anyone), làm chủ ngữ → who.","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0010","type":"error_identification","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["The manager ","who"," ","she"," interviewed me ","was"," very ","friendly","."],"underline":[1,3,5,7],"answer":1,"correction":["(bỏ she)"],"explanation_vi":"Who đã làm chủ ngữ của interviewed, không thêm she: The manager who interviewed me…","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0011","type":"transformation","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Nối 2 câu bằng mệnh đề quan hệ.","original":"I met a designer. Her work is famous in Asia.","cue":"I met a designer whose","answers":["I met a designer whose work is famous in Asia."],"required_patterns":["^i met a designer whose work is famous"],"explanation_vi":"Nối bằng whose + danh từ (her work → whose work).","error_tags":["REL.pronoun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M09-01-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Mệnh đề quan hệ.","task_vi":"Viết 2 câu giới thiệu đồng nghiệp/bạn học, mỗi câu có 1 mệnh đề quan hệ (who, which, whose…).","model_answers":["Lan is the colleague who helps me with English emails. She works in the office which is next to the lift.","My teacher, whose classes are always interesting, is from Hue. I like the course that I joined last month."],"rubric":["who cho người, which/that cho vật, whose + danh từ","Không thêm đại từ thừa trong mệnh đề","Mệnh đề đứng ngay sau danh từ nó bổ nghĩa"],"min_words":12,"explanation_vi":"Câu mẫu: the colleague who helps me / the office which is next to the lift.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M09-05":{"kind":"skill","schema_version":1,"skill_id":"G-M09-05","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Rút gọn mệnh đề quan hệ bằng V-ing (chủ động), V3 (bị động) và to V (sau the first, the only, số thứ tự).","est_minutes":15,"source":["az-grammar-2nd:p20","az-original"],"explanation":[{"kind":"text","title_vi":"Rút gọn mệnh đề quan hệ (Reduced Relative Clauses)","text_vi":"Đại từ quan hệ làm CHỦ NGỮ → bỏ đại từ quan hệ: chủ động → V-ing (The students who are laughing → The students laughing); bị động → V-pp/V3 (The house which was built last year → The house built last year).","list":["Khi mệnh đề quan hệ diễn tả mục đích/khả năng, hoặc danh từ đứng trước có so sánh nhất: chủ động → to V0; bị động → to be V-pp (He is the person who will help you → He is the person to help you).","Đại từ quan hệ làm TÂN NGỮ → bỏ hẳn cả đại từ quan hệ (The book that I bought yesterday → The book I bought yesterday).","WHOEVER (chủ ngữ) = anyone who; THOSE (chủ ngữ) = the people/things — dùng nhiều trong TOEIC Part 5.","Sau khi bỏ đại từ quan hệ làm chủ ngữ, động từ chia theo THÌ GỐC của mệnh đề: mệnh đề gốc ở hiện tại tiếp diễn/quá khứ tiếp diễn đều rút gọn về V-ing giống nhau (mất đi thông tin về thì) — phải dựa vào ngữ cảnh câu để hiểu đúng thời điểm.","Không được rút gọn mệnh đề quan hệ khi đại từ quan hệ đóng vai trò TÂN NGỮ của giới từ đứng cuối câu và giới từ đó không thể lược bỏ về nghĩa."]},{"kind":"table","title_vi":"Ba cách rút gọn","head":["Mệnh đề đầy đủ","Rút gọn"],"rows":[["The girl who is sitting there is my sister.","The girl sitting there is my sister. (V-ing, chủ động)"],["The book which was written by him is famous.","The book written by him is famous. (V3, bị động)"],["He was the first person who arrived.","He was the first person to arrive. (to V)"]]}],"worked_examples":[{"en":"The students living in the dormitory must be back by 10 p.m.","analysis_vi":"who live → living (chủ động).","highlight":["living"]},{"en":"Most of the goods made in this factory are exported.","analysis_vi":"which are made → made (bị động).","highlight":["made"]}],"common_mistakes":[{"wrong":"The man stood at the gate is my teacher.","right":"The man standing at the gate is my teacher.","why_vi":"Chủ động → V-ing: standing.","error_tag":"PART.clause"},{"wrong":"The letter sending yesterday has arrived.","right":"The letter sent yesterday has arrived.","why_vi":"Lá thư được gửi (bị động) → V3: sent.","error_tag":"PART.clause"}],"vn_difficulties_vi":["Người Việt khó nhận ra chủ ngữ của mệnh đề quan hệ chủ động hay bị động.","Hay dùng V-ing cho cả nghĩa bị động."],"review_recommendations_vi":["Rút gọn 3 mệnh đề quan hệ trong bài đọc gần nhất."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M09-05-0001"],"guided":["Q-M09-05-0002","Q-M09-05-0003","Q-M09-05-0004","Q-M09-05-0005"],"independent":["Q-M09-05-0006","Q-M09-05-0007","Q-M09-05-0008","Q-M09-05-0009","Q-M09-05-0010","Q-M09-05-0011"],"writing":["Q-M09-05-0012"]}},"questions":[{"id":"Q-M09-05-0001","type":"mcq","cefr":"B1","difficulty":2,"context":"thpt","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"The boy ___ next to me is my cousin.","options":["sitting","sat",
