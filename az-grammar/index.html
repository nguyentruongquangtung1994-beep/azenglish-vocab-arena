-M11-05-0007","type":"mcq","cefr":"B2","difficulty":2,"context":"thpt","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"Seldom ___ such a hard-working student.","options":["we have met","have we met","we met","met we"],"answer":1,"distractor_tags":["INV.order",null,"INV.order","INV.order"],"explanation_vi":"Seldom đầu câu → đảo: have we met.","error_tags":["INV.order"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M11-05-0008","type":"mcq","cefr":"B2","difficulty":4,"context":"thpt","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Under no circumstances ___ use your phone during the exam.","options":["you should","should you","you must","must you not"],"answer":1,"distractor_tags":["INV.order",null,"INV.order","INV.order"],"explanation_vi":"Under no circumstances đầu câu → đảo: should you.","error_tags":["INV.order"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M11-05-0009","type":"mcq","cefr":"B2","difficulty":4,"context":"thpt","uses":["lesson","review"],"instruction_vi":"Chọn câu gần nghĩa nhất.","stem":"Which sentence is closest in meaning to 'As soon as I got home, it started to rain'?","options":["No sooner had I got home than it started to rain.","No sooner I had got home than it started to rain.","Hardly I got home when it started to rain.","No sooner had I got home when it started to rain."],"answer":0,"distractor_tags":[null,"INV.order","INV.order","INV.order"],"explanation_vi":"Ngay khi (As soon as) viết lại bằng đảo ngữ: No sooner + had + S + V3 + than.","error_tags":["INV.order"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M11-05-0010","type":"error_identification","cefr":"B2","difficulty":3,"context":"thpt","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["Not only ","he plays"," the guitar, but he ","also"," ","writes"," his own ","songs","."],"underline":[1,3,5,7],"answer":0,"correction":["does he play"],"explanation_vi":"Not only đầu câu → đảo: does he play.","error_tags":["INV.order"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M11-05-0011","type":"transformation","cefr":"B2","difficulty":3,"context":"thpt","uses":["lesson","review"],"instruction_vi":"Viết lại câu sao cho nghĩa không đổi, bắt đầu bằng phần cho sẵn.","original":"I had never seen such a big crowd before.","cue":"Never","answers":["Never had I seen such a big crowd before."],"required_patterns":["^never had i seen such a big crowd"],"explanation_vi":"Never đầu câu → đảo trợ động từ had lên trước I.","error_tags":["INV.order"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M11-05-0012","type":"sentence_writing","cefr":"B2","difficulty":2,"context":"thpt","uses":["lesson"],"instruction_vi":"Đảo ngữ.","task_vi":"Viết 2 câu đảo ngữ về bạn: 1 câu với Never/Rarely, 1 câu với No sooner … than hoặc Not only … but also.","model_answers":["Never have I felt so proud as on my graduation day. No sooner had I got home than my friends called me.","Rarely do I miss my English class. Not only does my teacher explain clearly, but she is also very funny."],"rubric":["Trạng từ phủ định đầu câu + trợ động từ + S + V","No sooner … than / Hardly … when đúng cặp","Thì đúng (had + V3 trong No sooner/Hardly)"],"min_words":10,"explanation_vi":"Câu mẫu: Never have I felt… / No sooner had I got home than…","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M13-01":{"kind":"skill","schema_version":1,"skill_id":"G-M13-01","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Nhận ra danh từ, động từ, tính từ, trạng từ qua hậu tố (đuôi từ) để chọn nhanh đáp án từ loại trong TOEIC Part 5.","est_minutes":15,"source":["az-grammar-2nd:p24","az-original"],"explanation":[{"kind":"table","title_vi":"Nhận biết từ loại bằng hậu tố (đuôi từ)","head":["Mục","Cách dùng / ví dụ"],"rows":[["DANH TỪ (Noun) — đuôi thường gặp","-tion / -ment · -ance / -ence · -ist / -ian · -ee · -ism · -ship / -dom / -age · -ity · -er / -or"],["TÍNH TỪ (Adjective) — đuôi thường gặp","-y / -ly · -ous · -able · -al · -ic · -ful · -less · -ive"],["ĐỘNG TỪ (Verb) — đuôi thường gặp","-ize · -ate · -en · -fy"],["TRẠNG TỪ (Adverb)","Hầu hết = tính từ + -ly"]]},{"kind":"note","text_vi":"Hậu tố là gợi ý, không phải luật tuyệt đối: friendly, lovely có đuôi -ly nhưng là tính từ."}],"worked_examples":[{"en":"The manager praised the team for its efficiency.","analysis_vi":"Sau tính từ sở hữu its cần danh từ; đuôi -ency → efficiency là danh từ.","highlight":["efficiency"]},{"en":"Please read the instructions carefully.","analysis_vi":"Bổ nghĩa cho động từ read → trạng từ đuôi -ly: carefully.","highlight":["carefully"]}],"common_mistakes":[{"wrong":"We need more inform about the project.","right":"We need more information about the project.","why_vi":"Sau more (lượng) cần danh từ: information.","error_tag":"WF.suffix"},{"wrong":"She is a very success manager.","right":"She is a very successful manager.","why_vi":"Trước danh từ manager cần tính từ: successful.","error_tag":"WF.suffix"}],"vn_difficulties_vi":["Tiếng Việt không có hậu tố đổi từ loại, nên người Việt phải học thuộc họ từ (decide – decision – decisive – decisively).","Hay chọn theo nghĩa thay vì theo vị trí và đuôi từ."],"review_recommendations_vi":["Mỗi ngày ghi 3 họ từ đủ 4 dạng (danh, động, tính, trạng)."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M13-01-0001"],"guided":["Q-M13-01-0002","Q-M13-01-0003","Q-M13-01-0004","Q-M13-01-0005"],"independent":["Q-M13-01-0006","Q-M13-01-0007","Q-M13-01-0008","Q-M13-01-0009","Q-M13-01-0010","Q-M13-01-0011"],"writing":["Q-M13-01-0012"]}},"questions":[{"id":"Q-M13-01-0001","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"The company announced the ___ of a new branch in Da Nang.","options":["open","opening","opened","opens"],"answer":1,"distractor_tags":["WF.suffix",null,"WF.suffix","WF.suffix"],"explanation_vi":"Sau mạo từ the và trước of cần danh từ: the opening of (việc khai trương).","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0002","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Our new software makes data entry much ___.","options":["easy","easily","easier","ease"],"answer":2,"distractor_tags":["WF.suffix","WF.suffix",null,"WF.suffix"],"explanation_vi":"make + tân ngữ + tính từ; much + so sánh hơn → easier.","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0003","type":"mcq","cefr":"A2","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Which word is a noun?","options":["develop","development","developed","developing"],"answer":1,"distractor_tags":["WF.suffix",null,"WF.suffix","WF.suffix"],"explanation_vi":"Đuôi -ment là hậu tố danh từ: development.","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0004","type":"mcq","cefr":"A2","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Which word is an adjective?","options":["product","produce","productive","productively"],"answer":2,"distractor_tags":["WF.suffix","WF.suffix",null,"WF.suffix"],"explanation_vi":"Đuôi -ive thường là tính từ: productive.","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0005","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The hotel staff were extremely ___ to all the guests.","options":["help","helpful","helpfully","helpfulness"],"answer":1,"distractor_tags":["WF.suffix",null,"WF.suffix","WF.suffix"],"explanation_vi":"Sau be (were) và trạng từ extremely cần tính từ: helpful.","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0006","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"Ms Lan will ___ the details of the contract with the client.","options":["finally","final","finalize","finality"],"answer":2,"distractor_tags":["WF.suffix","WF.suffix",null,"WF.suffix"],"explanation_vi":"Sau will cần động từ nguyên mẫu; đuôi -ize là động từ: finalize.","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0007","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"Applicants must provide proof of their ___.","options":["employ","employment","employed","employable"],"answer":1,"distractor_tags":["WF.suffix",null,"WF.suffix","WF.suffix"],"explanation_vi":"Sau tính từ sở hữu their cần danh từ: employment.","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0008","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The price of fuel has risen ___ this year.","options":["significant","significance","significantly","signify"],"answer":2,"distractor_tags":["WF.suffix","WF.suffix",null,"WF.suffix"],"explanation_vi":"Bổ nghĩa cho động từ has risen → trạng từ: significantly.","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0009","type":"mcq","cefr":"B1","difficulty":4,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"We appreciate your ___ during the renovation.","options":["patient","patience","patiently","patients"],"answer":1,"distractor_tags":["WF.suffix",null,"WF.suffix","WF.suffix"],"explanation_vi":"Sau your cần danh từ chỉ đức tính: patience (sự kiên nhẫn). patients = các bệnh nhân.","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0010","type":"error_identification","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["The ","manager"," gave a ","clearly"," ","explanation"," of the ","new policy","."],"underline":[1,3,5,7],"answer":1,"correction":["clear"],"explanation_vi":"Trước danh từ explanation cần tính từ: clear.","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0011","type":"gap_fill","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Điền dạng đúng của từ trong ngoặc.","stem":"All employees must follow the safety ___ (regulate).","answers":[["regulations"]],"explanation_vi":"Sau tính từ/danh từ safety cần danh từ số nhiều: regulations (quy định).","error_tags":["WF.suffix"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-01-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Họ từ của bạn.","task_vi":"Chọn 1 họ từ (ví dụ success, decide, produce) và viết 2 câu dùng 2 dạng khác nhau của nó.","model_answers":["The launch was a great success. Our team worked successfully with the new client.","We need to make a decision today. She spoke decisively at the meeting."],"rubric":["Dùng đúng từ loại theo vị trí (danh từ sau a/the, trạng từ bổ nghĩa động từ)","Viết đúng chính tả hậu tố","Câu có đủ chủ ngữ và động từ"],"min_words":12,"explanation_vi":"Câu mẫu: success (danh từ) / successfully (trạng từ).","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M13-02":{"kind":"skill","schema_version":1,"skill_id":"G-M13-02","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Chọn từ loại dựa vào vị trí trong câu: trước danh từ là tính từ, sau mạo từ là danh từ, bổ nghĩa động từ là trạng từ.","est_minutes":15,"source":["az-grammar-2nd:p24-25","az-original"],"explanation":[{"kind":"table","title_vi":"Vị trí quyết định từ loại","head":["Mục","Cách dùng / ví dụ"],"rows":[["DANH TỪ (Noun)","Đứng sau a/an/the/tính từ/sở hữu · Làm chủ ngữ (trước động từ) · Làm tân ngữ (sau động từ/giới từ)"],["TÍNH TỪ (Adjective)","Đứng trước danh từ · Đứng sau BE/động từ liên kết (seem, become, remain) · Đứng sau động từ cảm giác (feel, smell, taste, sound)"],["TRẠNG TỪ (Adverb)","Bổ nghĩa cho ĐỘNG TỪ, TÍNH TỪ, hoặc TRẠNG TỪ khác — thường đứng trước động từ thường, sau trợ động từ, hoặc cuối câu"]]},{"kind":"text","title_vi":"V-ing vs. V-pp khi làm tính từ","text_vi":"V-ING dùng khi CHỦ THỂ tự gây ra cảm xúc/tác động — The book is interesting. (bản thân cuốn sách gây hứng thú); The plot was confusing.","list":["V-PP (V-ed) dùng khi chủ thể BỊ TÁC ĐỘNG bởi cảm xúc đó — I am interested in the book. (tôi bị cuốn sách làm cho hứng thú); The wardrobe’s deteriorating condition (tình trạng ĐANG xuống cấp — diễn tả quá trình).","Mẹo nhận biết hậu tố: Danh từ thường có đuôi -tion/-ment/-ance/-ence/-ist/-ship/-ity/-ee; Tính từ thường có đuôi -ive/-ous/-able/-al/-ful/-ic/-y; Trạng từ hầu hết có đuôi -ly.","Một số từ có đuôi -ly nhưng LẠI LÀ TÍNH TỪ, không phải trạng từ: friendly, costly, lovely, timely, likely, orderly — luôn kiểm tra nghĩa và vị trí thay vì chỉ nhìn đuôi -ly.","Khi phân vân giữa 2 tính từ gần nghĩa (VD critical vs. criticizing), ưu tiên từ có nghĩa TỰ NHIÊN và THÔNG DỤNG hơn trong văn phong trang trọng — TOEIC hiếm khi dùng từ hiếm/cổ."]}],"worked_examples":[{"en":"The marketing team made a successful presentation.","analysis_vi":"a + ___ + danh từ (presentation) → tính từ successful.","highlight":["successful"]},{"en":"The report was carefully reviewed by the director.","analysis_vi":"Giữa was và V3 (reviewed) là trạng từ: carefully.","highlight":["carefully"]}],"common_mistakes":[{"wrong":"The new system works very efficient.","right":"The new system works very efficiently.","why_vi":"Bổ nghĩa cho động từ works → trạng từ.","error_tag":"WF.position"},{"wrong":"We were surprising by the results.","right":"We were surprised by the results.","why_vi":"Người cảm thấy → tính từ -ed (surprised); vật gây ra cảm xúc → -ing.","error_tag":"WF.position"}],"vn_difficulties_vi":["Người Việt hay đọc nghĩa cả câu rồi mới chọn, mất thời gian; TOEIC Part 5 thường chỉ cần nhìn 2–3 từ quanh chỗ trống.","Nhầm tính từ -ing và -ed (interesting / interested)."],"review_recommendations_vi":["Làm lại câu sai bằng cách chỉ nhìn từ đứng ngay trước và sau chỗ trống."],"vocabulary_links":[],"flow":{"diag :1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-04-0006","type":"mcq","cefr":"B1","difficulty":4,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"Either the director or the managers ___ going to present the results.","options":["is","are","was","has"],"answer":1,"distractor_tags":["SVA.compound_subject",null,"SVA.compound_subject","SVA.compound_subject"],"explanation_vi":"either … or: động từ chia theo danh từ gần nhất (the managers, số nhiều) → are.","error_tags":["SVA.compound_subject"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-04-0007","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"___ the sales team nor the marketing team met the target.","options":["Either","Both","Neither","Not only"],"answer":2,"distractor_tags":["CORR.pair","CORR.pair",null,"CORR.pair"],"explanation_vi":"Có nor phía sau → Neither.","error_tags":["CORR.pair"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-04-0008","type":"mcq","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The hotel offers both free parking ___ free breakfast.","options":["or","nor","and","but"],"answer":2,"distractor_tags":["CORR.pair","CORR.pair",null,"CORR.pair"],"explanation_vi":"Có both phía trước → vế sau dùng and (both … and: cả … lẫn).","error_tags":["CORR.pair"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-04-0009","type":"mcq","cefr":"B2","difficulty":4,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Not only ___ the report on time, but she also presented it brilliantly.","options":["she finished","did she finish","she did finish","finished she"],"answer":1,"distractor_tags":["INV.order",null,"INV.order","INV.order"],"explanation_vi":"Not only đứng đầu câu → đảo ngữ: did she finish.","error_tags":["INV.order"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-04-0010","type":"error_identification","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["Applicants should ","either"," apply online ","and"," send their CV ","by"," post ","to our office","."],"underline":[1,3,5,7],"answer":1,"correction":["or"],"explanation_vi":"either … or, không dùng either … and.","error_tags":["CORR.pair"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-04-0011","type":"gap_fill","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Điền cặp từ còn thiếu (2 từ).","stem":"The workshop was ___ useful but also fun.","answers":[["not only"]],"explanation_vi":"Có but also phía sau → not only.","error_tags":["CORR.pair"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-04-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Liên từ tương quan.","task_vi":"Viết 2 câu giới thiệu một sản phẩm hoặc khoá học, dùng 2 cặp liên từ khác nhau.","model_answers":["This phone is not only light but also very fast. You can buy it either online or in our store.","The course is both cheap and useful. Neither the teachers nor the students have to come on Sundays."],"rubric":["Ghép đúng cặp (both … and, either … or…)","Hai vế cùng loại từ","Động từ chia đúng"],"min_words":12,"explanation_vi":"Câu mẫu: not only light but also very fast / either online or in our store.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M13-05":{"kind":"skill","schema_version":1,"skill_id":"G-M13-05","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Chọn đúng từ nối câu (however, therefore, moreover…) theo quan hệ ý, và phân biệt với liên từ, giới từ trong TOEIC Part 6.","est_minutes":15,"source":["az-original"],"explanation":[{"kind":"table","title_vi":"Từ nối câu (Transitions) theo chức năng","head":["Mục","Cách dùng / ví dụ"],"rows":[["Bổ sung thông tin","moreover · furthermore · in addition · besides · also"],["Tương phản, nhượng bộ","however · nevertheless · nonetheless · on the other hand · in contrast · instead"],["Kết quả, hệ quả","therefore · consequently · as a result · thus · accordingly"],["Ví dụ, trình tự, điều kiện","for example / for instance · meanwhile · then · afterward · finally · otherwise"]]},{"kind":"text","title_vi":"Phân biệt từ nối câu, liên từ và giới từ","text_vi":"Từ nối câu (however, therefore, moreover…) đứng đầu câu/sau dấu chấm phẩy và có DẤU PHẨY theo sau: \"…; however, sales rose.\"","list":["Liên từ (although, because, while, since) nối hai mệnh đề đầy đủ (S + V): Although the train was delayed, all passengers arrived on time.","Giới từ (despite, because of, due to) theo sau là DANH TỪ/V-ing: Despite the heavy rain, the event went ahead. · The store closed early because of a power outage.","Cặp dễ nhầm: although (+ mệnh đề) ↔ despite (+ danh từ) · because (+ mệnh đề) ↔ because of (+ danh từ)."]},{"kind":"text","title_vi":"Chiến lược Part 6: câu chèn vào đoạn văn","text_vi":"Bước 1: đọc câu TRƯỚC và SAU chỗ trống để hiểu mạch ý.","list":["Bước 2: tìm \"manh mối liên kết\": đại từ (it, they, this), từ nối (however, in addition), từ lặp lại danh từ ở câu trước/sau.","Bước 3: loại các câu lạc đề (nói chuyện khác chủ đề đoạn văn), câu sai thì, hoặc câu lặp lại nguyên ý đã có.","Bước 4: đọc lại cả đoạn với câu vừa chọn xem có mạch lạc không."]}],"worked_examples":[{"en":"The project was delayed. However, the team finished it within budget.","analysis_vi":"Hai câu trái ý → However, đứng đầu câu sau, có dấu phẩy.","highlight":["However,"]},{"en":"Sales increased sharply. As a result, the company hired more staff.","analysis_vi":"Câu sau là kết quả → As a result.","highlight":["As a result,"]}],"common_mistakes":[{"wrong":"Although the price is high. Many customers buy it.","right":"Although the price is high, many customers buy it.","why_vi":"Although là liên từ, phải nối 2 mệnh đề trong cùng một câu.","error_tag":"PREP.conj_vs_prep"},{"wrong":"The weather was bad, however we went out.","right":"The weather was bad. However, we went out.","why_vi":"However là từ nối câu: đứng đầu câu mới (hoặc sau dấu chấm phẩy), có dấu phẩy sau.","error_tag":"TRANS.connector"}],"vn_difficulties_vi":["Người Việt dịch \"tuy nhiên\", \"vì vậy\" và dùng như liên từ nối hai vế bằng dấu phẩy.","Part 6 cần đọc cả câu trước và câu sau mới chọn được từ nối."],"review_recommendations_vi":["Mỗi đoạn Part 6: xác định quan hệ hai câu (thêm ý, trái ý, kết quả, ví dụ) trước khi nhìn đáp án."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M13-05-0001"],"guided":["Q-M13-05-0002","Q-M13-05-0003","Q-M13-05-0004","Q-M13-05-0005"],"independent":["Q-M13-05-0006","Q-M13-05-0007","Q-M13-05-0008","Q-M13-05-0009","Q-M13-05-0010","Q-M13-05-0011"],"writing":["Q-M13-05-0012"]}},"questions":[{"id":"Q-M13-05-0001","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"The marketing budget was cut by half. ___, sales rose by 15% last quarter.","options":["Nevertheless","Likewise","For example","Therefore"],"answer":0,"distractor_tags":[null,"TRANS.connector","TRANS.connector","TRANS.connector"],"explanation_vi":"Dịch: Ngân sách marketing bị cắt một nửa. Tuy vậy, doanh số quý trước vẫn tăng 15%. — Giải thích: kết quả trái với dự đoán (ngân sách giảm nhưng doanh số tăng) → \"Nevertheless\". Mẹo thêm: \"Therefore\" chỉ hệ quả hợp lý, không hợp ở đây.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-1"}},{"id":"Q-M13-05-0002","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The printer has been repaired twice this month. ___, we have decided to replace it.","options":["Instead of","Although","However","Consequently"],"answer":3,"distractor_tags":["TRANS.connector","TRANS.connector","TRANS.connector",null],"explanation_vi":"Dịch: Máy in đã được sửa hai lần trong tháng này. Do đó, chúng tôi quyết định thay nó. — Giải thích: quyết định là hệ quả của việc hỏng nhiều lần → \"Consequently\". Mẹo thêm: \"Instead of\" và \"Although\" không đứng đầu câu với dấu phẩy như từ nối.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-1"}},{"id":"Q-M13-05-0003","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The hotel offers free breakfast. ___, guests can use the fitness center at no charge.","options":["Nevertheless","In addition","Otherwise","In contrast"],"answer":1,"distractor_tags":["TRANS.connector",null,"TRANS.connector","TRANS.connector"],"explanation_vi":"Dịch: Khách sạn phục vụ bữa sáng miễn phí. Ngoài ra, khách có thể dùng phòng gym không mất phí. — Giải thích: hai ưu đãi cùng hướng → từ bổ sung \"In addition\". Mẹo thêm: \"In contrast\" dùng khi hai ý đối lập.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-1"}},{"id":"Q-M13-05-0004","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Please submit the form by Friday. ___, your application will not be processed.","options":["Therefore","Moreover","Otherwise","Meanwhile"],"answer":2,"distractor_tags":["TRANS.connector","TRANS.connector",null,"TRANS.connector"],"explanation_vi":"Dịch: Vui lòng nộp mẫu đơn trước thứ Sáu. Nếu không, hồ sơ của bạn sẽ không được xử lý. — Giải thích: \"Otherwise\" = nếu không thì (hậu quả xấu). Mẹo thêm: rất hay gặp trong thông báo và thư trang trọng.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-1"}},{"id":"Q-M13-05-0005","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Several factors affect employee morale. ___, a flexible schedule can greatly improve job satisfaction.","options":["However","For example","As a result","Otherwise"],"answer":1,"distractor_tags":["TRANS.connector",null,"TRANS.connector","TRANS.connector"],"explanation_vi":"Dịch: Có nhiều yếu tố ảnh hưởng đến tinh thần nhân viên. Ví dụ, lịch làm việc linh hoạt có thể cải thiện đáng kể sự hài lòng. — Giải thích: câu sau nêu ví dụ cho câu trước → \"For example\". Mẹo thêm: đồng nghĩa \"For instance\".","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-1"}},{"id":"Q-M13-05-0006","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"The first team is testing the software. ___, the second team is preparing the user manual.","options":["Meanwhile","Otherwise","Therefore","Instead"],"answer":0,"distractor_tags":[null,"TRANS.connector","TRANS.connector","TRANS.connector"],"explanation_vi":"Dịch: Nhóm thứ nhất đang kiểm thử phần mềm. Trong khi đó, nhóm thứ hai đang soạn hướng dẫn sử dụng. — Giải thích: hai việc diễn ra cùng lúc → \"Meanwhile\". Mẹo thêm: \"Meanwhile\" cũng có thể mở đầu câu và theo sau bởi dấu phẩy.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-1"}},{"id":"Q-M13-05-0007","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"The company had planned to open in May. ___, construction delays pushed the opening to July.","options":["Moreover","For example","However","Similarly"],"answer":2,"distractor_tags":["TRANS.connector","TRANS.connector",null,"TRANS.connector"],"explanation_vi":"Dịch: Công ty đã dự định khai trương vào tháng 5. Tuy nhiên, việc xây dựng bị chậm nên lùi sang tháng 7. — Giải thích: kế hoạch bị đảo ngược → \"However\". Mẹo thêm: \"Moreover\" chỉ thêm ý cùng hướng.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-1"}},{"id":"Q-M13-05-0008","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Ms. Lee did not attend the meeting; ___, she sent her assistant to take notes.","options":["therefore","moreover","otherwise","instead"],"answer":3,"distractor_tags":["TRANS.connector","TRANS.connector","TRANS.connector",null],"explanation_vi":"Dịch: Bà Lee không dự họp; thay vào đó, bà cử trợ lý đến ghi chép. — Giải thích: thay thế một hành động bằng hành động khác → \"instead\". Mẹo thêm: trước \"instead\" dùng dấu chấm phẩy hoặc dấu chấm.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-1"}},{"id":"Q-M13-05-0009","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The new policy reduces costs. ___, it improves customer satisfaction.","options":["Nonetheless","Otherwise","Furthermore","Instead"],"answer":2,"distractor_tags":["TRANS.connector","TRANS.connector",null,"TRANS.connector"],"explanation_vi":"Dịch: Chính sách mới giúp giảm chi phí. Hơn nữa, nó còn nâng cao sự hài lòng của khách hàng. — Giải thích: hai lợi ích cùng hướng → \"Furthermore\". Mẹo thêm: Furthermore = Moreover = In addition.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-1"}},{"id":"Q-M13-05-0010","type":"error_identification","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["Although"," the heavy rain, the outdoor concert ","went"," ahead ","as"," ","planned","."],"underline":[0,2,4,6],"answer":0,"correction":["Despite","In spite of"],"explanation_vi":"Sau chỗ này là cụm danh từ (the heavy rain), không phải mệnh đề → dùng giới từ Despite / In spite of, không dùng liên từ Although.","error_tags":["PREP.conj_vs_prep"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-05-0011","type":"gap_fill","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Điền 1 từ nối câu.","stem":"The office will be closed on Monday. ___, all staff should work from home.","answers":[["Therefore","As a result","Consequently","Thus"]],"explanation_vi":"Câu sau là hệ quả của việc văn phòng đóng cửa → Therefore / As a result / Consequently / Thus.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-05-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Viết về một thay đổi.","task_vi":"Viết 2 câu nối với nhau bằng However hoặc Therefore về một thay đổi ở nơi bạn học/làm việc.","model_answers":["Our school has a new library. However, it closes too early for working students.","The company changed its software last month. Therefore, all staff had to attend a training session."],"rubric":["Từ nối đứng đầu câu thứ hai, có dấu phẩy sau","Quan hệ ý đúng (trái ý → However, kết quả → Therefore)","Hai câu đều hoàn chỉnh"],"min_words":12,"explanation_vi":"Câu mẫu: … . However, … / … . Therefore, …","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M13-05-0013","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"___ the train was delayed, all passengers arrived on time.","options":["Therefore","However","Despite","Although"],"answer":3,"distractor_tags":["TRANS.connector","TRANS.connector","TRANS.connector",null],"explanation_vi":"Dịch: Mặc dù tàu bị trễ, tất cả hành khách vẫn đến đúng giờ. — Giải thích: chỗ trống theo sau là mệnh đề đầy đủ (the train was delayed) → cần liên từ \"Although\". Mẹo thêm: \"Despite\" phải theo sau là danh từ/V-ing.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-1"}},{"id":"Q-M13-05-0014","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"___ the heavy rain, the outdoor event went ahead as planned.","options":["Because","Despite","Although","However"],"answer":1,"distractor_tags":["TRANS.connector",null,"TRANS.connector","TRANS.connector"],"explanation_vi":"Dịch: Bất chấp cơn mưa lớn, sự kiện ngoài trời vẫn diễn ra như kế hoạch. — Giải thích: theo sau là cụm danh từ \"the heavy rain\" → giới từ \"Despite\". Mẹo thêm: \"Although\" cần một mệnh đề đầy đủ.","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-2"}},{"id":"Q-M13-05-0015","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The store closed early ___ a power outage.","options":["because of","because","although","however"],"answer":0,"distractor_tags":[null,"TRANS.connector","TRANS.connector","TRANS.connector"],"explanation_vi":"Dịch: Cửa hàng đóng cửa sớm do mất điện. — Giải thích: theo sau là danh từ \"a power outage\" → \"because of\". Mẹo thêm: \"because\" phải đi kèm mệnh đề (because there was a power outage).","error_tags":["TRANS.connector"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài p6-2"}},{"id":"Q-M13-05-0016","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Thank you for booking with Sunrise Travel. Your tour begins on June 3 at 8 a.m. ___ Please arrive at the meeting point 15 minutes early.","options":["The meeting point is in front of <script>/* AZ Grammar · lõi chấm điểm, mastery, lịch ôn, lưu tiến độ.
   Không đụng tới giao diện để chạy kiểm thử được bằng Node (tests/test_engine.js).
   norm() PHẢI giống tools/validate_content.py → norm(); ca kiểm thử chung: tests/norm_cases.json. */
(function (root) {
  "use strict";
  var CONTRACTIONS = [["won't", "will not"], ["can't", "cannot"], ["shan't", "shall not"], ["n't", " not"], ["'m", " am"], ["'re", " are"], ["'ve", " have"], ["'ll", " will"]];
  function norm(s) {
    s = String(s == null ? "" : s).toLowerCase().replace(/’|‘/g, "'").replace(/“|”/g, '"');
    CONTRACTIONS.forEach(function (c) { s = s.split(c[0]).join(c[1]); });
    s = s.split("can not").join("cannot");
    s = s.replace(/\s+/g, " ").trim().replace(/\s+([,.!?;:])/g, "$1");
    return s.replace(/[.!?]+$/, "").trim();
  }
  function words(s) { return String(s || "").trim().split(/\s+/).filter(Boolean).length; }

  /* Chấm 1 câu. Trả về { status, correct, given, expected, tag }
     status: "correct" | "wrong" | "unrecognized" (viết lại câu: không có trong đáp án nhưng đúng mẫu bắt buộc → không tính sai)
             | "self" (câu viết: người học tự chấm, không tính điểm) */
  function grade(q, given) {
    var t = q.type, r = { status: "wrong", given: given, tag: null };
    function inList(list, g) { var n = norm(g); return list.some(function (a) { return norm(a) === n; }); }
    if (t === "mcq") {
      r.status = given === q.answer ? "correct" : "wrong";
      r.expected = q.options[q.answer];
      if (r.status === "wrong" && q.distractor_tags) r.tag = q.distractor_tags[given] || null;
    } else if (t === "gap_fill") {
      var g = Array.isArray(given) ? given : [given];
      var each = q.answers.map(function (vs, i) { return inList(vs, g[i] || ""); });
      r.blanks = each; r.status = each.every(Boolean) ? "correct" : "wrong";
      r.expected = q.answers.map(function (vs) { return vs[0]; }).join(" … ");
    } else if (t === "error_identification") {
      r.status = given === q.answer ? "correct" : "wrong";
      r.expected = "ABCD".charAt(q.answer) + " → " + q.correction[0];
    } else if (t === "error_correction" || t === "ordering") {
      r.status = inList(q.answers, given) ? "correct" : "wrong";
      r.expected = q.answers[0];
    } else if (t === "transformation") {
      if (inList(q.answers, given)) r.status = "correct";
      else if (norm(given).indexOf(norm(q.cue)) === 0 && (q.required_patterns || []).length &&
               q.required_patterns.every(function (p) { return new RegExp(p, "i").test(norm(given)); })) r.status = "unrecognized";
      r.expected = q.answers[0];
    } else if (t === "sentence_writing") {
      r.status = "self"; r.expected = q.model_answers[0];
      r.tooShort = words(given) < (q.min_words || 4);
    }
    r.correct = r.status === "correct";
    if (!r.correct && !r.tag && r.status === "wrong" && q.error_tags && q.error_tags.length) r.tag = q.error_tags[0];
    return r;
  }
  /* Đáp án mẫu dưới dạng "given" — dùng cho kiểm thử: chấm chính đáp án phải ra "correct". */
  function keyAsGiven(q) {
    switch (q.type) {
      case "mcq": case "error_identification": return q.answer;
      case "gap_fill": return q.answers.map(function (v) { return v[0]; });
      case "error_correction": case "ordering": case "transformation": return q.answers[0];
      case "sentence_writing": return q.model_answers[0];
    }
  }

  /* Điểm 1 lượt nhiệm vụ: chỉ tính câu chấm được (bỏ câu chẩn đoán, câu viết, câu "unrecognized") */
  function score(results) {
    var g = results.filter(function (x) { return x.counted && (x.status === "correct" || x.status === "wrong"); });
    var c = g.filter(function (x) { return x.status === "correct"; }).length;
    return { correct: c, total: g.length, pct: g.length ? Math.round(100 * c / g.length) : 0 };
  }

  /* Mastery: 20 lượt gần nhất của 1 điểm, lượt thứ k (tính từ mới nhất) nặng 0.9^k. Chỉ "đủ dữ liệu" khi n ≥ 8 và ≥ 2 ngày. */
  function mastery(attempts) {
    var a = attempts.filter(function (x) { return x.ok === true || x.ok === false; }).slice(-20).reverse();
    var w = 0, s = 0, days = {};
    a.forEach(function (x, k) { var wk = Math.pow(0.9, k); w += wk; s += wk * (x.ok ? 1 : 0); days[x.d] = 1; });
    var n = attempts.filter(function (x) { return x.ok === true || x.ok === false; }).length;
    var nd = Object.keys(days).length, sc = w ? Math.round(1000 * s / w) / 10 : 0;
    var level = !n ? "new" : (n < 8 || nd < 2) ? (sc >= 60 ? "learning" : "learning") : sc >= 80 ? "mastered" : sc >= 60 ? "fair" : "learning";
    return { score: sc, n: n, days: nd, level: level, enough: n >= 8 && nd >= 2 };
  }
  var REVIEW_STEPS = [1, 3, 7, 21];
  function addDays(day, n) { var d = new Date(day + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  /* Lịch ôn: qua bài → ôn sau 1 ngày; ôn đạt → bước kế (3, 7, 21 ngày); ôn trượt → về 1 ngày. */
  function nextReview(cur, passed, today) {
    var step = cur ? cur.step : -1;
    step = passed ? Math.min(step + 1, REVIEW_STEPS.length) : 0;
    return step >= REVIEW_STEPS.length ? { step: step, due: null } : { step: step, due: addDays(today, REVIEW_STEPS[step]) };
  }

  /* Lưu trên máy: mọi lần đọc/ghi bọc try/catch; hỏng thì chạy bằng bộ nhớ tạm. */
  var KEY = "azg.v1", mem = null;
  function blank() { return { v: 1, attempts: [], review: {}, tracks: {}, user: null, done: {} }; }
  function load() {
    if (mem) return mem;
    try { var raw = root.localStorage && root.localStorage.getItem(KEY); mem = raw ? JSON.parse(raw) : blank(); }
    catch (e) { mem = blank(); mem._noStore = true; }
    if (!mem || mem.v !== 1) mem = blank();
    return mem;
  }
  function save() {
    if (!mem) return false;
    if (mem.attempts.length > 3000) mem.attempts = mem.attempts.slice(-3000);
    try { root.localStorage.setItem(KEY, JSON.stringify(mem)); return true; } catch (e) { mem._noStore = true; return false; }
  }
  function reset() { mem = blank(); save(); }

  /* Kiểm tra đầu vào → gợi ý lộ trình. Chỉ là GỢI Ý (không khẳng định trình độ CEFR).
     ans: [{ q, skill, tier: "T1"|"T2"|"T3", ok: true|false }]   (bấm "Mình chưa biết" = ok:false)
     found: mảng skill theo từng bước lộ trình Nền tảng (null cho ngày ôn/kiểm tra) · goal: FOUND|THPT|TOEIC|IELTS */
  function placementResult(ans, rules, found, goal) {
    var tiers = {}, mods = {}, weak = [];
    ans.forEach(function (a) {
      var t = tiers[a.tier] = tiers[a.tier] || { c: 0, n: 0 }; t.n++; if (a.ok) t.c++;
      var m = a.skill.slice(2, 5), mm = mods[m] = mods[m] || { c: 0, n: 0 }; mm.n++; if (a.ok) mm.c++;
      if (!a.ok && weak.indexOf(a.skill) < 0) weak.push(a.skill);
    });
    function pct(t) { return tiers[t] && tiers[t].n ? tiers[t].c / tiers[t].n : null; }
    var p1 = pct("T1"), p2 = pct("T2"), p3 = pct("T3"), t1wrong = tiers.T1 ? tiers.T1.n - tiers.T1.c : 0;
    var stopped = t1wrong >= rules.stop_if_t1_wrong_at_least && p2 === null;
    var weakFoundDay = -1; found.forEach(function (sk, i) { if (weakFoundDay < 0 && sk && weak.indexOf(sk) >= 0) weakFoundDay = i; });
    var level, track, day;
    if (stopped || p1 === null || p1 < rules.found_from_day1_below) { level = "A1 · nên xây lại nền từ đầu"; track = "FOUND"; day = 0; }
    else if (p1 < rules.track_ready_at || (p2 !== null && p2 < 0.5)) { level = p1 < rules.track_ready_at ? "A1–A2 · nền còn lỗ hổng" : "A2 · sẵn sàng lên B1"; track = "FOUND"; day = weakFoundDay < 0 ? 0 : weakFoundDay; }
    else {
      level = p2 === null || p2 < rules.track_ready_at ? "B1 đang hình thành" : (p3 === null || p3 < 0.5) ? "B1 vững" : "B2 trở lên";
      if (goal === "FOUND" || goal === "THPT") { track = goal === "THPT" ? "THPT" : "FOUND"; day = weakFoundDay < 0 ? found.length - 1 : weakFoundDay; }
      else { track = goal; day = 0; }
    }
    return { tiers: { T1: p1, T2: p2, T3: p3 }, stopped: stopped, level: level, track: track, day: day, modules: mods, weak: weak, weakFoundDay: weakFoundDay };
  }

  var api = { placementResult: placementResult, norm: norm, grade: grade, keyAsGiven: keyAsGiven, score: score, mastery: mastery, nextReview: nextReview, addDays: addDays, words: words, load: load, save: save, reset: reset };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.AZG = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* AZ Grammar · bản đồ hành trình "Chuyến xe Ngữ pháp".
   Xe buýt AZ chạy theo con đường khi cuộn (GSAP ScrollTrigger + MotionPath), thả tay thì trượt và dừng đúng trạm.

      api({ t: "register", name: u.name, phone: u.phone, email: u.email, role: u.role, goal: u.track, school: u.school, consent: u.consent, parent: u.parent, code: code, source: "web" }).then(function (r) {
        if (r && r.ok === false && r.error && !r.network && !r.offline) { btn.disabled = false; btn.textContent = "Đăng ký và học tiếp"; m.querySelector("#ferr").textContent = r.error; return; }
        if (r && r.uid) u.uid = r.uid; else if (API) queue({ t: "register", name: u.name, phone: u.phone, email: u.email, role: u.role, goal: u.track, school: u.school, consent: u.consent, parent: u.parent, code: code, source: "web" });
        st.user = u; if (u.track !== "THPT") st.track = u.track; persist(); pushPlacement(); if (st.attempts.length) pushProgress(); done();
      });
      function done() {
      app.innerHTML = "";
      var ok = h('<main class="wrap"><div class="mission"><div class="panel"><span class="stage">Đăng ký xong</span><h1 style="font-size:28px">Chào ' + esc(name.split(" ").pop()) + ', đây là mã khôi phục của bạn</h1><div class="code">' + code + '</div><p class="muted">Chụp màn hình hoặc chép lại mã này. Đổi máy thì nhập số điện thoại và mã để học tiếp. Mã chỉ hiện một lần; máy chủ chỉ lưu bản đã mã hoá.</p><div class="acts"><button class="btn ghost sm" type="button" id="cp">Chép mã</button><button class="btn" type="button" id="cont">Học tiếp</button></div></div></div></main>');
      app.appendChild(ok);
      ok.querySelector("#cp").onclick = function () { var b = this; (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { b.textContent = "Đã chép"; }, function () { var r = document.createRange(); r.selectNodeContents(ok.querySelector(".code")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Đã chọn mã, bấm Sao chép"; }); };
      ok.querySelector("#cont").onclick = function () { if (opt.then && opt.then.placement) go("kiemtra", { showResult: true }); else if (opt.then) startDay(opt.then.tid, opt.then.i); else go("home"); };
      }
    };
  }

  function restoreView(opt) {
    app.innerHTML = "";
    var m = h('<main class="wrap"><div class="mission"><div class="panel"><span class="stage">Khôi phục tiến độ</span><h1 style="font-size:26px">Học tiếp trên máy này</h1><p class="muted">Nhập số điện thoại đã đăng ký và mã khôi phục 8 ký tự bạn nhận lúc đăng ký.</p>' +
      '<form class="form" id="rf" novalidate><label for="rp">Số điện thoại<input id="rp" inputmode="tel" autocomplete="tel"></label><label for="rc">Mã khôi phục<input id="rc" autocapitalize="characters" autocomplete="off" maxlength="8"></label><p class="err" id="rerr" role="alert"></p>' +
      '<div class="acts"><button class="link" type="button" id="rb">Quay lại</button><button class="btn" type="submit">Khôi phục</button></div></form></div></div></main>');
    app.appendChild(m);
    m.querySelector("#rb").onclick = function () { opt && opt.then ? go("dangky", opt) : go("tiendo"); };
    m.querySelector("#rf").onsubmit = function (e) {
      e.preventDefault(); var b = m.querySelector('#rf button[type="submit"]'); b.disabled = true; b.textContent = "Đang tìm…";
      api({ t: "restore", phone: m.querySelector("#rp").value.replace(/\D/g, ""), code: m.querySelector("#rc").value.trim().toUpperCase() }).then(function (r) {
        b.disabled = false; b.textContent = "Khôi phục";
        if (!r || !r.ok) { m.querySelector("#rerr").textContent = (r && r.error) || "Không kết nối được máy chủ, bạn thử lại sau nhé."; return; }
        var d = {}; try { d = JSON.parse(r.data || "{}"); } catch (x) {}
        st.user = { name: r.name, phone: m.querySelector("#rp").value.replace(/\D/g, ""), track: r.goal || "FOUND", uid: r.uid, at: today() };
        if (d.done) st.done = d.done; if (d.review) st.review = d.review; if (d.track) st.track = d.track; if (d.attempts) st.attempts = d.attempts;
        persist(); go("home", { toMap: true });
      });
    };
  }

  /* ---------- Tiến độ ---------- */
  function viewProgress() {
    var tids = ["FOUND", "TOEIC", "IELTS"], learned = {}; st.attempts.forEach(function (a) { learned[a.s] = 1; });
    var tags = {}; st.attempts.forEach(function (a) { if (a.ok === false && a.e) tags[a.e] = (tags[a.e] || 0) + 1; });
    var tl = Object.keys(tags).sort(function (a, b) { return tags[b] - tags[a]; }).slice(0, 5), d = today();
    var due = Object.keys(st.review).filter(function (k) { return st.review[k].due && st.review[k].due <= d; });
    var m = h('<main class="wrap"><section class="sec"><div class="sec-h"><div><h2>Tiến độ của bạn</h2><p>' + (st.user ? "Đã đăng ký: " + esc(st.user.name) + ". " : "Chưa đăng ký: tiến độ chỉ lưu trên trình duyệt này. " + (API ? '<button class="link" type="button" id="toRs">Đã đăng ký trên máy khác? Khôi phục tiến độ</button> ' : "")) + (st._noStore ? '<b>Trình duyệt đang chặn bộ nhớ (chế độ ẩn danh?), tiến độ sẽ mất khi đóng trang.</b>' : '') + '</p></div></div>' +
      '<div class="grid g4"><div class="card"><span class="lbl">Chuỗi ngày</span><div class="big" style="font-size:40px">' + streak() + '</div></div><div class="card"><span class="lbl">Câu đã làm</span><div class="big" style="font-size:40px">' + st.attempts.length + '</div></div><div class="card"><span class="lbl">Bài đã học</span><div class="big" style="font-size:40px">' + Object.keys(learned).length + '</div></div><div class="card"><span class="lbl">Cần ôn hôm nay</span><div class="big" style="font-size:40px">' + due.length + '</div></div></div>' +
      '<div class="grid g2"><div class="card"><h3 style="font-size:19px;margin-bottom:8px">Lộ trình</h3><div class="list" id="tl"></div></div><div class="card"><h3 style="font-size:19px;margin-bottom:8px">Lỗi bạn hay mắc</h3><div id="errs"></div></div></div>' +
      '<div class="card"><h3 style="font-size:19px;margin-bottom:8px">Mức thành thạo từng bài</h3><div class="list" id="ml"></div></div>' +
      '<div class="acts"><button class="link" type="button" id="rst">Xoá tiến độ trên máy này</button><span></span></div></section></main>');
    app.appendChild(m);
    var tlb = m.querySelector("#tl");
    tids.forEach(function (t) { var ts = trackState(t); tlb.appendChild(h('<div class="it"><div><div class="t">' + esc(TRACK_INFO[t].name) + '</div><div class="s">' + ts.done + '/' + ts.total + ' ngày</div></div><div style="width:120px" class="bar"><i style="width:' + Math.round(100 * ts.done / ts.total) + '%"></i></div></div>')); });
    m.querySelector("#errs").appendChild(tl.length ? h('<div class="list">' + tl.map(function (t) { return '<div class="it"><span class="t">' + esc(TAGS[t] || t) + '</span><span class="chip red">' + tags[t] + ' lần</span></div>'; }).join("") + '</div>') : h('<div class="empty">Chưa có lỗi nào được ghi. Làm vài câu là thấy ngay nhóm lỗi của bạn.</div>'));
    var ml = m.querySelector("#ml"), ids = Object.keys(learned);
    if (!ids.length) ml.appendChild(h('<div class="empty">Bạn chưa học bài nào. Bắt đầu từ trang Hôm nay.</div>'));
    ids.forEach(function (sid) { var ms = E.mastery(st.attempts.filter(function (a) { return a.s === sid; })), rv = st.review[sid];
      ml.appendChild(h('<div class="it"><div><div class="t">' + esc(SKILL[sid].title_vi) + '</div><div class="s">' + ms.n + ' câu · ' + ms.days + ' ngày' + (rv && rv.due ? ' · ôn ' + rv.due.split("-").reverse().join("/") : '') + '</div></div><span class="chip lv-' + ms.level + '">' + lvLabel(ms.level) + (ms.enough ? " " + ms.score + "%" : "") + '</span></div>')); });
    var trs = m.querySelector("#toRs"); if (trs) trs.onclick = function () { restoreView({}); };
    var r = m.querySelector("#rst");
    r.onclick = function () { if (r.dataset.c) { E.reset(); st = E.load(); go("tiendo"); } else { r.dataset.c = 1; r.textContent = "Bấm lần nữa để xoá hẳn"; } };
  }

  /* ---------- khởi động ---------- */
  if (API) flush();
  document.getElementById("previewText").textContent = DATA.mode === "preview" ? " Bài học và câu hỏi là bản nháp chờ giáo viên AZ duyệt; tiến độ, kết quả kiểm tra và thông tin đăng ký chỉ lưu trên trình duyệt này." : "";
  if (DATA.mode !== "preview") { if (DATA.draft) { document.getElementById("previewText").textContent = " Nội dung đang được giáo viên AZ rà soát. Thấy câu nào chưa ổn, bấm \"Báo lỗi câu này\" giúp AZ nhé."; document.querySelector("#previewBar b").textContent = "Bản thử nghiệm."; document.querySelector("#previewBar .short").textContent = "Đang rà soát nội dung."; } else document.getElementById("previewBar").hidden = true; }
  document.getElementById("buildInfo").textContent = "Nội dung build " + DATA.built + " · " + CAT.skills.length + " điểm ngữ pháp · " + Object.keys(SK).length + " bài có nội dung";
  try { history.scrollRestoration = "manual"; } catch (e) {}
  var start = (location.hash || "").replace("#", "");
  go(["home", "lotrinh", "thuvien", "tiendo", "kiemtra"].indexOf(start) >= 0 ? start : "home");
})();
</script>
