":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-06-0008","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"If you need help, please contact Ms Ha or ___.","options":["I","me","my","mine"],"answer":1,"distractor_tags":["PRON.case",null,"PRON.case","PRON.case"],"explanation_vi":"Sau động từ contact (qua or) cần tân ngữ: me.","error_tags":["PRON.case"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-06-0009","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Our results are good, but ___ are even better.","options":["their","theirs","them","they"],"answer":1,"distractor_tags":["PRON.case",null,"PRON.case","PRON.case"],"explanation_vi":"Đứng một mình làm chủ ngữ, thay cho their results → theirs.","error_tags":["PRON.case"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-06-0010","type":"error_identification","cefr":"A2","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["Him"," and ","his"," team ","have finished"," ","the project","."],"underline":[0,2,4,6],"answer":0,"correction":["He"],"explanation_vi":"Làm chủ ngữ của câu → He.","error_tags":["PRON.case"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-06-0011","type":"gap_fill","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Điền 1 đại từ.","stem":"The new interns introduced ___ at the morning meeting.","answers":[["themselves"]],"explanation_vi":"Chủ ngữ và tân ngữ là cùng người (the new interns) → đại từ phản thân: themselves.","error_tags":["PRON.reflexive"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-06-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Đại từ.","task_vi":"Viết 2 câu về bạn và đồng nghiệp/bạn học: dùng ít nhất 1 tân ngữ (me, him…) và 1 đại từ sở hữu (mine, hers…).","model_answers":["My manager asked me to call the client. Her desk is next to mine.","Our teacher gave us a new test. My answer was different from his."],"rubric":["Tân ngữ đứng sau động từ/giới từ","Đại từ sở hữu đứng một mình (mine, yours…)","Tính từ sở hữu đứng trước danh từ"],"min_words":12,"explanation_vi":"Câu mẫu: asked me / next to mine.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M02-08":{"kind":"skill","schema_version":1,"skill_id":"G-M02-08","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Dùng đúng another, other, others, the other, each other và các đại từ bất định (someone, anything…) trong câu TOEIC.","est_minutes":12,"source":["az-original"],"explanation":[{"kind":"table","title_vi":"Phân biệt another / other / others / the other / each other","head":["Mục","Cách dùng / ví dụ"],"rows":[["another","another + N số ít (một cái nữa, một cái khác)"],["other / others","other + N số nhiều · others = other + N (đại từ, không có danh từ theo sau)"],["the other / the others / each other","the other = cái còn lại (trong 2) · the others = những cái còn lại (xác định) · each other = lẫn nhau"]]},{"kind":"table","title_vi":"Đại từ bất định","head":["Khẳng định","Phủ định / câu hỏi"],"rows":[["someone, something, somewhere","anyone, anything, anywhere"],["everyone, everything (động từ số ít)","no one, nothing (động từ số ít, câu khẳng định)"]]}],"worked_examples":[{"en":"We need another printer for the second floor.","analysis_vi":"another + danh từ số ít đếm được (thêm một cái nữa).","highlight":["another printer"]},{"en":"Some staff work from home; the others work in the office.","analysis_vi":"the others = những người còn lại (đã xác định).","highlight":["the others"]}],"common_mistakes":[{"wrong":"Everyone have finished the test.","right":"Everyone has finished the test.","why_vi":"everyone đi với động từ số ít.","error_tag":"SVA.every_each"},{"wrong":"Can I have other cup of coffee?","right":"Can I have another cup of coffee?","why_vi":"Danh từ số ít đếm được → another.","error_tag":"DET.other"}],"vn_difficulties_vi":["Tiếng Việt chỉ có \"khác\", \"còn lại\", nên another / other / the other rất dễ lẫn.","Hay chia số nhiều sau everyone vì nghĩ \"mọi người\" là nhiều người."],"review_recommendations_vi":["Tự đặt 4 câu với another, other + N số nhiều, the other, the others."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M02-08-0001"],"guided":["Q-M02-08-0002","Q-M02-08-0003","Q-M02-08-0004","Q-M02-08-0005"],"independent":["Q-M02-08-0006","Q-M02-08-0007","Q-M02-08-0008","Q-M02-08-0009","Q-M02-08-0010","Q-M02-08-0011"],"writing":["Q-M02-08-0012"]}},"questions":[{"id":"Q-M02-08-0001","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"We have one meeting room on the first floor and ___ on the second floor.","options":["other","each other","others","another"],"answer":3,"distractor_tags":["DET.other","DET.other","DET.other",null],"explanation_vi":"Dịch: Chúng tôi có một phòng họp ở tầng 1 và một phòng khác ở tầng 2. — Giải thích: \"another\" (một cái nữa) đứng như đại từ số ít, thay cho \"another meeting room\". Mẹo thêm: \"other\" không bao giờ đứng một mình như đại từ số ít.","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-1"}},{"id":"Q-M02-08-0002","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Some employees prefer e-mail, while ___ prefer phone calls.","options":["the other","others","another","other"],"answer":1,"distractor_tags":["DET.other",null,"DET.other","DET.other"],"explanation_vi":"Dịch: Một số nhân viên thích email, trong khi những người khác thích gọi điện. — Giải thích: \"others\" = other employees, đứng một mình không có danh từ theo sau. Mẹo thêm: mẫu \"Some … others …\" rất hay gặp.","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-1"}},{"id":"Q-M02-08-0003","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The company has two branches. One is in Hanoi and ___ is in Da Nang.","options":["other","another","the other","others"],"answer":2,"distractor_tags":["DET.other","DET.other",null,"DET.other"],"explanation_vi":"Dịch: Công ty có hai chi nhánh. Một cái ở Hà Nội và cái còn lại ở Đà Nẵng. — Giải thích: nhóm chỉ có 2 → one … the other. Mẹo thêm: nếu nhóm có từ 3 trở lên mới dùng another / the others.","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-1"}},{"id":"Q-M02-08-0004","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Please invite the ___ managers to the meeting as well.","options":["other","others","each other","another"],"answer":0,"distractor_tags":[null,"DET.other","DET.other","DET.other"],"explanation_vi":"Dịch: Vui lòng mời cả các quản lý còn lại đến cuộc họp. — Giải thích: \"the other + N số nhiều\" (managers) = những người còn lại. Mẹo thêm: \"another\" chỉ đi với danh từ số ít nên loại.","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-1"}},{"id":"Q-M02-08-0005","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The two departments should help ___ during the busy season.","options":["the other","another","others","each other"],"answer":3,"distractor_tags":["DET.other","DET.other","DET.other",null],"explanation_vi":"Dịch: Hai phòng ban nên giúp đỡ lẫn nhau trong mùa cao điểm. — Giải thích: hành động tương hỗ → \"each other\" (làm tân ngữ). Mẹo thêm: đồng nghĩa \"one another\".","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-1"}},{"id":"Q-M02-08-0006","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"We need ___ week to finish the audit.","options":["others","other","another","the others"],"answer":2,"distractor_tags":["DET.other","DET.other",null,"DET.other"],"explanation_vi":"Dịch: Chúng tôi cần thêm một tuần nữa để hoàn tất cuộc kiểm toán. — Giải thích: \"another + N số ít\" (week) = thêm một. Mẹo thêm: \"other week\" sai vì thiếu \"an-\".","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-1"}},{"id":"Q-M02-08-0007","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"I don’t like this design. Could you show me ___ one?","options":["other","another","others","each other"],"answer":1,"distractor_tags":["DET.other",null,"DET.other","DET.other"],"explanation_vi":"Dịch: Tôi không thích mẫu thiết kế này. Bạn cho tôi xem mẫu khác được không? — Giải thích: \"another one\" = một mẫu khác. Mẹo thêm: \"one\" ở đây thay cho danh từ số ít đã nhắc.","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-1"}},{"id":"Q-M02-08-0008","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"___ students passed the exam; the rest have to retake it.","options":["Some","Every","Each other","Any"],"answer":0,"distractor_tags":[null,"DET.other","DET.other","DET.other"],"explanation_vi":"Dịch: Một số sinh viên đã qua kỳ thi; số còn lại phải thi lại. — Giải thích: khẳng định + danh từ số nhiều → \"Some\". Mẹo thêm: \"Any\" chủ yếu dùng ở câu phủ định/nghi vấn.","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-1"}},{"id":"Q-M02-08-0009","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Both ___ the proposals were rejected by the board.","options":["at","of","in","on"],"answer":1,"distractor_tags":["DET.other",null,"DET.other","DET.other"],"explanation_vi":"Dịch: Cả hai đề xuất đều bị hội đồng quản trị bác bỏ. — Giải thích: \"both of the + N số nhiều\" hoặc \"both the + N\". Mẹo thêm: nếu có đại từ thì bắt buộc \"of\": both of them.","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-1"}},{"id":"Q-M02-08-0010","type":"error_identification","cefr":"A2","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["Everyone"," in the department ","have"," received ","an email"," about ","the new policy","."],"underline":[0,2,4,6],"answer":1,"correction":["has"],"explanation_vi":"everyone + động từ số ít → has.","error_tags":["SVA.every_each"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-08-0011","type":"gap_fill","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Điền another, other hoặc others.","stem":"This printer is broken. Please use the ___ one on the second floor.","answers":[["other"]],"explanation_vi":"Chỉ có 2 máy, máy còn lại (xác định) → the other.","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-08-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"another và the other.","task_vi":"Viết 2 câu: 1 câu dùng another, 1 câu dùng the other hoặc the others.","model_answers":["I have already read this report, so please give me another one. Two of my colleagues are in Hanoi; the others are in Nha Trang.","We need another meeting room. One printer works, but the other is broken."],"rubric":["another + danh từ số ít","the other(s) = cái/người còn lại đã xác định","Động từ chia đúng số"],"min_words":12,"explanation_vi":"Câu mẫu: another one / the others are.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-08-0013","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"These two projects are similar, but ___ project has a different budget.","options":["each","others","every one","all"],"answer":0,"distractor_tags":[null,"DET.other","DET.other","DET.other"],"explanation_vi":"Dịch: Hai dự án này giống nhau nhưng mỗi dự án có ngân sách khác nhau. — Giải thích: \"each + N số ít\" = mỗi. Mẹo thêm: \"every one\" phải đi với \"of\" (every one of the projects).","error_tags":["DET.other"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-1"}}]},"G-M02-11":{"kind":"skill","schema_version":1,"skill_id":"G-M02-11","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Nhận ra và dùng đúng danh từ ghép, tính từ ghép trong TOEIC: danh từ đầu không thêm -s, trật tự đúng.","est_minutes":12,"source":["az-original"],"explanation":[{"kind":"text","title_vi":"Danh từ ghép (Compound Nouns) và tính từ ghép","text_vi":"Danh từ ghép N + N: danh từ đầu bổ nghĩa cho danh từ sau và LUÔN ở dạng số ít: retirement plan, customer service, job application, exchange rate.","list":["Ngoại lệ số nhiều thường gặp: sales figures, terms and conditions, savings account, customs office, human resources.","Tính từ ghép có số đếm + danh từ: danh từ ở dạng SỐ ÍT và có gạch nối: a three-year contract, a two-day workshop, a five-star hotel (không viết three-years).","Danh từ đầu có thể là danh động từ: monitoring system, washing machine, shipping address, parking lot."]},{"kind":"table","title_vi":"Danh từ ghép hay gặp trong TOEIC","head":["Danh từ ghép","Nghĩa"],"rows":[["sales department","phòng kinh doanh"],["customer satisfaction","sự hài lòng của khách hàng"],["job application","đơn xin việc"],["safety regulations","quy định an toàn"],["a five-year contract","hợp đồng 5 năm (tính từ ghép, không -s)"]]}],"worked_examples":[{"en":"Please send your job application to the human resources department.","analysis_vi":"job application, human resources department: danh từ đầu bổ nghĩa cho danh từ sau.","highlight":["job application","human resources department"]},{"en":"They signed a two-year contract.","analysis_vi":"Tính từ ghép số + danh từ: two-year (không thêm -s, có gạch nối).","highlight":["two-year contract"]}],"common_mistakes":[{"wrong":"We need a three-days training.","right":"We need a three-day training.","why_vi":"Tính từ ghép số + danh từ không thêm -s.","error_tag":"NOUN.compound"},{"wrong":"The customers service team is helpful.","right":"The customer service team is helpful.","why_vi":"Danh từ đầu trong danh từ ghép thường để số ít.","error_tag":"NOUN.compound"}],"vn_difficulties_vi":["Tiếng Việt đặt từ bổ nghĩa SAU (phòng kinh doanh), tiếng Anh đặt TRƯỚC (sales department), nên người Việt hay đảo trật tự.","Hay thêm -s vào số đếm trong tính từ ghép (three-days)."],"review_recommendations_vi":["Ghi 10 danh từ ghép TOEIC theo chủ đề văn phòng."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M02-11-0001"],"guided":["Q-M02-11-0002","Q-M02-11-0003","Q-M02-11-0004","Q-M02-11-0005"],"independent":["Q-M02-11-0006","Q-M02-11-0007","Q-M02-11-0008","Q-M02-11-0009","Q-M02-11-0010","Q-M02-11-0011"],"writing":["Q-M02-11-0012"]}},"questions":[{"id":"Q-M02-11-0001","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"The company announced a new ___ plan for employees.","options":["retired","retiring","retire","retirement"],"answer":3,"distractor_tags":["NOUN.compound","NOUN.compound","NOUN.compound",null],"explanation_vi":"Dịch: Công ty công bố kế hoạch hưu trí mới cho nhân viên. — Giải thích: danh từ ghép \"retirement plan\" (danh từ + danh từ). Mẹo thêm: danh từ đầu luôn ở dạng số ít và không thêm -s.","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài tt-2"}},{"id":"Q-M02-11-0002","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Please check the ___ before you sign the contract.","options":["terms and conditions","conditions terms","terms and condition","term and condition"],"answer":0,"distractor_tags":[null,"NOUN.compound","NOUN.compound","NOUN.compound"],"explanation_vi":"Dịch: Vui lòng kiểm tra các điều khoản và điều kiện trước khi ký hợp đồng. — Giải thích: cụm cố định số nhiều \"terms and conditions\". Mẹo thêm: nhớ như một khối, không tách hay đổi số.","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài tt-2"}},{"id":"Q-M02-11-0003","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The ___ for last quarter were disappointing.","options":["sale figure","sales figures","sale figures","sales figure"],"answer":1,"distractor_tags":["NOUN.compound",null,"NOUN.compound","NOUN.compound"],"explanation_vi":"Dịch: Số liệu bán hàng quý trước gây thất vọng. — Giải thích: \"sales figures\" là cụm cố định (sales luôn có -s) và động từ \"were\" cần danh từ số nhiều. Mẹo thêm: khác với quy tắc N1 số ít thông thường — \"sales\" là ngoại lệ.","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài tt-2"}},{"id":"Q-M02-11-0004","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"She applied for the ___ position at the bank.","options":["customer service","customer services","customers service","customers services"],"answer":0,"distractor_tags":[null,"NOUN.compound","NOUN.compound","NOUN.compound"],"explanation_vi":"Dịch: Cô ấy ứng tuyển vị trí chăm sóc khách hàng tại ngân hàng. — Giải thích: danh từ ghép \"customer service\" (dịch vụ khách hàng), làm bổ nghĩa cho \"position\". Mẹo thêm: danh từ đầu \"customer\" số ít.","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài tt-2"}},{"id":"Q-M02-11-0005","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"We signed a ___ contract with the supplier.","options":["three-years","three years","three-year","third-year"],"answer":2,"distractor_tags":["NOUN.compound","NOUN.compound",null,"NOUN.compound"],"explanation_vi":"Dịch: Chúng tôi đã ký hợp đồng ba năm với nhà cung cấp. — Giải thích: tính từ ghép số đếm + danh từ số ít có gạch nối: \"three-year\". Mẹo thêm: \"three-years contract\" là lỗi rất hay gặp.","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài tt-2"}},{"id":"Q-M02-11-0006","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"She attended a ___ workshop on time management.","options":["two days","two-days","second-day","two-day"],"answer":3,"distractor_tags":["NOUN.compound","NOUN.compound","NOUN.compound",null],"explanation_vi":"Dịch: Cô ấy tham dự một buổi hội thảo hai ngày về quản lý thời gian. — Giải thích: tính từ ghép \"two-day\" (số ít, có gạch nối) đứng trước danh từ \"workshop\". Mẹo thêm: khi không ghép: \"The workshop lasts two days\" (số nhiều, không gạch nối).","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài tt-2"}},{"id":"Q-M02-11-0007","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"The ___ has risen sharply this month.","options":["exchanges rate","rate exchange","exchange rate","exchange rates rate"],"answer":2,"distractor_tags":["NOUN.compound","NOUN.compound",null,"NOUN.compound"],"explanation_vi":"Dịch: Tỷ giá hối đoái đã tăng mạnh trong tháng này. — Giải thích: danh từ ghép \"exchange rate\" theo đúng thứ tự \"danh từ bổ nghĩa + danh từ chính\". Mẹo thêm: \"has risen\" (số ít) khớp với \"rate\".","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài tt-2"}},{"id":"Q-M02-11-0008","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn câu đúng.","stem":"Which sentence is correct?","options":["The manager has already approved the plan.","The manager has approved already the plan.","The manager has the plan already approved.","The manager already has approved plan the."],"answer":0,"distractor_tags":[null,"NOUN.compound","NOUN.compound","NOUN.compound"],"explanation_vi":"Dịch: Quản lý đã phê duyệt kế hoạch rồi. — Giải thích: \"already\" đứng giữa trợ động từ \"has\" và V-pp \"approved\". Mẹo thêm: các câu còn lại sai trật tự từ.","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài tt-2"}},{"id":"Q-M02-11-0009","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Employees are ___ encouraged to submit their ideas.","options":["strengthen","strong","strength","strongly"],"answer":3,"distractor_tags":["NOUN.compound","NOUN.compound","NOUN.compound",null],"explanation_vi":"Dịch: Nhân viên được khuyến khích mạnh mẽ nộp ý tưởng của mình. — Giải thích: trạng từ đứng giữa \"are\" và V-pp \"encouraged\" → \"strongly\". Mẹo thêm: \"strongly encouraged/recommended\" là cụm rất phổ biến trong thông báo.","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài tt-2"}},{"id":"Q-M02-11-0010","type":"error_identification","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["All staff must attend the ","two-hours"," ","safety"," training ","before"," using ","the new machines","."],"underline":[1,3,5,7],"answer":0,"correction":["two-hour"],"explanation_vi":"Tính từ ghép số + danh từ không thêm -s: two-hour.","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-11-0011","type":"gap_fill","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Điền 1 danh từ để tạo danh từ ghép.","stem":"Please contact our customer ___ team if you have any questions.","answers":[["service","support","care"]],"explanation_vi":"Danh từ ghép customer service/support/care team.","error_tags":["NOUN.compound"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-11-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Danh từ ghép.","task_vi":"Viết 2 câu có ít nhất 2 danh từ ghép hoặc tính từ ghép (ví dụ: sales report, ten-minute break).","model_answers":["Our sales team has a ten-minute meeting every morning. The marketing department prepared a new price list.","I sent my job application last week. We had a two-hour training session on safety regulations."],"rubric":["Danh từ đầu trong danh từ ghép để số ít","Tính từ ghép số + danh từ có gạch nối, không -s","Trật tự: từ bổ nghĩa đứng trước"],"min_words":12,"explanation_vi":"Câu mẫu: sales team, ten-minute meeting, price list.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M02-12":{"kind":"skill","schema_version":1,"skill_id":"G-M02-12","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Dùng đúng each, every, either, neither, both, all và các lượng từ hay gặp trong TOEIC, kèm số của danh từ và động từ.","est_minutes":12,"source":["az-grammar-2nd:p13","az-original"],"explanation":[{"kind":"text","title_vi":"Lượng từ thường gặp trong TOEIC","text_vi":"every / each + N số ít: Every employee must sign… · each + N số ít / each of the + N số nhiều: The manager gave each employee a copy.","list":["either / neither (của 2 đối tượng): You may choose either of the two plans. · Neither of the two candidates has enough experience (không dùng \"none of the two\").","both + N số nhiều (cả hai) · all (từ 3 trở lên) · most of the + N (hầu hết): Most of the staff attended. — \"Almost\" + every/all/any: Almost every employee received a bonus (không nói \"most employee\").","many / few / a few / several + N đếm được số nhiều; much / little / a little + N không đếm được. \"few / little\" mang nghĩa gần như không có (tiêu cực); \"a few / a little\" mang nghĩa có một ít (tích cực).","some dùng trong câu khẳng định và lời mời/đề nghị; any dùng trong câu phủ định và câu hỏi: We do not have any vacancies at the moment."]},{"kind":"table","title_vi":"Ghép đúng số","head":["Từ","Danh từ đi sau","Ví dụ"],"rows":[["each / every","số ít","every employee"],["either / neither","số ít","either option"],["both","số nhiều","both branches"],["all of the / most of the","số nhiều hoặc không đếm được","all of the staff"]]}],"worked_examples":[{"en":"Each participant will receive a certificate.","analysis_vi":"each + danh từ số ít + động từ số ít.","highlight":["Each participant will receive"]},{"en":"Both candidates have strong experience.","analysis_vi":"both + danh từ số nhiều.","highlight":["Both candidates"]}],"common_mistakes":[{"wrong":"Every employees must attend.","right":"Every employee must attend.","why_vi":"every + danh từ số ít.","error_tag":"DET.quantifier"},{"wrong":"Neither of the options are suitable.","right":"Neither of the options is suitable.","why_vi":"neither of … thường đi với động từ số ít trong văn viết TOEIC.","error_tag":"DET.quantifier"}],"vn_difficulties_vi":["Người Việt hay thêm -s sau every vì \"mọi\" mang nghĩa nhiều.","either/neither (một trong hai/không cái nào trong hai) và both dễ nhầm."],"review_recommendations_vi":["Ôn bảng ghép số trước khi làm Part 5."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M02-12-0001"],"guided":["Q-M02-12-0002","Q-M02-12-0003","Q-M02-12-0004","Q-M02-12-0005"],"independent":["Q-M02-12-0006","Q-M02-12-0007","Q-M02-12-0008","Q-M02-12-0009","Q-M02-12-0010","Q-M02-12-0011"],"writing":["Q-M02-12-0012"]}},"questions":[{"id":"Q-M02-12-0001","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"___ employee must sign the attendance sheet.","options":["Both","Many","Every","All"],"answer":2,"distractor_tags":["DET.quantifier","DET.quantifier",null,"DET.quantifier"],"explanation_vi":"Dịch: Mỗi nhân viên phải ký vào bảng chấm công. — Giải thích: danh từ số ít \"employee\" → \"Every\". Mẹo thêm: All/Both/Many phải đi với danh từ số nhiều.","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-2"}},{"id":"Q-M02-12-0002","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"We received ___ complaints about the new schedule this week.","options":["much","little","a little","few"],"answer":3,"distractor_tags":["DET.quantifier","DET.quantifier","DET.quantifier",null],"explanation_vi":"Dịch: Tuần này chúng tôi nhận được rất ít khiếu nại về lịch mới. — Giải thích: \"complaints\" là danh từ đếm được số nhiều → \"few\". Mẹo thêm: little/much/a little dùng cho danh từ không đếm được.","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-2"}},{"id":"Q-M02-12-0003","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"There is ___ time left before the deadline, so we must hurry.","options":["few","little","several","many"],"answer":1,"distractor_tags":["DET.quantifier",null,"DET.quantifier","DET.quantifier"],"explanation_vi":"Dịch: Còn rất ít thời gian trước hạn chót nên chúng ta phải khẩn trương. — Giải thích: \"time\" không đếm được → \"little\" (gần như không còn). Mẹo thêm: \"few/many/several\" dành cho danh từ đếm được.","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-2"}},{"id":"Q-M02-12-0004","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"___ of the staff attended the training, so it was a great success.","options":["Almost","Much","Most","Mostly"],"answer":2,"distractor_tags":["DET.quantifier","DET.quantifier",null,"DET.quantifier"],"explanation_vi":"Dịch: Hầu hết nhân viên đã tham dự buổi đào tạo nên nó rất thành công. — Giải thích: \"most of the + N\" = phần lớn. Mẹo thêm: \"almost\" là trạng từ (almost all / almost every), không đứng trước \"of the\".","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-2"}},{"id":"Q-M02-12-0005","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Almost ___ employee received a bonus this year.","options":["every","much","many of","most"],"answer":0,"distractor_tags":[null,"DET.quantifier","DET.quantifier","DET.quantifier"],"explanation_vi":"Dịch: Hầu như mọi nhân viên đều nhận được tiền thưởng năm nay. — Giải thích: \"almost every + N số ít\". Mẹo thêm: \"most employee\" sai vì \"most\" đi với danh từ số nhiều (\"most employees\").","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-2"}},{"id":"Q-M02-12-0006","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"___ of the two candidates has enough experience for the position.","options":["Any","None","No","Neither"],"answer":3,"distractor_tags":["DET.quantifier","DET.quantifier","DET.quantifier",null],"explanation_vi":"Dịch: Không ai trong hai ứng viên có đủ kinh nghiệm cho vị trí này. — Giải thích: chỉ có 2 đối tượng → \"Neither of the two\". Mẹo thêm: \"none of\" dùng khi từ 3 đối tượng trở lên.","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-2"}},{"id":"Q-M02-12-0007","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"You may choose ___ of the two plans; both cost the same.","options":["any","each other","either","every"],"answer":2,"distractor_tags":["DET.quantifier","DET.quantifier",null,"DET.quantifier"],"explanation_vi":"Dịch: Bạn có thể chọn một trong hai gói; cả hai đều cùng giá. — Giải thích: \"either of the two\" = một trong hai. Mẹo thêm: either / neither chỉ dùng cho 2 đối tượng.","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-2"}},{"id":"Q-M02-12-0008","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"We do not have ___ vacancies at the moment.","options":["any","some","another","every"],"answer":0,"distractor_tags":[null,"DET.quantifier","DET.quantifier","DET.quantifier"],"explanation_vi":"Dịch: Hiện tại chúng tôi không có vị trí trống nào. — Giải thích: câu phủ định → \"any\". Mẹo thêm: \"some\" chủ yếu dùng ở câu khẳng định hoặc lời mời.","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-2"}},{"id":"Q-M02-12-0009","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The manager gave ___ employee a copy of the schedule.","options":["both","each","each of","all"],"answer":1,"distractor_tags":["DET.quantifier",null,"DET.quantifier","DET.quantifier"],"explanation_vi":"Dịch: Quản lý đưa cho mỗi nhân viên một bản lịch trình. — Giải thích: \"each + N số ít\" (employee). Mẹo thêm: nếu dùng \"each of\" thì phải kèm \"the + N số nhiều\" (each of the employees).","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-2"}},{"id":"Q-M02-12-0010","type":"error_identification","cefr":"A2","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["Every"," ","applicants"," must submit ","a copy"," of ","their ID","."],"underline":[0,2,4,6],"answer":1,"correction":["applicant"],"explanation_vi":"every + danh từ số ít → applicant.","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-12-0011","type":"gap_fill","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Điền 1 từ (both, either, neither, every).","stem":"You can pay by card or by bank transfer. ___ method is fine.","answers":[["Either"]],"explanation_vi":"Một trong hai cách đều được → Either + danh từ số ít.","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-12-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Lượng từ.","task_vi":"Viết 2 câu về lớp/công ty của bạn: 1 câu với each hoặc every, 1 câu với both hoặc neither.","model_answers":["Every student has a locker. Both of our teachers speak English very well.","Each employee gets a parking card. Neither of the printers is working today."],"rubric":["each/every + danh từ số ít","both + danh từ số nhiều","Động từ chia đúng số"],"min_words":12,"explanation_vi":"Câu mẫu: Every student has / Both of our teachers speak.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-12-0013","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"We have ___ information about the new product yet.","options":["few","a few","many","little"],"answer":3,"distractor_tags":["DET.quantifier","DET.quantifier","DET.quantifier",null],"explanation_vi":"Dịch: Chúng tôi vẫn chưa có nhiều thông tin về sản phẩm mới. — Giải thích: \"information\" không đếm được → \"little\". Mẹo thêm: đừng nhầm \"informations\" — danh từ này không có dạng số nhiều.","error_tags":["DET.quantifier"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hd-2"}}]},"G-M03-01":{"kind":"skill","schema_version":1,"skill_id":"G-M03-01","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Phân biệt trợ động từ (be, do, have) với động từ chính; chọn đúng trợ động từ khi hỏi và phủ định.","est_minutes":10,"source":["az-grammar-2nd:p2","az-original"],"explanation":[{"kind":"text","text_vi":"Trợ động từ (auxiliary verb) không mang nghĩa chính, nó \"giúp\" động từ chính tạo câu hỏi, câu phủ định và các thì. Ba trợ động từ chính: be, do, have.","title_vi":"Trợ động từ là gì?"},{"kind":"table","title_vi":"Ba trợ động từ và việc chúng làm","head":["Trợ động từ","Dùng để","Ví dụ"],"rows":[["do / does / did","hỏi và phủ định ở thì đơn","Do you like it? · She didn't come."],["be (am/is/are/was/were)","thì tiếp diễn, câu bị động","I am reading. · It was made in Japan."],["have / has / had","thì hoàn thành","We have finished."]]},{"kind":"note","text_vi":"be, do, have cũng có thể là động từ chính: She is a nurse (be chính) · I do my homework (do chính) · They have a car (have chính). Nhìn xem sau nó còn động từ nào khác không."}],"worked_examples":[{"en":"She doesn't eat meat.","analysis_vi":"doesn't l d":"Q-M03-01-0006","type":"mcq","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review","checkpoint"],"instruction_vi":"have trong câu này là gì?","stem":"In 'I have a dog', 'have' is ___.","options":["an auxiliary verb","the main verb","a noun","an adjective"],"answer":1,"distractor_tags":["AUX.choice",null,"POS.word_class","POS.word_class"],"explanation_vi":"Câu chỉ có một động từ là have (sở hữu), không có động từ nào khác đi kèm → have là động từ chính.","error_tags":["AUX.choice"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-01-0007","type":"error_identification","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review","checkpoint"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["Did"," your parents ","went"," to the ","party"," ","last night","?"],"underline":[0,2,4,6],"answer":1,"correction":["go"],"explanation_vi":"Sau trợ động từ Did dùng động từ nguyên mẫu go.","error_tags":["TENSE.did_v2"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-01-0008","type":"error_correction","cefr":"A1","difficulty":3,"context":"general","uses":["lesson","review"],"instruction_vi":"Câu sau có 1 lỗi sai. Viết lại câu đúng.","stem":"She doesn't wants to go out tonight.","answers":["She doesn't want to go out tonight.","She does not want to go out tonight."],"explanation_vi":"Sau doesn't dùng nguyên mẫu want.","error_tags":["QST.verb_after_aux"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-01-0009","type":"ordering","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review"],"instruction_vi":"Sắp xếp thành câu đúng.","tokens":["have","We","our homework","already","done"],"answers":["We have already done our homework."],"explanation_vi":"T ên mẫu.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M03-02":{"kind":"skill","schema_version":1,"skill_id":"G-M03-02","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Viết đúng V2, V3 của động từ có quy tắc (thêm -ed) và 60 động từ bất quy tắc thông dụng.","est_minutes":12,"source":["az-original"],"explanation":[{"kind":"table","title_vi":"Động từ có quy tắc: thêm -ed","head":["Quy tắc","Ví dụ"],"rows":[["thường: thêm -ed","work → worked, play → played"],["tận cùng -e: thêm -d","live → lived, dance → danced"],["phụ âm + y → -ied","study → studied, carry → carried"],["1 nguyên âm + 1 phụ âm (nhấn cuối) → gấp đôi","stop → stopped, plan → planned"]]},{"kind":"table","title_vi":"Bất quy tắc hay gặp (V1 – V2 – V3)","head":["Nhóm","Ví dụ"],"rows":[["3 dạng giống nhau","cut – cut – cut · put – put – put · let – let – let"],["V2 = V3","buy – bought – bought · teach – taught – taught · make – made – made · find – found – found"],["3 dạng khác nhau","go – went – gone · write – wrote – written · see – saw – seen · take – took – taken"],["V3 có -en/-n","eat – ate – eaten · give – gave – given · speak – spoke – spoken"]]},{"kind":"note","text_vi":"V2 dùng cho quá khứ đơn (I went). V3 dùng sau have/has/had (I have gone) và trong câu bị động (It was written)."}],"worked_examples":[{"en":"We planned our trip and bought the tickets online.","analysis_vi":"plan → planned (gấp đôi n); buy → bought (bất quy tắc).","highlight":["planned","bought"]},{"en":"She has written three emails this morning.","analysis_vi":"Sau has dùng V3: written (write – wrote – written).","highlight":["written"]}],"common_mistakes":[{"wrong":"I buyed a new phone.","right":"I bought a new phone.","why_vi":"buy là động từ bất quy tắc: bought.","error_tag":"VERB.irregular_form"},{"wrong":"He studyed hard for the test.","right":"He ả cảm xúc, suy nghĩ, sở hữu, giác quan: chúng thường KHÔNG dùng ở thì tiếp diễn.","title_vi":"Hai loại động từ"},{"kind":"table","title_vi":"Nhóm động từ trạng thái hay gặp","head":["Nhóm","Ví dụ"],"rows":[["Suy nghĩ","know, understand, believe, remember, forget, mean"],["Cảm xúc, mong muốn","like, love, hate, want, need, prefer"],["Sở hữu","have (= có), own, belong to"],["Giác quan, tính chất","seem, smell, taste, sound, look (= trông có vẻ)"]]},{"kind":"note","text_vi":"Một số động từ vừa là trạng thái vừa là hành động, nghĩa khác nhau: I have a car (sở hữu) · I'm having lunch (đang ăn). I think it's good (cho rằng) · I'm thinking about it (đang suy nghĩ)."}],"worked_examples":[{"en":"I understand the lesson now.","analysis_vi":"understand là động từ suy nghĩ → không dùng am understanding, dù có now.","highlight":["understand"]},{"en":"She is having dinner, so she can't answer the phone.","analysis_vi":"have = ăn (hành động) → được dùng tiếp diễn.","highlight":["is having"]}],"common_mistakes":[{"wrong":"I am knowing the answer.","right":"I know the answer.","why_vi":"know là động từ trạng thái → hiện tại đơn.","error_tag":"VERB.stative_continuous"},{"wrong":"She is wanting a new phone.","right":"She wants a new phone.","why_vi":"want là động từ trạng thái → không dùng tiếp diễn.","error_tag":"VERB.stative_continuous"}],"vn_difficulties_vi":["Người Việt hay nói \"tôi đang muốn…\", \"tôi đang biết…\" nên dịch thẳng thành am wanting, am knowing.","Câu có now/at the moment khiến người học tự động dùng tiếp diễn, quên kiểm tra loại động từ."],"review_recommendations_vi":["Ghi 10 động từ trạng thái lên giấy dán ở bàn học trong 3 ngày."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M03-03-0001"],"guided":["Q-M03-03-0002","Q-M03-03-0003","Q-M03-03-0004","Q-M03-03-0005"],"independent":["Q-M03-03-0006","Q-M03-03-0007","Q-M03-03-0008","Q-M03-03-0009","Q-M03-03-0010","Q-M03-03-0011"],"writing":["Q-M03-03-0012"]}},"questions":[{"id":"Q-M03-03-0001","type":"mcq","cefr":"A2", ister.","answers":[["belongs"]],"explanation_vi":"belong to (sở hữu) là động từ trạng thái → hiện tại đơn; That bag số ít → belongs.","error_tags":["VERB.stative_continuous"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-03-0005","type":"gap_fill","cefr":"B1","difficulty":3,"context":"general","uses":["lesson"],"instruction_vi":"Chia động từ trong ngoặc.","stem":"We ___ (have) lunch at the moment. Can I call you back?","answers":[["are having"]],"explanation_vi":"have = ăn (hành động) → được dùng tiếp diễn: are having.","error_tags":["VERB.stative_continuous"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-03-0006","type":"mcq","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"Right now I ___ a cup of tea.","options":["want","am wanting","wants","wanting"],"answer":0,"distractor_tags":[null,"VERB.stative_continuous","SVA.third_person_s","TENSE.continuous_missing_be"],"explanation_vi":"want là động từ trạng thái → want, dù có Right now.","error_tags":["VERB.stative_continuous"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-03-0007","type":"error_identification","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review","checkpoint"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["At the moment"," Nga ","is needing"," ","some help"," with ","her project","."],"underline":[0,2,4,6],"answer":1,"correction":["needs"],"explanation_vi":"need là động từ trạng thái → needs, dù có At the moment.","error_tags":["VERB.stative_continuous"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-03-0008","type":"error_correction","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review"],"instruction_vi":"Câu sau có 1 lỗi sai. Viết lại câu đúng.","stem":"Are you remembering his phone number?","answers":["Do you remember his phone number?"],"explanation_vi":"remember (nhớ) là động từ trạng thái → câu hỏi hiện tại đơn: Do you remember…?","error_tags":["VERB.stative_continuous"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-03-0009","type":"mcq","cefr":"B1","difficulty":4,"context":"general","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"I ___ about changing my school.","options":["think","am thinking","thinks","am think"],"answer":1,"distractor_tags":["VERB.stative_continuous",null,"SVA.third_person_s","VERB.ing_spelling"],"explanation_vi":"think about = đang cân nhắc (hành động) → được dùng tiếp diễn.","error_tags":["VERB.stative_continuous"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-03-0010","type":"mcq","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"I ___ this new song. It ___ great.","options":["like / sounds","am liking / is sounding","like / is sounding","am liking / sounds"],"answer":0,"distractor_tags":[null,"VERB.stative_continuous","VERB.stative_continuous","VERB.stative_continuous"],"explanation_vi":"like và sound (nghe có vẻ) đều là động từ trạng thái → hiện tại đơn.","error_tags":["VERB.stative_continuous"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-03-0011","type":"transformation","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review"],"instruction_vi":"Viết lại thành câu phủ định.","original":"My brother has a motorbike.","cue":"My brother","a
