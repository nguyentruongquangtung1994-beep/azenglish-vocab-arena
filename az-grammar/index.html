<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:type" content="website">
<meta property="og:title" content="AZ Grammar · Ngữ pháp tiếng Anh THCS–THPT miễn phí">
<meta property="og:description" content="Mỗi ngày một trạm ngữ pháp 10–15 phút: THCS → THPT → ôn thi tốt nghiệp. Kiểm tra đầu vào 12 phút, biết ngay nên bắt đầu từ đâu. Miễn phí từ AZEnglish.">
<meta name="theme-color" content="#0B1424">
<title>AZ Grammar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tự học ngữ pháp tiếng Anh miễn phí mỗi ngày 10–15 phút: THPT Global Success, TOEIC, IELTS. Một sản phẩm của AZEnglish.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap">
<style>
/* Bố cục: thanh trên cố định + vùng nội dung tối đa 1120px; khối tối (hero, thẻ nhiệm vụ) dùng xanh đêm Academy.
   Giao diện Premium của AZIELTS Academy, LUÔN SÁNG (quyết định chung các web AZ) → một bảng màu, không có khối dark. */
:root{
  --navy:#0F1B2D; --navy-2:#1B2B44; --night:#0B1424;
  --gold:#B8913A; --gold-2:#E3C27A; --gold-soft:#FAF4E6;
  --red:#D7192D; --red-d:#B01322; --red-soft:#FDEDEF;
  --ink:#111827; --ink-2:#4B5563; --ink-3:#8A93A3;
  --bg:#FFFFFF; --bg-2:#F7F5F0; --bg-3:#EEF0F4; --line:#E8E4DA; --line-2:#D8D2C4;
  --ok:#15803D; --ok-soft:#E8F5EC; --warn:#9A6A12; --warn-soft:#FBF3E2;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r-btn:10px; --r-in:12px; --r-card:16px; --r-xl:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--sans);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#fff}

/* thanh trên */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo .mk{width:38px;height:38px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.logo b{display:block;font-size:16px;line-height:1.1}
.logo small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.nav button[aria-current="page"]{background:var(--navy);color:#fff}
.nav button:hover:not([aria-current="page"]){background:var(--bg-3)}
.preview{background:var(--warn-soft);border-bottom:1px solid #EBD9B0;color:#6B4A0D;font-size:13px}
.preview .wrap{padding-block:7px;display:flex;gap:8px;align-items:center}
.preview b{white-space:nowrap}
.preview .short{display:none}
.tabbar{display:none}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border:1px solid var(--red);border-radius:var(--r-btn);background:var(--red);color:#fff;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s}
.btn:hover{background:var(--red-d)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--bg-2)}
.btn.navy{background:var(--navy);border-color:var(--navy)}
.btn.navy:hover{background:var(--navy-2)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px}

/* chip, nhãn */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--bg-3);color:var(--ink-2);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:#7A5A16}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.red{background:var(--red-soft);color:var(--red-d)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.navy{background:var(--navy);color:#fff}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:600;color:#D7DEEA}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* hero */
.hero{background:radial-gradient(900px 520px at 85% 10%,rgba(215,25,45,.28),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(58,96,170,.26),transparent 60%),linear-gradient(160deg,#0B1424 0%,#13233B 55%,#0E1A2E 100%);color:#fff}
.hero .wrap{padding-block:44px 48px;display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(32px,4.6vw,52px);margin:18px 0 14px}
.hero h1 em{font-style:italic;color:var(--gold-2)}
.hero p.lead{color:#C9D3E2;font-size:16.5px;max-width:52ch}
.hero .stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.hero .stats b{display:block;font-family:var(--serif);font-size:28px;color:#fff;font-variant-numeric:tabular-nums}
.hero .stats span{font-size:13px;color:#AEB9CB}
.today{background:#fff;color:var(--ink);border-radius:var(--r-xl);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.28);display:grid;gap:14px}
.today .day{font-family:var(--serif);font-size:30px;line-height:1}
.today .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--bg-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.steps-mini{display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.steps-mini div{display:flex;gap:10px;align-items:baseline}
.steps-mini b{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600;width:52px;flex:none}

/* khối trang */
main{padding-block:28px 64px}
.sec{display:grid;gap:16px;margin-top:34px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:26px}
.sec-h p{color:var(--ink-2);font-size:14.5px;max-width:62ch}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.track{display:grid;gap:10px;cursor:pointer;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r-card);padding:18px;transition:border-color .15s,box-shadow .15s}
.track:hover{border-color:var(--line-2);box-shadow:0 6px 20px rgba(15,27,45,.06)}
.track[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.track h3{font-size:19px}
.track p{font-size:14px;color:var(--ink-2)}
.muted{color:var(--ink-3);font-size:13.5px}

/* lộ trình 30 ngày */
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.dayt{border:1px solid var(--line);background:#fff;border-radius:var(--r-in);padding:10px 12px;text-align:left;display:grid;gap:4px;min-height:92px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.dayt b{font-size:13px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap}
.dayt b .chip{padding:1px 8px;font-size:11.5px}
.dayt .t{font-weight:600;color:var(--ink);line-height:1.35;font-size:13.5px}
.dayt.review{background:var(--gold-soft);border-color:#EAD9AE}
.dayt.check{background:var(--navy);border-color:var(--navy);color:#C9D3E2}
.dayt.check b,.dayt.check .t{color:#fff}
.dayt.done{border-color:#B7DDC3;background:var(--ok-soft)}
.dayt.open{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.dayt.soon,.dayt.locked{cursor:default;opacity:.62}
.units{display:grid;gap:8px}
.unit{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-in);background:#fff}
.unit .u{font-weight:700;font-size:13.5px}
.unit .ttl{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button.chip{border:0;cursor:pointer;white-space:normal;text-align:left;max-width:100%}
.chips button.chip:hover{background:var(--line)}

/* thư viện */
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1 1 260px;min-height:46px;border:1px solid var(--line-2);border-radius:var(--r-btn);padding:0 14px;background:#fff}
.mod{display:grid;gap:10px}
.mod-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.mod-h h3{font-size:20px}
.mod-h .id{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.sk{display:grid;gap:6px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-in);background:#fff;cursor:pointer}
.sk:hover{border-color:var(--line-2);background:var(--bg-2)}
.sk .n{font-weight:600;line-height:1.35}
.sk .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3)}
.sk.has{border-color:#EAD9AE}

/* ngăn chi tiết (sheet) */
.sheet-bg{position:fixed;inset:0;background:rgba(11,20,36,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:#fff;width:min(480px,100%);height:100%;overflow:auto;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px;display:grid;gap:16px;align-content:start;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.sheet h2{font-size:24px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}

/* nhiệm vụ */
.mission{max-width:760px;margin:0 auto;display:grid;gap:18px}
.mhead{display:grid;gap:10px}
.mhead .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mhead h1{font-size:clamp(24px,3.4vw,32px)}
.pips{display:flex;gap:4px}
.pips i{flex:1;height:6px;border-radius:99px;background:var(--bg-3)}
.pips i.on{background:var(--gold)}
.pips i.cur{background:var(--navy)}
.stage{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);padding:24px;display:grid;gap:16px}
.qi{font-size:14px;color:var(--ink-2)}
.qs{font-size:19px;font-weight:600;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line-2);border-radius:var(--r-in);background:#fff;cursor:pointer;font-size:16px}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--bg-3);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.gap{display:inline-block;min-width:120px;width:auto;border:0;border-bottom:2px solid var(--navy);padding:2px 6px;margin:0 4px;background:var(--bg-2);border-radius:6px 6px 0 0;font-weight:600;font-size:17px}
.gap.right{border-color:var(--ok);background:var(--ok-soft)}
.gap.wrong{border-color:var(--red);background:var(--red-soft)}
.hint{color:var(--ink-3);font-size:14px;font-weight:500}
.eid{font-size:19px;line-height:2.2}
.eid button{border:0;background:none;padding:0 2px;cursor:pointer;font:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;border-radius:6px}
.eid button sup{font-size:11px;font-weight:800;color:var(--gold);margin-left:2px}
.eid button[aria-pressed="true"]{background:var(--gold-soft)}
.eid button.right{background:var(--ok-soft)}
.eid button.wrong{background:var(--red-soft)}
textarea.ans,input.ans{width:100%;border:1px solid var(--line-2);border-radius:var(--r-in);padding:12px 14px;font-size:17px;background:#fff}
textarea.ans{min-height:96px;resize:vertical}
.toks{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer;font-weight:500}
.tok:disabled{opacity:.3;cursor:default}
.line{min-height:54px;border:1px dashed var(--line-2);border-radius:var(--r-in);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg-2)}
.line .tok{background:var(--navy);color:#fff;border-color:var(--navy)}
.line:empty::before{content:"Chạm vào các mảnh bên dưới theo thứ tự";color:var(--ink-3);font-size:14px;padding-left:6px}
.fb{border-radius:var(--r-in);padding:14px 16px;display:grid;gap:6px;font-size:15px}
.fb.ok{background:var(--ok-soft);border:1px solid #B7DDC3}
.fb.no{background:var(--red-soft);border:1px solid #F3C2C8}
.fb.mid{background:var(--warn-soft);border:1px solid #EBD9B0}
.fb b{font-size:15.5px}
.fb .ex{color:var(--ink-2)}
.acts{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.theory{display:grid;gap:18px}
.blk{display:grid;gap:8px}
.blk h3{font-size:18px}
.formula{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14.5px;background:var(--night);color:#F4E6C2;padding:14px 16px;border-radius:var(--r-in);overflow-x:auto;white-space:pre-wrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-in)}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl th{background:var(--bg-2);text-align:left;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tips{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}.tips li::marker{color:var(--gold)}
.note{background:var(--gold-soft);border-left:3px solid var(--gold);padding:12px 14px;border-radius:0 var(--r-in) var(--r-in) 0;font-size:14.5px}
.ex-list{display:grid;gap:8px}
.exm{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-in);display:grid;gap:4px}
.exm .en{font-size:16.5px;font-weight:600}
.exm .vi{color:var(--ink-2);font-size:14px}
mark{background:#FBEAC2;color:inherit;padding:0 2px;border-radius:3px}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist div{padding:10px 12px;border-radius:var(--r-in);font-weight:600}
.mist .w{background:var(--red-soft);text-decoration:line-through;text-decoration-color:rgba(176,19,34,.5)}
.mist .r{background:var(--ok-soft)}
.mist p{grid-column:1/-1;color:var(--ink-2);font-size:14px;font-weight:400}
.rub{display:grid;gap:8px}
.rub label{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.rub input{width:18px;height:18px;margin-top:3px;accent-color:var(--navy)}

/* kết quả, tiến độ */
.big{font-family:var(--serif);font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.meter{display:grid;gap:6px}
.list{display:grid}
.list .it{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.list .it:last-child{border-bottom:0}
.list .it .t{font-weight:600}
.list .it .s{font-size:13px;color:var(--ink-3)}
.lv-new{background:var(--bg-3);color:var(--ink-3)}
.lv-learning{background:var(--warn-soft);color:var(--warn)}
.lv-fair{background:#E6EEF9;color:#24518F}
.lv-mastered{background:var(--ok-soft);color:var(--ok)}
.empty{padding:22px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:var(--r-card)}

/* đăng ký */
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:14px;font-weight:600}
.form input,.form select{min-height:46px;border:1px solid var(--line-2);border-radius:var(--r-btn);padding:0 12px;background:#fff;font-weight:400}
.form .chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px}
.form .chk input{min-height:0;width:18px;height:18px;margin-top:3px;accent-color:var(--navy)}
.err{color:var(--red-d);font-size:13.5px;font-weight:600}
.code{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:.18em;background:var(--night);color:var(--gold-2);padding:14px 18px;border-radius:var(--r-in);text-align:center;user-select:all}

/* giáo viên */
.tblw{overflow-x:auto}
.qcard{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r-in);font-size:14px}
.qcard .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qcard .h b{font-variant-numeric:tabular-nums}
.qcard .key{background:var(--ok-soft);padding:6px 10px;border-radius:8px}
.foot{border-top:1px solid var(--line);color:var(--ink-3);font-size:13px}
.foot .wrap{padding-block:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr;padding-block:30px 34px}
  .g3{grid-template-columns:1fr}
  .nav{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink-3);padding:4px;cursor:pointer}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--navy)}
  main{padding-bottom:110px}
}
@media (max-width:560px){
  .g2{grid-template-columns:1fr}

g là dạng câu nhiều nhất trong TOEIC Part 5."},{"kind":"table","title_vi":"6 loại từ chính","head":["Loại từ","Làm gì trong câu","Ví dụ"],"rows":[["Danh từ (noun)","Gọi tên người, vật, ý tưởng","teacher, school, idea"],["Động từ (verb)","Chỉ hành động hoặc trạng thái","study, go, be, seem"],["Tính từ (adjective)","Mô tả danh từ","new, careful, happy"],["Trạng từ (adverb)","Mô tả động từ, tính từ hoặc cả câu","carefully, very, often"],["Giới từ (preposition)","Đứng trước danh từ, chỉ nơi chốn, thời gian, quan hệ","in, on, at, with"],["Liên từ (conjunction)","Nối từ, cụm từ hoặc mệnh đề","and, but, because"]]},{"kind":"signal_words","title_vi":"Đuôi từ hay gặp (gợi ý, không phải luật tuyệt đối)","words":["-tion, -ment, -ness, -er → danh từ","-ful, -ous, -ive, -able → tính từ","-ly → thường là trạng từ","-ize, -ify, -en → động từ"]},{"kind":"note","text_vi":"Một từ có thể thuộc nhiều loại tuỳ vị trí: \"I study in the study.\" — study đầu là động từ, study sau là danh từ (phòng làm việc). Hãy nhìn vị trí, đừng chỉ nhìn mặt chữ."}],"worked_examples":[{"en":"My new teacher speaks very clearly.","analysis_vi":"My (từ hạn định) · new (tính từ, mô tả teacher) · teacher (danh từ) · speaks (động từ) · very (trạng từ, bổ nghĩa cho clearly) · clearly (trạng từ, bổ nghĩa cho speaks).","highlight":["new","teacher","speaks","clearly"]},{"en":"We stayed at home because it was raining.","analysis_vi":"at (giới từ, đứng trước danh từ home) · because (liên từ, nối hai mệnh đề) · stayed, was raining (động từ).","highlight":["at","because"]}],"common_mistakes":[{"wrong":"She sings beautiful.","right":"She sings beautifully.","why_vi":"Bổ nghĩa cho động từ sings phải dùng trạng từ beautifully, không dùng tính từ beautiful.","error_tag":"POS.adj_adv"},{"wrong":"He made a good decide.","right":"He made a good decision.","why_vi":"Sau tính từ good cần một danh từ: decision. decide là động từ.","error_tag":"POS.noun_verb"}],"vn_difficulties_vi":["Tiếng Việt không đổi hình thức từ theo loại từ (\"đẹp\" vừa là tính từ vừa dùng như trạng từ), nên người Việt hay quên thêm -ly hoặc đổi đuôi danh từ.","Hay đoán loại từ theo nghĩa tiếng Việt thay vì theo vị trí trong câu."],"review_recommendations_vi":["Ôn lại sau 1 ngày: tự gạch loại từ trong 2 câu bất kỳ của sách giáo khoa."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M01-01-0001"],"guided":["Q-M01-01-0002","Q-M01-01-0003","Q-M01-01-0004","Q-M01-01-0005"],"independent":["Q-M01-01-0006","Q-M01-01-0007","Q-M01-01-0008","Q-M01-01-0009","Q-M01-01-0010","Q-M01-01-0011"],"writing":["Q-M01-01-0012"]}},"questions":[{"id":"Q-M01-01-0001","type":"mcq","cefr":"A1","difficulty":1,"context":"general","uses":["lesson","placement"],"instruction_vi":"Từ trong dấu nháy đơn là loại từ gì?","stem":"She is a doctor. → 'doctor' is a(n) ___.","options":["noun","verb","adjective","adverb"],"answer":0,"distractor_tags":[null,"POS.noun_verb","POS.word_class","POS.word_class"],"explanation_vi":"doctor gọi tên một nghề, đứng sau mạo từ a → danh từ.","error_tags":["POS.word_class"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0002","type":"mcq","cefr":"A1","difficulty":1,"context":"general","instruction_vi":"Từ trong dấu nháy đơn là loại từ gì?","stem":"They play football on Sundays. → 'play' is a(n) ___.","options":["noun","verb","adjective","preposition"],"answer":1,"distractor_tags":["POS.noun_verb",null,"POS.word_class","POS.word_class"],"explanation_vi":"play đứng ngay sau chủ ngữ They và chỉ hành động → động từ.","error_tags":["POS.noun_verb"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0003","type":"mcq","cefr":"A1","difficulty":1,"context":"general","instruction_vi":"Từ trong dấu nháy đơn là loại từ gì?","stem":"It is a big house. → 'big' is a(n) ___.","options":["adjective","adverb","noun","verb"],"answer":0,"distractor_tags":[null,"POS.adj_adv","POS.word_class","POS.word_class"],"explanation_vi":"big đứng trước danh từ house và mô tả nó → tính từ.","error_tags":["POS.adj_adv"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0004","type":"mcq","cefr":"A1","difficulty":2,"context":"general","instruction_vi":"Từ trong dấu nháy đơn là loại từ gì?","stem":"He drives slowly. → 'slowly' is a(n) ___.","options":["adjective","adverb","noun","conjunction"],"answer":1,"distractor_tags":["POS.adj_adv",null,"POS.word_class","POS.word_class"],"explanation_vi":"slowly bổ nghĩa cho động từ drives (lái thế nào?) → trạng từ.","error_tags":["POS.adj_adv"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0005","type":"mcq","cefr":"A1","difficulty":2,"context":"general","instruction_vi":"Từ trong dấu nháy đơn là loại từ gì?","stem":"I was tired, but I finished my homework. → 'but' is a(n) ___.","options":["preposition","conjunction","adverb","verb"],"answer":1,"distractor_tags":["POS.word_class",null,"POS.word_class","POS.word_class"],"explanation_vi":"but nối hai mệnh đề trái ý nhau → liên từ.","error_tags":["POS.word_class"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0006","type":"mcq","cefr":"A2","difficulty":2,"context":"general","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Our teacher always speaks ___.","options":["careful","carefully","care","carefulness"],"answer":1,"distractor_tags":["POS.adj_adv",null,"POS.noun_verb","POS.word_class"],"explanation_vi":"Chỗ trống đứng sau động từ speaks và bổ nghĩa cho nó → cần trạng từ carefully.","error_tags":["POS.adj_adv"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0007","type":"gap_fill","cefr":"A2","difficulty":2,"context":"general","uses":["lesson","review"],"instruction_vi":"Điền dạng đúng của từ trong ngoặc.","stem":"We need to make a quick ___ about the trip.","hints":["decide"],"answers":[["decision"]],"explanation_vi":"Sau mạo từ a và tính từ quick cần một danh từ: decision (quyết định).","error_tags":["POS.noun_verb"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0008","type":"gap_fill","cefr":"A2","difficulty":2,"context":"general","uses":["lesson","review"],"instruction_vi":"Điền dạng đúng của từ trong ngoặc.","stem":"This app is very ___ for students.","hints":["use"],"answers":[["useful","usable"]],"explanation_vi":"Sau động từ nối is (và trạng từ very) cần một tính từ: useful (hữu ích). usable (dùng được) cũng đúng ngữ pháp.","error_tags":["POS.adj_adv"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0009","type":"error_identification","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review","checkpoint"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["My brother"," ","finished"," his ","homework"," ","quick"," last night."],"underline":[0,2,4,6],"answer":3,"correction":["quickly"],"explanation_vi":"quick bổ nghĩa cho động từ finished nên phải là trạng từ quickly.","error_tags":["POS.adj_adv"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0010","type":"error_correction","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review"],"instruction_vi":"Câu sau có 1 lỗi sai. Viết lại câu đúng.","stem":"She looks happily today.","answers":["She looks happy today."],"explanation_vi":"looks ở đây là động từ nối (trông có vẻ), sau nó dùng tính từ happy, không dùng trạng từ happily.","error_tags":["VERB.linking_adverb"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0011","type":"ordering","cefr":"A1","difficulty":2,"context":"general","uses":["lesson","review"],"instruction_vi":"Sắp xếp các từ thành câu đúng.","tokens":["beautifully","sings","My sister"],"answers":["My sister sings beautifully."],"explanation_vi":"Trật tự cơ bản: chủ ngữ (My sister) + động từ (sings) + trạng từ (beautifully).","error_tags":["SENT.word_order"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-01-0012","type":"sentence_writing","cefr":"A2","difficulty":2,"context":"general","uses":["lesson"],"instruction_vi":"Viết 1 câu về một người bạn quý.","task_vi":"Viết 1 câu (ít nhất 6 từ) về một người bạn, có ít nhất 1 tính từ và 1 trạng từ đuôi -ly.","model_answers":["My best friend is kind and always helps me patiently.","Lan is a smart student who speaks English fluently."],"rubric":["Có ít nhất 1 tính từ mô tả danh từ","Có ít nhất 1 trạng từ bổ nghĩa cho động từ","Câu có đủ chủ ngữ và động từ"],"min_words":6,"explanation_vi":"Câu mẫu dùng đủ danh từ (friend), động từ (helps), tính từ (kind) và trạng từ (patiently). Bạn tự kiểm theo 3 tiêu chí bên dưới.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M01-02":{"kind":"skill","schema_version":1,"skill_id":"G-M01-02","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Chỉ ra chủ ngữ, động từ, tân ngữ, bổ ngữ và trạng ngữ trong một câu ngắn; nhận ra câu thiếu động từ.","est_minutes":12,"source":["az-original"],"explanation":[{"kind":"formula","title_vi":"Khung câu tiếng Anh","formula":"S (chủ ngữ) + V (động từ) + O / C (tân ngữ / bổ ngữ) + A (trạng ngữ)"},{"kind":"table","title_vi":"5 thành phần","head":["Thành phần","Trả lời câu hỏi","Ví dụ"],"rows":[["S – chủ ngữ","Ai? Cái gì? (làm việc đó)","My mother · The new library"],["V – động từ","Làm gì? Thế nào?","cooks · opened · is"],["O – tân ngữ","(làm) ai? cái gì?","dinner · the door"],["C – bổ ngữ","là gì? như thế nào? (sau be, seem, become…)","a nurse · tired"],["A – trạng ngữ","Ở đâu? Khi nào? Thế nào?","at home · every day · quickly"]]},{"kind":"note","text_vi":"Câu tiếng Anh LUÔN cần động từ. Tiếng Việt nói \"Cô ấy rất vui\" không có động từ, nhưng tiếng Anh phải có is: She is very happy."}],"worked_examples":[{"en":"My mother cooks dinner at home every day.","analysis_vi":"My mother (S) · cooks (V) · dinner (O) · at home (A nơi chốn) · every day (A thời gian).","highlight":["My mother","cooks","dinner"]},{"en":"The students became tired after the test.","analysis_vi":"The students (S) · became (V nối) · tired (C, mô tả chủ ngữ) · after the test (A).","highlight":["The students","became","tired"]}],"common_mistakes":[{"wrong":"She very happy.","right":"She is very happy.","why_vi":"Câu thiếu động từ. Trước tính từ cần động từ be.","error_tag":"SENT.missing_verb"},{"wrong":"Is raining.","right":"It is raining.","why_vi":"Câu tiếng Anh cần chủ ngữ, kể cả khi nói về thời tiết (dùng It).","error_tag":"SENT.missing_subject"},{"wrong":"I every day go to school.","right":"I go to school every day.","why_vi":"Trạng ngữ thời gian every day thường đứng cuối câu, không chen giữa chủ ngữ và động từ.","error_tag":"SENT.word_order"}],"vn_difficulties_vi":["Tiếng Việt cho phép bỏ chủ ngữ hoặc không cần động từ trước tính từ, nên người Việt hay viết câu thiếu S hoặc thiếu V.","Hay đặt trạng ngữ thời gian giữa câu theo thói quen tiếng Việt."],"review_recommendations_vi":["Mỗi câu bạn viết, tự hỏi: chủ ngữ là gì, động từ là gì?"],"vocabulary_links":[],"flow":{"diagnostic":["Q-M01-02-0001"],"guided":["Q-M01-02-0002","Q-M01-02-0003","Q-M01-02-0004","Q-M01-02-0005"],"independent":["Q ion":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-06-0010","type":"ordering","cefr":"A1","difficulty":2,"context":"general","uses":["lesson","review"],"instruction_vi":"Sắp xếp thành câu đúng.","tokens":["on Sundays","open","isn't","The shop"],"answers":["The shop isn't open on Sundays."],"explanation_vi":"S (The shop) + isn't + bổ ngữ (open) + trạng ngữ (on Sundays).","error_tags":["SENT.word_order"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-06-0011","type":"mcq","cefr":"A1","difficulty":2,"context":"general","uses":["lesson","review"],"instruction_vi":"Chọn câu trả lời ngắn đúng.","stem":"A: Do your parents work on Saturdays? B: ___","options":["No, they don't.","No, they doesn't.","No, they aren't.","No, they not work."],"answer":0,"distractor_tags":[null,"AUX.choice","AUX.choice","NEG.no_aux"],"explanation_vi":"Câu hỏi với Do → trả lời No, they don't.","error_tags":["NEG.short_answer"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-06-0012","type":"sentence_writing","cefr":"A1","difficulty":2,"context":"general","uses":["lesson"],"instruction_vi":"Viết về sở thích.","task_vi":"Viết 2 câu phủ định về bạn: 1 câu với be (isn't/aren't/'m not), 1 câu với don't hoặc doesn't.","model_answers":["I'm not good at drawing, and I don't like horror films.","My room isn't very big. I don't play video games on school days."],"rubric":["Câu phủ định với be dùng be + not","Câu phủ định với động từ thường có don't/doesn't + nguyên mẫu","Không viết I not + động từ"],"min_words":8,"explanation_vi":"Câu mẫu có 1 câu phủ định với be và 1 câu phủ định với don't/doesn't.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M01-08":{"kind":"skill","schema_version":1,"skill_id":"G-M01-08","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Phân biệt câu đơn, câu ghép, câu phức và nối hai câu đơn đúng cách, tránh lỗi nối hai mệnh đề chỉ bằng dấu phẩy.","est_minutes":15,"source":["az-original"],"explanation":[{"kind":"table","title_vi":"Ba loại câu","head":["Loại","Cấu tạo","Ví dụ"],"rows":[["Câu đơn","1 mệnh đề (1 cụm S + V)","I like music."],["Câu ghép","2 mệnh đề độc lập + and, but, or, so","I like music, but my brother likes sport."],["Câu phức","1 mệnh đề chính + 1 mệnh đề phụ (because, when, if, although…)","I listen to music when I study."]]},{"kind":"note","text_vi":"Không nối hai câu hoàn chỉnh chỉ bằng dấu phẩy: \"It was late, we went home\" là sai. Cách sửa: thêm liên từ (It was late, so we went home), dùng dấu chấm, hoặc biến thành câu phức (Because it was late, we went home)."},{"kind":"text","text_vi":"Mệnh đề phụ đứng đầu câu thì có dấu phẩy sau nó: When I got home, I had dinner. Đứng sau thì thường không cần dấu phẩy: I had dinner when I got home.","title_vi":"Dấu phẩy trong câu phức"}],"worked_examples":[{"en":"She studied hard, so she passed the exam.","analysis_vi":"Hai mệnh đề độc lập nối bằng so → câu ghép.","highlight":["so"]},{"en":"Although it was raining, we played football.","analysis_vi":"Although it was raining là mệnh đề phụ → câu phức; đứng đầu nên có dấu phẩy.","highlight":["Although"]}],"common_mistakes":[{"wrong":"It was very late, we went home.","right":"It was very late, so we went home.","why_vi":"Hai mệnh đề độc lập cần liên từ (hoặc dấu chấm), không chỉ dấu phẩy.","error_tag":"SENT.comma_splice"},{"wrong":"Because I was tired, so I went to bed early.","right":"Because I was tired, I went to bed early.","why_vi":"Không dùng because và so trong cùng một câu.","error_tag":"SENT.so_because"}],"vn_difficulties_vi":["Tiếng Việt nối các vế bằng dấu phẩy rất thoải mái (\"Trời mưa, tôi ở nhà\"), nên người Việt hay mắc lỗi nối → but.","error_tags":["SENT.coordinator"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-08-0007","type":"error_identification","cefr":"B1","difficulty":3,"context":"general","uses":["lesson","review","checkpoint"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["Because"," the road ","was"," flooded, ","so"," we ","took"," another way."],"underline":[0,2,4,6],"answer":2,"correction":["(bỏ so)"],"explanation_vi":"Câu đã có Because, không dùng thêm so. Bỏ so: Because the road was flooded, we took another way.","error_tags":["SENT.so_because"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-08-0008","type":"error_correction","cefr":"B1","difficulty":3,"context":"general","uses":["lesson","review"],"instruction_vi":"Câu sau có 1 lỗi sai. Viết lại câu đúng.","stem":"The shop was closed, we went to another one.","answers":["The shop was closed, so we went to another one.","The shop was closed. We went to another one.","Because the shop was closed, we went to another one.","The shop was closed; we went to another one."],"explanation_vi":"Hai mệnh đề độc lập không nối bằng dấu phẩy: thêm so, dùng dấu chấm/chấm phẩy, hoặc đổi thành câu phức.","error_tags":["SENT.comma_splice"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M01-08-0009","type":"transformation","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review"],"instruction_vi":"Nối 2 câu đơn thành câu phức.","original":"I didn't go to the party. I was sick.","cue":"I didn't go to the party because","answers":["I didn't go to the party because I was sick."],"required_patterns":["^i did not go to the party because i was sick"],"explanation_vi":"Nối thành câu phức với because (chỉ lý do).","error_tags":["SENT.coordinato  so"],"min_words":15,"explanation_vi":"Câu mẫu: …, so I was very tired / Although I wanted to go out, I stayed…","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M01-09":{"kind":"skill","schema_version":1,"skill_id":"G-M01-09","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Nối hai mệnh đề độc lập bằng and, but, or, so (và yet) đúng nghĩa và đúng dấu phẩy.","est_minutes":12,"source":["az-grammar-2nd:p23","az-original"],"explanation":[{"kind":"table","title_vi":"Liên từ đẳng lập hay dùng","head":["Liên từ","Nghĩa","Ví dụ"],"rows":[["and","thêm ý","I cleaned my room, and my sister cooked dinner."],["but","trái ý","The test was hard, but I passed it."],["or","lựa chọn","You can walk, or you can take the bus."],["so","kết quả","It was cold, so I wore a jacket."],["yet","trái ý (bất ngờ hơn but)","He is rich, yet he lives simply."]]},{"kind":"formula","title_vi":"Dấu câu","formula":"Mệnh đề 1 , and / but / or / so / yet  Mệnh đề 2"},{"kind":"note","text_vi":"so chỉ kết quả, đứng trước vế kết quả. because chỉ nguyên nhân, đứng trước vế nguyên nhân: I was hungry, so I ate · I ate because I was hungry."}],"worked_examples":[{"en":"The weather was nice, so we went to the beach.","analysis_vi":"Thời tiết đẹp → kết quả đi biển → so.","highlight":["so"]},{"en":"You can join the English club, or you can join the art club.","analysis_vi":"Hai lựa chọn → or.","highlight":["or"]}],"common_mistakes":[{"wrong":"I was hungry, because I ate a sandwich.","right":"I was hungry, so I ate a sandwich.","why_vi":"ăn bánh là kết quả của việc đói → so.","error_tag":"SENT.coordinator"},{"wrong":"She is tired but she continues working.","right":"She is tired, but she continues working.","why_vi":"Nối hai mệnh đề độc lập: dấu phẩy đặt trước but.","error_tag":"SENT.comma_coordinator"}],"vn_difficulties_vi":["Người Việt ,"difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["We ","have"," received ","many"," ","feedbacks"," from ","our clients","."],"underline":[1,3,5,7],"answer":2,"correction":["feedback"],"explanation_vi":"feedback không đếm được → không thêm -s; dùng a lot of / much feedback.","error_tags":["QNT.count_uncount"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-04-0011","type":"gap_fill","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Điền đúng dạng danh từ.","stem":"Please do not bring too much ___ (luggage) on the company trip.","answers":[["luggage"]],"explanation_vi":"luggage không đếm được → giữ nguyên, không -s.","error_tags":["QNT.count_uncount"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M02-04-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Lượng từ.","task_vi":"Viết 2 câu về văn phòng/lớp học: 1 câu với many hoặc a number of, 1 câu với much hoặc a lot of + danh từ không đếm được.","model_answers":["Our class has many students from Khanh Hoa. The teacher gave us a lot of useful advice.","A number of customers called this morning. We don't have much information about the new policy."],"rubric":["many / a number of + danh từ đếm được số nhiều","much / an amount of + danh từ không đếm được","Không thêm -s cho danh từ không đếm được"],"min_words":12,"explanation_vi":"Câu mẫu: many students / a lot of useful advice.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M02-06":{"kind":"skill","schema_version":1,"skill_id":"G-M02-06","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Chọn đúng dạng đại từ theo vị trí: chủ ngữ (I, he…), tân ngữ (me, him…), tính từ sở hữu (my, his…), đại từ sở hữu (mine, his…), phản thân (myself…).","est_minutes":12,"source":["az-grammar-2nd:p18","az-original"],"explanation":[{"kind":"table","title_vi":"Bảng 5 nhóm đại từ nhân xưng","head":["Mục","Cách dùng / ví dụ"],"rows":[["PERSONAL PRONOUN — Chủ ngữ & Tân ngữ","Chủ ngữ: I/You/We/They/He/She/It · Tân ngữ: Me/You/Us/Them/Him/Her/It"],["POSSESSIVE ADJECTIVE vs. POSSESSIVE PRONOUN","Tính từ sở hữu (My/Your/Our/Their/His/Her/Its) + DANH TỪ · Đại từ sở hữu (Mine/Yours/Ours/Theirs/His/Hers/Its) = tính từ sở hữu + danh từ"],["REFLEXIVE PRONOUN — Đại từ phản thân","Myself/Yourself(-selves)/Ourselves/Themselves/Himself/Herself/Itself"]]}],"worked_examples":[{"en":"Ms Mai sent her report to us yesterday.","analysis_vi":"her (tính từ sở hữu) đứng trước danh từ report; us là tân ngữ sau giới từ to.","highlight":["her","us"]},{"en":"The new laptop is mine, not yours.","analysis_vi":"mine, yours là đại từ sở hữu, đứng một mình thay cho my laptop, your laptop.","highlight":["mine","yours"]}],"common_mistakes":[{"wrong":"Please send the file to Nam and I.","right":"Please send the file to Nam and me.","why_vi":"Sau giới từ to dùng tân ngữ: me.","error_tag":"PRON.case"},{"wrong":"The company changed it's logo.","right":"The company changed its logo.","why_vi":"its là tính từ sở hữu; it's = it is.","error_tag":"PRON.case"},{"wrong":"He finished the report by his own.","right":"He finished the report on his own / by himself.","why_vi":"on one's own hoặc by oneself = tự mình.","error_tag":"PRON.reflexive"}],"vn_difficulties_vi":["Tiếng Việt không đổi dạng đại từ theo vị trí (\"anh ấy\" làm chủ ngữ hay tân ngữ đều giống nhau).","Hay nhầm its và it's, their và there."],"review_recommendations_vi":["Gạch chân vị trí: trước động từ (chủ ngữ), sau động từ/giới từ (tân ngữ), trước danh từ (tính từ sở hữu)."],"vocabulary_links":[],"flow":
