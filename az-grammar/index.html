or_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","AUX.choice"],"explanation_vi":"Chủ ngữ thật là The bag (số ít); with all my books chen giữa → is.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-08-0007","type":"error_identification","cefr":"A2","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["The price of these shoes ","are"," ","too"," high for ","most"," ","students","."],"underline":[1,3,5,7],"answer":0,"correction":["is"],"explanation_vi":"Chủ ngữ thật là The price (số ít) → is.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-08-0008","type":"error_correction","cefr":"A2","difficulty":3,"context":"general","uses":["lesson","review"],"instruction_vi":"Câu sau có 1 lỗi sai. Viết lại câu đúng.","stem":"There is three bedrooms in our new flat.","answers":["There are three bedrooms in our new flat."],"explanation_vi":"three bedrooms số nhiều → There are.","error_tags":["SVA.there_be"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-08-0009","type":"mcq","cefr":"A2","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Each of the workers ___ a uniform.","options":["wears","wear","are wearing","have worn"],"answer":0,"distractor_tags":[null,"SVA.every_each","SVA.every_each","AUX.have_has"],"explanation_vi":"Each (of …) → động từ số ít: wears.","error_tags":["SVA.every_each"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-08-0010","type":"gap_fill","cefr":"A2","difficulty":2,"context":"general","uses":["lesson","review"],"instruction_vi":"Chia động từ be ở hiện tại.","stem":"My best friend and I ___ (be) in the same class.","answers":[["are"]],"explanation_vi":"My best friend and I là chủ ngữ ghép → are.","error_tags":["SVA.compound_subject"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-08-0011","type":"mcq","cefr":"A2","difficulty":4,"context":"general","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The news ___ very surprising.","options":["was","were","are","have been"],"answer":0,"distractor_tags":[null,"SVA.plural_subject","SVA.plural_subject","AUX.have_has"],"explanation_vi":"news là danh từ không đếm được (dù có -s) → động từ số ít: was.","error_tags":["SVA.plural_subject"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-08-0012","type":"sentence_writing","cefr":"A2","difficulty":2,"context":"general","uses":["lesson"],"instruction_vi":"Tả lớp học của bạn.","task_vi":"Viết 2 câu tả lớp học của bạn: 1 câu dùng There is/There are, 1 câu có chủ ngữ ghép (A and B).","model_answers":["There are 35 students in my class. My best friend and I sit near the window.","There is a big whiteboard in our classroom. Nam and Huy always come early."],"rubric":["There is + số ít, There are + số nhiều","Chủ ngữ ghép A and B đi với động từ số nhiều","Chủ ngữ số ít ở hiện tại đơn có -s"],"min_words":10,"explanation_vi":"Câu mẫu: There are 35 students / My best friend and I sit.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M03-09":{"kind":"skill","schema_version":1,"skill_id":"G-M03-09","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Chia động từ đúng với chủ ngữ phức tạp trong câu TOEIC: each/every, one of, along with, danh từ tập hợp, lượng từ, chủ ngữ là V-ing.","est_minutes":15,"source":["az-grammar-2nd:p13","az-original"],"explanation":[{"kind":"text","title_vi":"Quy tắc cơ bản","text_vi":"Chủ ngữ số ít (danh từ số ít, danh từ không đếm được) → động từ chia số ít (V-s/es ở thì hiện tại đơn, is/was, has).","list":["Chủ ngữ số nhiều (danh từ số nhiều) → động từ chia số nhiều (V nguyên mẫu, are/were, have).","Khi có mệnh đề quan hệ hoặc cụm từ xen giữa chủ ngữ và động từ (ví dụ \"who attended the workshop\"), hãy BỎ QUA phần xen giữa để xác định đúng số của chủ ngữ thật."]},{"kind":"table","title_vi":"Bảng tổng hợp theo sách AZ Grammar: danh từ, chủ ngữ ghép, đại từ bất định và lư","head":["Mục","Cách dùng / ví dụ"],"rows":[["1. Nguyên tắc chung","Danh từ không đếm được / danh từ số ít → V số ít · Danh từ số nhiều → V số nhiều"],["2. Chủ ngữ ghép","N1 and N2 → V số nhiều · N1 or/nor N2 (either…or, neither…nor) → V chia theo N2 (danh từ gần động từ nhất)"],["3. Đại từ bất định","(each, every-, any-, some-) + (-one, -body, -thing) / either / neither → V số ít · (some, all, most, none, any, half) of + N → V chia theo N đứng sau \"of\""],["4. Lượng từ (Quantifiers)","much, little, a little, an amount of, a great deal of, a bit of + N không đếm được → V số ít · many, few, a few, several, a (great/large) number of + N số nhiều → V số nhiều · all of, some of, any of, a lot of, lots of, plenty of, most of, none of, half of + N → chia theo N"]]},{"kind":"text","title_vi":"Các cấu trúc dễ gây nhầm (bẫy TOEIC kinh điển)","text_vi":"\"Each/Every + N số ít\" → luôn chia V số ít, kể cả \"each of + N số nhiều\" (chủ ngữ thật là \"each\").","list":["\"One of + N số nhiều\" → chia V số ít (chủ ngữ thật là \"one\").","\"The number of + N số nhiều\" = số ít (chia V số ít) >< \"A number of + N số nhiều\" = nhiều (chia V số nhiều).","\"Along with / together with / as well as / in addition to + cụm\" thường có dấu phẩy bao quanh, KHÔNG ảnh hưởng đến việc chia động từ — động từ vẫn chia theo chủ ngữ chính đứng trước.","\"Either...or / Neither...nor / Not only...but also\": động từ chia theo chủ ngữ đứng GẦN động từ nhất (quy tắc \"gần đâu chia đó\").","\"Both A and B\" luôn là số nhiều, chia V số nhiều — không có ngoại lệ như either/or.","Đại từ bất định kết thúc bằng -body/-one/-thing (everybody, everyone, someone, anybody, nobody...) luôn là số ít.","\"There + be\" chia theo danh từ đứng NGAY SAU nó, không phải theo \"there\".","Danh từ tập hợp (committee, team, staff, family, company) khi coi là MỘT khối thống nhất → chia V số ít.","Cụm chủ ngữ dạng \"V-ing + ...\" hoặc \"To V + ...\" (danh động từ/động từ nguyên mẫu làm chủ ngữ) luôn chia V số ít."]},{"kind":"note","text_vi":"Mẹo Part 5: gạch bỏ mọi cụm xen giữa (of…, along with…, who…) rồi mới nhìn chủ ngữ chính."}],"worked_examples":[{"en":"One of the new employees has already finished the training.","analysis_vi":"Chủ ngữ chính là One (số ít); of the new employees chỉ bổ sung → has.","highlight":["One","has"]},{"en":"The manager, along with her assistants, is attending the conference.","analysis_vi":"along with … không làm chủ ngữ thành số nhiều → is.","highlight":["The manager","is"]}],"common_mistakes":[{"wrong":"Each of the reports were checked.","right":"Each of the reports was checked.","why_vi":"Each (of …) luôn số ít.","error_tag":"SVA.every_each"},{"wrong":"The number of applicants have increased.","right":"The number of applicants has increased.","why_vi":"The number of (con số) → số ít; A number of (nhiều) → số nhiều.","error_tag":"SVA.nearest_noun"},{"wrong":"Reviewing the documents take time.","right":"Reviewing the documents takes time.","why_vi":"Chủ ngữ là V-ing → số ít.","error_tag":"SVA.plural_subject"}],"vn_difficulties_vi":["Câu TOEIC thường chèn cụm dài giữa chủ ngữ và động từ để người làm chia theo danh từ gần nhất.","Người Việt hay nhầm the number of / a number of vì đều dịch là \"số lượng\"."],"review_recommendations_vi":["Làm lại các câu sai, mỗi câu gạch chân chủ ngữ chính trước khi chọn."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M03-09-0001"],"guided":["Q-M03-09-0002","Q-M03-09-0003","Q-M03-09-0004","Q-M03-09-0005"],"independent":["Q-M03-09-0006","Q-M03-09-0007","Q-M03-09-0008","Q-M03-09-0009","Q-M03-09-0010","Q-M03-09-0011"],"writing":["Q-M03-09-0012"]}},"questions":[{"id":"Q-M03-09-0001","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"Each of the applicants ___ asked to complete a short test before the interview.","options":["was","were","are","have been"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Mỗi ứng viên đều được yêu cầu làm một bài kiểm tra ngắn trước buổi phỏng vấn. — \"Each of + N số nhiều\" vẫn chia động từ số ít vì \"each\" luôn mang nghĩa số ít khi làm chủ ngữ. Mẹo thêm: \"each of the + N số nhiều\" khác với \"each + N số ít\" (không có \"of\") — cả hai đều chia V số ít.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-1"}},{"id":"Q-M03-09-0002","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Every employee in the department ___ attended the safety training last week.","options":["has","have","are","were"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Mọi nhân viên trong phòng ban đều đã tham dự buổi tập huấn an toàn tuần trước. — \"Every + N số ít\" luôn đi với động từ số ít, ở đây là \"has attended\" (hiện tại hoàn thành). Mẹo thêm: \"every\" không bao giờ đứng trước danh từ số nhiều, khác với \"all\" (all + N số nhiều).","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-1"}},{"id":"Q-M03-09-0003","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"One of the printers on the third floor ___ out of order.","options":["is","are","were","have been"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Một trong những máy in ở tầng ba đang bị hỏng. — Chủ ngữ thật sự là \"one\" (số ít), \"of the printers\" chỉ là cụm bổ nghĩa, không quyết định số của động từ. Mẹo thêm: cấu trúc \"one of + N số nhiều\" luôn chia V số ít — lỗi rất hay gặp khi thí sinh nhìn thấy danh từ số nhiều đứng ngay trước động từ.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-1"}},{"id":"Q-M03-09-0004","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Everybody in the meeting room ___ satisfied with the new proposal.","options":["seems","seem","are","were"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Mọi người trong phòng họp đều có vẻ hài lòng với đề xuất mới. — \"Everybody/everyone/someone/anybody/nobody...\" luôn được coi là số ít, chia V số ít. Mẹo thêm: các đại từ bất định kết thúc bằng \"-body/-one/-thing\" đều là số ít, dù ý nghĩa có thể chỉ nhiều người.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-1"}},{"id":"Q-M03-09-0005","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The number of visitors to the museum ___ increased significantly this year.","options":["has","have","are","were"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Số lượng khách tham quan bảo tàng đã tăng đáng kể trong năm nay. — \"The number of + N số nhiều\" = số ít (chủ ngữ chính là \"the number\"), chia V số ít. Mẹo thêm: phân biệt với \"a number of + N số nhiều\" = nhiều, chia V số nhiều (ví dụ: \"A number of visitors have complained.\").","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-1"}},{"id":"Q-M03-09-0006","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"A number of employees ___ requested to work remotely next month.","options":["have","has","is","was"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Một số nhân viên đã yêu cầu được làm việc từ xa vào tháng tới. — \"A number of + N số nhiều\" mang nghĩa \"một số/nhiều\", chia động từ số nhiều. Mẹo thêm: đây là cặp bẫy kinh điển trong TOEIC — \"the number of\" (số ít) và \"a number of\" (số nhiều) chỉ khác nhau ở mạo từ nhưng chia động từ hoàn toàn khác nhau.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-1"}},{"id":"Q-M03-09-0007","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"Neither the manager nor the employees ___ aware of the schedule change.","options":["were","was","is","has been"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Cả quản lý lẫn nhân viên đều không biết về việc thay đổi lịch trình. — Với \"neither...nor\" / \"either...or\" / \"not only...but also\", động từ chia theo chủ ngữ đứng GẦN động từ nhất — ở đây là \"the employees\" (số nhiều) nên dùng \"were\". Mẹo thêm: nếu đảo vị trí thành \"Neither the employees nor the manager ___\", đáp án sẽ đổi thành \"was\" vì chủ ngữ gần nhất lúc đó là \"the manager\" (số ít).","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-1"}},{"id":"Q-M03-09-0008","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Either the supervisor or her assistants ___ responsible for approving the request.","options":["are","is","be","being"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Hoặc là người giám sát hoặc các trợ lý của cô ấy sẽ chịu trách nhiệm phê duyệt yêu cầu này. — Chủ ngữ gần động từ nhất là \"her assistants\" (số nhiều) → chia \"are\". Mẹo thêm: quy tắc \"gần đâu chia đó\" áp dụng cho cả \"either...or\" và \"neither...nor\" và \"not only...but also\".","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-1"}},{"id":"Q-M03-09-0009","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Not only the manager but also the staff members ___ invited to the annual dinner.","options":["are","is","was","has been"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Không chỉ quản lý mà cả các nhân viên cũng được mời đến buổi tiệc thường niên. — \"the staff members\" (số nhiều) đứng gần động từ nên chia \"are\". Mẹo thêm: \"not only...but also\" nối 2 chủ ngữ nhưng động từ luôn theo chủ ngữ thứ hai (gần vị trí động từ hơn).","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-1"}},{"id":"Q-M03-09-0010","type":"error_identification","cefr":"B1","difficulty":3,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["The results of the customer survey ","shows"," that ","most"," clients ","are satisfied"," with ","our service","."],"underline":[1,3,5,7],"answer":0,"correction":["show"],"explanation_vi":"Chủ ngữ chính là The results (số nhiều) → show.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-09-0011","type":"gap_fill","cefr":"B2","difficulty":2,"context":"toeic","uses":["lesson","review"],"instruction_vi":"Chia động từ be.","stem":"Neither the manager nor the employees ___ (be) aware of the change.","answers":[["were","are"]],"explanation_vi":"Neither … nor …: động từ chia theo danh từ gần nhất (the employees, số nhiều) → were/are.","error_tags":["SVA.compound_subject"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-09-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"toeic","uses":["lesson"],"instruction_vi":"Viết về nơi bạn học hoặc làm việc.","task_vi":"Viết 2 câu về công ty/trường của bạn: 1 câu với each/every, 1 câu với one of the + danh từ số nhiều.","model_answers":["Every employee receives a laptop on the first day. One of our teachers has worked here for ten years.","Each department has its own budget. One of the students is going to study in Japan."],"rubric":["each/every + danh từ số ít + động từ số ít","one of the + danh từ số nhiều + động từ số ít","Không chia theo danh từ đứng gần động từ"],"min_words":12,"explanation_vi":"Câu mẫu: Every employee receives / One of our teachers has worked.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M03-09-0013","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Almost 60 percent of the budget ___ allocated to marketing activities this quarter.","options":["has been","have been","are","were"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Gần 60% ngân sách đã được phân bổ cho các hoạt động marketing trong quý này. — \"phần trăm/phân số + of + N\" chia động từ theo danh từ đi sau \"of\": ở đây \"the budget\" không đếm được → số ít → \"has been\". Mẹo thêm: nếu là \"60 percent of the employees ___ agreed\", thì \"employees\" số nhiều nên chia \"have agreed\".","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-1"}},{"id":"Q-M03-09-0014","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The CEO, along with several board members, ___ scheduled to attend the conference.","options":["is","are","were","have"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Giám đốc điều hành, cùng với vài thành viên hội đồng quản trị, dự kiến sẽ tham dự hội nghị. — Cụm \"along with/together with/as well as/in addition to + N\" chỉ là cụm bổ nghĩa xen giữa (thường có dấu phẩy), KHÔNG ảnh hưởng đến việc chia động từ — động từ vẫn chia theo chủ ngữ chính \"The CEO\" (số ít). Mẹo thêm: đây khác với \"and\" — \"The CEO and several board members ARE...\" (nối bằng and thì cộng gộp thành số nhiều).","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-2"}},{"id":"Q-M03-09-0015","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"There ___ several reasons why the project was delayed.","options":["are","is","has","was"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Có vài lý do khiến dự án bị trì hoãn. — Trong cấu trúc \"There + be\", động từ chia theo danh từ đứng NGAY SAU nó, ở đây \"several reasons\" số nhiều → \"are\". Mẹo thêm: \"there\" không phải là chủ ngữ thật, chỉ đóng vai trò dẫn dắt câu — luôn nhìn danh từ phía sau để chọn dạng \"be\" phù hợp.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-2"}},{"id":"Q-M03-09-0016","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The committee ___ meeting every Thursday to review new applications.","options":["is","are","have been","were"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Ủy ban họp vào mỗi thứ Năm để xem xét các đơn ứng tuyển mới. — \"Committee/team/staff/family/company\" là danh từ tập hợp (collective noun), khi được xem là MỘT khối thống nhất thì chia V số ít. Mẹo thêm: TOEIC luôn ưu tiên coi danh từ tập hợp là số ít trừ khi có dấu hiệu rõ ràng nhấn mạnh từng thành viên riêng lẻ.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-2"}},{"id":"Q-M03-09-0017","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Reading customer reviews before making a purchase ___ become a common habit.","options":["has","have","are","were"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Việc đọc đánh giá của khách hàng trước khi mua sắm đã trở thành một thói quen phổ biến. — Khi một cụm V-ing (danh động từ) làm chủ ngữ, nó luôn được coi là số ít, dù có tân ngữ số nhiều theo sau (\"customer reviews\"). Mẹo thêm: cụm chủ ngữ dạng \"V-ing + ...\" hoặc \"To V + ...\" luôn chia động từ số ít.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-2"}},{"id":"Q-M03-09-0018","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"All of the information in the report ___ accurate and up to date.","options":["is","are","have been","were"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Toàn bộ thông tin trong báo cáo đều chính xác và cập nhật. — \"All of + N không đếm được\" (information, furniture, equipment, advice) → V số ít. Mẹo thêm: so sánh với \"All of the employees ARE satisfied\" (N đếm được số nhiều → V số nhiều) — \"all of\" chia theo danh từ theo sau, giống \"some of/most of/half of\".","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-2"}},{"id":"Q-M03-09-0019","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Most of the equipment in the warehouse ___ outdated and needs replacement.","options":["is","are","were","have"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Hầu hết thiết bị trong nhà kho đã lỗi thời và cần được thay thế. — \"equipment\" là danh từ không đếm được, nên \"most of the equipment\" chia V số ít. Mẹo thêm: các danh từ không đếm được thường gặp trong TOEIC: equipment, furniture, information, advice, luggage, machinery — luôn chia động từ số ít, không thêm \"-s\".","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-2"}},{"id":"Q-M03-09-0020","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Both the manager and the assistant ___ present at the negotiation.","options":["were","was","is","has been"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Cả quản lý lẫn trợ lý đều có mặt tại buổi đàm phán. — \"Both A and B\" luôn được coi là chủ ngữ số nhiều, chia V số nhiều, không phụ thuộc vào chủ ngữ gần là gì (khác với either/or). Mẹo thêm: \"both...and\" = phép cộng chắc chắn tạo ra số nhiều, không có ngoại lệ như \"either/or\".","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-2"}},{"id":"Q-M03-09-0021","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The news about the merger ___ surprised many employees.","options":["has","have","were","are"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Tin tức về việc sáp nhập đã khiến nhiều nhân viên bất ngờ. — \"News\" có hình thức số nhiều (kết thúc bằng \"-s\") nhưng LUÔN là danh từ không đếm được/số ít về ngữ pháp. Mẹo thêm: các từ dễ nhầm dạng này: news, means, series, species — nhìn giống số nhiều nhưng chia động từ số ít.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-2"}},{"id":"Q-M03-09-0022","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Everyone who attended the workshop ___ given a certificate of completion.","options":["was","were","are","have been"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Mọi người tham dự buổi hội thảo đều được cấp chứng chỉ hoàn thành. — \"Everyone\" luôn số ít; mệnh đề quan hệ \"who attended the workshop\" chỉ bổ nghĩa, không ảnh hưởng số của động từ chính. Mẹo thêm: khi có mệnh đề quan hệ xen giữa chủ ngữ và động từ chính, hãy bỏ qua mệnh đề đó để xác định đúng số của chủ ngữ thật.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-2"}},{"id":"Q-M03-09-0023","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The majority of shareholders ___ in favor of the new policy.","options":["are","is","was","has been"],"answer":0,"distractor_tags":[null,"SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Đa số cổ đông ủng hộ chính sách mới. — \"The majority of + N số nhiều\" chia theo danh từ phía sau (shareholders, số nhiều) → \"are\". Mẹo thêm: nếu là \"The majority of the staff IS...\" (staff là danh từ tập hợp số ít) thì có thể chia số ít — cần dựa vào danh từ đi kèm \"of\" là số ít hay số nhiều.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-2"}},{"id":"Q-M03-09-0024","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"All of the information in the report ___ been verified by the audit team.","options":["have","has","are","were"],"answer":1,"distractor_tags":["SVA.nearest_noun",null,"SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Toàn bộ thông tin trong báo cáo đã được nhóm kiểm toán xác minh. — Giải thích: \"all of + N\" chia theo N sau \"of\"; \"information\" là danh từ không đếm được → V số ít \"has\". Mẹo thêm: đừng bị \"all\" đánh lừa thành số nhiều — luôn nhìn vào danh từ đứng sau \"of\".","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0025","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Some of the applicants ___ already submitted their portfolios.","options":["has","is","have","was"],"answer":2,"distractor_tags":["SVA.nearest_noun","SVA.nearest_noun",null,"SVA.nearest_noun"],"explanation_vi":"Dịch: Một số ứng viên đã nộp hồ sơ năng lực của mình. — Giải thích: \"some of + N\" chia theo N; \"applicants\" là số nhiều → \"have\". Mẹo thêm: cùng cấu trúc \"Some of…\" nhưng đổi danh từ thành \"the money\" thì phải dùng số ít (\"has\").","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0026","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Neither of the two proposals ___ acceptable to the board.","options":["are","were","is","have been"],"answer":2,"distractor_tags":["SVA.nearest_noun","SVA.nearest_noun",null,"SVA.nearest_noun"],"explanation_vi":"Dịch: Không đề xuất nào trong hai đề xuất được hội đồng chấp nhận. — Giải thích: \"neither of + N\" (cũng như either/each) đi với V số ít → \"is\". Mẹo thêm: trong văn nói có người dùng số nhiều, nhưng TOEIC luôn chấm theo quy tắc số ít.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0027","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Each of the new employees ___ required to attend the orientation session.","options":["are","is","were","have"],"answer":1,"distractor_tags":["SVA.nearest_noun",null,"SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Mỗi nhân viên mới đều được yêu cầu tham dự buổi định hướng. — Giải thích: \"each of + N số nhiều\" vẫn chia V số ít vì chủ ngữ thật là \"each\" → \"is\". Mẹo thêm: \"each/every/one of + N số nhiều\" → luôn V số ít.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0028","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"A number of customers ___ complained about the delay in delivery.","options":["has","is","have","was"],"answer":2,"distractor_tags":["SVA.nearest_noun","SVA.nearest_noun",null,"SVA.nearest_noun"],"explanation_vi":"Dịch: Một số khách hàng đã phàn nàn về việc giao hàng chậm. — Giải thích: \"a number of + N số nhiều\" mang nghĩa \"một số\" → V số nhiều \"have\". Mẹo thêm: so sánh với \"the number of\" ở câu sau — chỉ khác một mạo từ nhưng đổi hẳn cách chia động từ.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0029","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The number of complaints ___ dropped significantly since the new policy took effect.","options":["have","are","has","were"],"answer":2,"distractor_tags":["SVA.nearest_noun","SVA.nearest_noun",null,"SVA.nearest_noun"],"explanation_vi":"Dịch: Số lượng khiếu nại đã giảm đáng kể kể từ khi chính sách mới có hiệu lực. — Giải thích: chủ ngữ thật là \"the number\" (một con số) → V số ít; \"since\" đòi hiện tại hoàn thành → \"has dropped\". Mẹo thêm: \"the number of + N số nhiều\" → số ít; \"a number of + N số nhiều\" → số nhiều.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0030","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Much of the equipment in the laboratory ___ outdated.","options":["are","were","have been","is"],"answer":3,"distractor_tags":["SVA.nearest_noun","SVA.nearest_noun","SVA.nearest_noun",null],"explanation_vi":"Dịch: Phần lớn thiết bị trong phòng thí nghiệm đã lỗi thời. — Giải thích: \"much of + N không đếm được\" → V số ít; \"equipment\" là danh từ không đếm được → \"is\". Mẹo thêm: equipment, furniture, luggage, machinery, information là các danh từ không đếm được rất hay bị hỏi trong TOEIC.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0031","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Few of the candidates ___ qualified for the senior position.","options":["is","was","are","has been"],"answer":2,"distractor_tags":["SVA.nearest_noun","SVA.nearest_noun",null,"SVA.nearest_noun"],"explanation_vi":"Dịch: Rất ít ứng viên đủ tiêu chuẩn cho vị trí cấp cao. — Giải thích: \"few of + N số nhiều\" → V số nhiều \"are\". Mẹo thêm: \"few\" (rất ít, mang nghĩa tiêu cực) khác \"a few\" (một vài, mang nghĩa tích cực) nhưng cả hai đều đi với danh từ đếm được số nhiều.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0032","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Half of the budget ___ been spent on marketing this quarter.","options":["have","has","are","were"],"answer":1,"distractor_tags":["SVA.nearest_noun",null,"SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Một nửa ngân sách đã được chi cho marketing trong quý này. — Giải thích: \"half of + N\" chia theo N; \"budget\" số ít → \"has\". Mẹo thêm: \"budget\" là danh từ đếm được nhưng ở đây là số ít, nên \"half of the budget\" đi với V số ít.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0033","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Half of the employees ___ working remotely this week.","options":["is","are","has","was"],"answer":1,"distractor_tags":["SVA.nearest_noun",null,"SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Một nửa số nhân viên đang làm việc từ xa trong tuần này. — Giải thích: cùng cấu trúc \"half of + N\" nhưng \"employees\" là số nhiều → \"are\". Mẹo thêm: hai câu \"Half of the budget has…\" và \"Half of the employees are…\" cho thấy động từ luôn chạy theo danh từ sau \"of\".","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0034","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The manager and the assistant director ___ scheduled to visit the branch next week.","options":["is","has","are","was"],"answer":2,"distractor_tags":["SVA.nearest_noun","SVA.nearest_noun",null,"SVA.nearest_noun"],"explanation_vi":"Dịch: Giám đốc và phó giám đốc dự kiến sẽ thăm chi nhánh vào tuần tới. — Giải thích: \"N1 and N2\" (hai người khác nhau, có mạo từ \"the\" lặp lại) → V số nhiều \"are\". Mẹo thêm: nếu chỉ có một \"the\" trước cả hai danh từ (the manager and director) thì có thể chỉ MỘT người giữ hai chức danh → số ít.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0035","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"The elderly ___ more medical care than younger people.","options":["needs","need","is needing","has needed"],"answer":1,"distractor_tags":["SVA.nearest_noun",null,"SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Người cao tuổi cần được chăm sóc y tế nhiều hơn người trẻ. — Giải thích: \"the + tính từ\" (the elderly) chỉ một nhóm người → V số nhiều \"need\" (không thêm -s). Mẹo thêm: các cụm tương tự: the rich, the poor, the young, the unemployed.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}},{"id":"Q-M03-09-0036","type":"mcq","cefr":"B1","difficulty":3,"context":"toeic","uses":["review"],"instruction_vi":"Chọn đáp án đúng.","stem":"Spaghetti and meatballs ___ the most popular dish at our cafeteria.","options":["are","is","were","have been"],"answer":1,"distractor_tags":["SVA.nearest_noun",null,"SVA.nearest_noun","SVA.nearest_noun"],"explanation_vi":"Dịch: Mì Ý sốt viên là món phổ biến nhất ở căng tin của chúng tôi. — Giải thích: \"spaghetti and meatballs\" chỉ MỘT món ăn duy nhất → coi là số ít → \"is\". Mẹo thêm: các cặp như \"bread and butter\", \"rock and roll\", \"fish and chips\" cũng thường được xem là một thực thể → số ít.","error_tags":["SVA.nearest_noun"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31","change_note":"Nhập từ TOEIC Grammar & Vocab Trainer, bài hh-3"}}]},"G-M04-01":{"kind":"skill","schema_version":1,"skill_id":"G-M04-01","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Dùng thì hiện tại đơn cho thói quen, lịch trình và sự thật; thêm -s/-es đúng chính tả.","est_minutes":12,"source":["az-grammar-2nd:p2","az-original"],"explanation":[{"kind":"formula","title_vi":"Công thức","formula":"(+) S + V / V-s,es      (−) S + don't / doesn't + V      (?) Do / Does + S + V?"},{"kind":"table","title_vi":"Khi nào dùng","head":["Cách dùng","Ví dụ"],"rows":[["Thói quen, việc lặp lại","I go to the gym three times a week."],["Sự thật, chân lý","Water boils at 100°C."],["Lịch trình cố định","The train leaves at 6:30."]]},{"kind":"table","title_vi":"Thêm -s / -es với he, she, it","head":["Động từ tận cùng","Quy tắc","Ví dụ"],"rows":[["-o, -s, -sh, -ch, -x, -z","thêm -es","goes, watches, fixes"],["phụ âm + y","đổi y → ies","study → studies"],["nguyên âm + y","thêm -s","play → plays"],["have","bất quy tắc","has"]]},{"kind":"signal_words","title_vi":"Dấu hiệu thời gian","words":["always","usually","often","sometimes","never","every day","on Mondays","twice a week"]}],"forms":{"affirmative":"S + V / V-s,es","negative":"S + don't / doesn't + V","question":"Do / Does + S + V?"},"worked_examples":[{"en":"My brother usually plays badminton after school.","analysis_vi":"Thói quen (usually), chủ ngữ số ít My brother → plays.","highlight":["usually","plays"]},{"en":"The museum opens at 8 a.m.","analysis_vi":"Lịch trình cố định → hiện tại đơn; The museum số ít → opens.","highlight":["opens"]}],"common_mistakes":[{"wrong":"She watchs TV every evening.","right":"She watches TV every evening.","why_vi":"watch tận cùng -ch → thêm -es.","error_tag":"VERB.es_spelling"},{"wrong":"He go to work by bus.","right":"He goes to work by bus.","why_vi":"Chủ ngữ He → động từ thêm -es.","error_tag":"SVA.third_person_s"},{"wrong":"My mother don't like durian.","right":"My mother doesn't like durian.","why_vi":"Chủ ngữ số ít My mother → doesn't.","error_tag":"AUX.choice"}],"vn_difficulties_vi":["Tiếng Việt không chia động từ theo ngôi, nên rất dễ quên -s/-es ở ngôi thứ ba số ít, cả khi nói lẫn khi viết.","Dịch \"đang\" hay \"thường\" lẫn lộn nên chọn sai giữa hiện tại đơn và tiếp diễn."],"review_recommendations_vi":["Đọc to 5 câu về một người bạn (He/She…) để luyện thói quen thêm -s."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M04-01-0001"],"guided":["Q-M04-01-0002","Q-M04-01-0003","Q-M04-01-0004","Q-M04-01-0005"],"independent":["Q-M04-01-0006","Q-M04-01-0007","Q-M04-01-0008","Q-M04-01-0009","Q-M04-01-0010","Q-M04-01-0011"],"writing":["Q-M04-01-0012"]}},"questions":[{"id":"Q-M04-01-0001","type":"mcq","cefr":"A1","difficulty":1,"context":"general","uses":["lesson","placement"],"instruction_vi":"Chọn đáp án đúng.","stem":"She ___ to school by bike every day.","options":["go","goes","is go","going"],"answer":1,"distractor_tags":["SVA.third_person_s",null,"BE.with_verb","TENSE.continuous_missing_be"],"explanation_vi":"Thói quen (every day), chủ ngữ She → goes (go tận cùng -o thêm -es).","error_tags":["SVA.third_person_s"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M04-01-0002","type":"mcq","cefr":"A1","difficulty":2,"context":"general","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"Water ___ at 100 degrees Celsius.","options":["boil","boils","is boiling","boiled"],"answer":1,"distractor_tags":["SVA.third_person_s",null,"TENSE.ps_vs_pc","TENSE.signal_word"],"explanation_vi":"Sự thật khoa học → hiện tại đơn; Water (không đếm được, số ít) → boils.","error_tags":["TENSE.ps_vs_pc"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M04-01-0003","type":"gap_fill","cefr":"A1","difficulty":2,"context":"general","uses":["lesson"],"instruction_vi":"Chia động từ trong ngoặc.","stem":"My little brother ___ (study) very hard.","answers":[["studies"]],"explanation_vi":"study: phụ âm d + y → đổi y thành ies: studies.","error_tags":["VERB.es_spelling"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M04-01-0004","type":"gap_fill","cefr":"A1","difficulty":2,"context":"general","uses":["lesson"],"instruction_vi":"Chia động từ trong ngoặc.","stem":"Mr Hung ___ (teach) maths at my school.","answers":[["teaches"]],"explanation_vi":"teach tận cùng -ch → thêm -es: teaches.","error_tags":["VERB.es_spelling"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M04-01-0005","type":"mcq","cefr":"A2","difficulty":2,"context":"general","uses":["lesson"],"instruction_vi":"Chọn đáp án đúng.","stem":"The bus ___ at 7:15 every morning.","options":["leave","leaves","is leaving","left"],"answer":1,"distractor_tags":["SVA.third_person_s",null,"TENSE.ps_vs_pc","TENSE.signal_word"],"explanation_vi":"Lịch trình cố định → hiện tại đơn; The bus số ít → leaves.","error_tags":["SVA.third_person_s"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M04-01-0006","type":"mcq","cefr":"A1","difficulty":2,"context":"general","uses":["lesson","review","checkpoint"],"instruction_vi":"Chọn đáp án đúng.","stem":"How often ___ your father go fishing?","options":["do","does","is","has"],"answer":1,"distractor_tags":["AUX.choice",null,"BE.with_verb","AUX.choice"],"explanation_vi":"Câu hỏi hiện tại đơn, chủ ngữ your father số ít → does; go giữ nguyên mẫu.","error_tags":["AUX.choice"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M04-01-0007","type":"error_identification","cefr":"A1","difficulty":3,"context":"general","uses":["lesson","review","checkpoint"],"instruction_vi":"Tìm phần sai (A, B, C hoặc D).","segments":["My best friend"," ","live"," in ","a small house"," ","near the beach","."],"underline":[0,2,4,6],"answer":1,"correction":["lives"],"explanation_vi":"Chủ ngữ My best friend số ít → lives.","error_tags":["SVA.third_person_s"],"source":"az-original","review": le_vi":"Cách dùng"},{"kind":"table","title_vi":"used to và would","head":["","used to","would"],"rows":[["Thói quen (hành động lặp lại)","✓ We used to swim every summer.","✓ We would swim every summer."],["Trạng thái (live, have, like, be)","✓ I used to have long hair.","✗ I would have long hair."]]},{"kind":"note","text_vi":"Đừng nhầm với be used to + V-ing (quen với): I'm used to getting up early. Bài này chỉ học used to + V nguyên mẫu."}],"worked_examples":[{"en":"My grandfather used to work in a factory.","analysis_vi":"Trước đây làm ở nhà máy, nay không còn → used to + work.","highlight":["used to work"]},{"en":"When I was small, my mother would read me a story every night.","analysis_vi":"Hành động lặp lại trong quá khứ → would read.","highlight":["would read"]}],"common_mistakes":[{"wrong":"I use to play football when I was young.","right":"I used to play football when I was young.","why_vi":"Câu khẳng định viết used to (có -d).","error_tag":"TENSE.used_to"},{"wrong":"She didn't used to like vegetables.","right":"She didn't use to like vegetables.","why_vi":"Sau didn't dùng use to (không -d).","error_tag":"TENSE.used_to"},{"wrong":"We would live in a small village.","right":"We used to live in a small village.","why_vi":"live là trạng thái → không dùng would.","error_tag":"TENSE.would_stative"}],"vn_difficulties_vi":["Người Việt hay dịch \"thường\" thành used to cả cho thói quen hiện tại (I used to get up at 6 every day now ✗).","Khi nghe, -d trong used to gần như không đọc rõ nên hay viết thiếu."],"review_recommendations_vi":["So sánh 2 câu: \"Hồi nhỏ tôi…\" và \"Bây giờ tôi…\" để luyện used to."],"vocabulary_links":[],"flow":{"diagnostic":["Q-M04-07-0001"],"guided":["Q-M04-07-0002","Q-M04-07-0003","Q-M04-07-0004","Q-M04-07-0005"],"independent":["Q-M04-07-0006","Q-M04-07-0007","Q-M04-07-0008","Q-M04-07-0009","Q-M04-07-0010","Q-M04-07-0011"],"writing":["Q-M04-07-0012"]}},"questions":[{"id":"Q-M04-07-0001","type":"mcq","cefr":"B1","difficulty":2,"context":"gen ushi before you went to Japan? B: No, I hadn't.","answers":[["Had"],["eaten"]],"explanation_vi":"Câu hỏi quá khứ hoàn thành: Had + you + ever + V3 (eaten).","error_tags":["VERB.v3_form"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M04-11-0011","type":"transformation","cefr":"B1","difficulty":3,"context":"general","uses":["lesson","review"],"instruction_vi":"Nối 2 câu, bắt đầu bằng After Lan.","original":"First Lan finished her homework. Then she watched TV.","cue":"After Lan","answers":["After Lan had finished her homework, she watched TV.","After Lan finished her homework, she watched TV."],"required_patterns":["^after lan (had )?finished her homework, she watched tv"],"explanation_vi":"After + việc trước (had finished / finished), việc sau (watched).","error_tags":["TENSE.past_perfect_order"],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}},{"id":"Q-M04-11-0012","type":"sentence_writing","cefr":"B1","difficulty":2,"context":"general","uses":["lesson"],"instruction_vi":"Kể một lần tới muộn.","task_vi":"Kể 1–2 câu về một lần bạn tới muộn và một việc đã xảy ra trước khi bạn tới.","model_answers":["When I arrived at the stadium, the match had already started, so I missed the first goal.","By the time I got to the bus stop, the last bus had left."],"rubric":["Việc xảy ra trước dùng had + V3","Việc xảy ra sau dùng quá khứ đơn","Có when / by the time / before để nối"],"min_words":10,"explanation_vi":"Câu mẫu: arrived + had already started; got + had left.","error_tags":[],"source":"az-original","review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"}}]},"G-M04-13":{"kind":"skill","schema_version":1,"skill_id":"G-M04-13","lesson":{"review":{"status":"draft","version":1,"author":"claude","created":"2026-10-31","updated":"2026-10-31"},"objective_vi":"Chọn đún
