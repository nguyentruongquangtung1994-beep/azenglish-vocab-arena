<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>AZEnglish Reading Trainer</title>
<meta name="theme-color" content="#e0102b" />
<style>
  :root{
    --paper:#fcfbfa; --paper-2:#f2f0ee; --ink:#1a1210; --ink-soft:#5c534f; --line:#e6e1dc;
    --red:#e0102b; --red-ink:#8f0a1c;
    --green:#1e7a4c; --green-bg:#e7f4ec;
    --amber:#a5680a; --amber-bg:#faf1de;
    --card-shadow: 0 1px 0 rgba(26,18,16,.04), 0 12px 28px -18px rgba(26,18,16,.35);
    --focus: 0 0 0 3px rgba(224,16,43,.28);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#161211; --paper-2:#1f1a18; --ink:#f3ece9; --ink-soft:#b8aca6; --line:#332b28;
      --red:#ff4d5e; --red-ink:#ff8f98; --green:#5fd394; --green-bg:#173226;
      --amber:#e3ac52; --amber-bg:#332a16;
      --card-shadow: 0 1px 0 rgba(0,0,0,.2), 0 20px 40px -20px rgba(0,0,0,.6);
      --focus: 0 0 0 3px rgba(255,77,94,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#161211; --paper-2:#1f1a18; --ink:#f3ece9; --ink-soft:#b8aca6; --line:#332b28;
    --red:#ff4d5e; --red-ink:#ff8f98; --green:#5fd394; --green-bg:#173226;
    --amber:#e3ac52; --amber-bg:#332a16;
    --card-shadow: 0 1px 0 rgba(0,0,0,.2), 0 20px 40px -20px rgba(0,0,0,.6);
    --focus: 0 0 0 3px rgba(255,77,94,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --paper:#fcfbfa; --paper-2:#f2f0ee; --ink:#1a1210; --ink-soft:#5c534f; --line:#e6e1dc;
    --red:#e0102b; --red-ink:#8f0a1c; --green:#1e7a4c; --green-bg:#e7f4ec;
    --amber:#a5680a; --amber-bg:#faf1de;
    --card-shadow: 0 1px 0 rgba(26,18,16,.04), 0 12px 28px -18px rgba(26,18,16,.35);
    --focus: 0 0 0 3px rgba(224,16,43,.28);
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100%; display:flex; justify-content:center; padding:20px 14px 60px;
  }
  .stack{ width:100%; max-width:1040px; display:flex; flex-direction:column; gap:16px; }
  .stack.narrow{ max-width:640px; }

  .masthead{ display:flex; align-items:center; gap:12px; border-bottom:3px solid var(--ink); padding-bottom:12px; }
  .mark{ flex:none; width:40px; height:40px; border-radius:8px; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; text-decoration:none; cursor:pointer; }
  .masthead-text{ flex:1; min-width:0; }
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin:0 0 2px; }
  .title{ font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; font-weight:700; font-size:20px; line-height:1.15; margin:0; text-wrap:balance; }
  .theme-btn{ flex:none; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .theme-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{ outline:none; box-shadow:var(--focus); }

  .lede{ font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:var(--card-shadow); padding:22px; }
  .panel{ background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:var(--card-shadow); padding:22px; }
  .panel h2{ font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; font-size:19px; margin:0 0 8px; }

  a.book-card{ display:flex; gap:16px; align-items:flex-start; background:var(--paper-2); border:1.5px solid var(--line); border-radius:16px; padding:20px; text-decoration:none; color:inherit; cursor:pointer; }
  a.book-card:hover{ border-color:var(--red); }
  .book-badge{ flex:none; width:48px; height:48px; border-radius:12px; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; font-family:Georgia,serif; }
  .book-body{ flex:1; min-width:0; }
  .book-title{ font-family:Georgia,serif; font-weight:700; font-size:18px; margin:0 0 4px; }
  .book-desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0; }

  .test-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .test-tile{ border:1.5px solid var(--line); background:var(--paper-2); border-radius:14px; padding:16px; text-align:left; cursor:pointer; color:inherit; font-family:inherit; }
  .test-tile:hover:not(:disabled){ border-color:var(--red); }
  .test-tile:disabled{ opacity:.5; cursor:default; }
  .test-tile b{ display:block; font-size:15.5px; margin-bottom:4px; font-family:Georgia,serif; }
  .test-tile span{ font-size:12.5px; color:var(--ink-soft); }
  .soon-chip{ display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; background:var(--amber-bg); color:var(--amber); padding:3px 8px; border-radius:99px; }

  .btn{ padding:12px 18px; border-radius:10px; font-weight:700; font-size:14.5px; cursor:pointer; border:none; }
  .btn-primary{ background:var(--red); color:#fff; }
  .btn-primary:hover{ opacity:.9; }
  .btn-ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--ink-soft); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn:disabled{ opacity:.45; cursor:default; }

  label.check-row{ display:flex; align-items:flex-start; gap:8px; font-size:13.5px; color:var(--ink-soft); cursor:pointer; }

  /* ---- test intro ---- */
  .meta-row{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 16px; }
  .meta-chip{ font-size:12px; font-weight:700; background:var(--paper-2); border:1px solid var(--line); border-radius:99px; padding:5px 12px; color:var(--ink-soft); }

  /* ---- reading layout ---- */
  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:10px 14px; position:sticky; top:8px; z-index:10; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab-btn{ border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft); font-size:13px; font-weight:700; padding:7px 13px; border-radius:99px; cursor:pointer; }
  .tab-btn.active{ border-color:var(--red); color:var(--red); }
  .toolbar .spacer{ flex:1; }
  .timer{ font-variant-numeric:tabular-nums; font-weight:800; font-size:14px; color:var(--ink-soft); }
  .timer.low{ color:var(--red); }
  .progress-mini{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }

  .split{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .pane{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:20px; max-height:calc(100vh - 150px); overflow-y:auto; }
  @media (max-width:640px){
    .split{ grid-template-columns:1fr; }
    .pane.passage-pane{ position:sticky; top:96px; max-height:36vh; z-index:5; }
    .pane.question-pane{ max-height:none; }
  }

  .passage-title{ font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; font-weight:700; font-size:21px; margin:0 0 4px; text-wrap:balance; }
  .passage-subtitle{ font-size:13.5px; font-style:italic; color:var(--ink-soft); margin:0 0 16px; line-height:1.5; }
  .passage-para{ font-size:15px; line-height:1.7; margin:0 0 14px; color:var(--ink); }
  .para-letter{ font-weight:800; color:var(--red); margin-right:6px; }

  .qgroup{ margin-bottom:26px; }
  .qgroup-title{ font-weight:800; font-size:14px; margin:0 0 4px; }
  .qgroup-instructions{ font-size:13px; color:var(--ink-soft); line-height:1.6; margin:0 0 12px; white-space:pre-line; }
  .qgroup-box-title{ font-family:Georgia,serif; font-weight:700; font-size:15.5px; margin:0 0 10px; }
  .tfng-hint{ font-size:12px; color:var(--ink-soft); margin:0 0 12px; line-height:1.6; }
  .tfng-hint b{ color:var(--ink); }

  .qitem{ margin-bottom:16px; padding-bottom:14px; border-bottom:1px dashed var(--line); }
  .qitem:last-child{ border-bottom:none; }
  .qnum{ font-weight:800; color:var(--red-ink); margin-right:6px; }
  .qtext{ font-size:14px; line-height:1.55; margin:0 0 8px; }
  .opt-row{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .opt-label{ display:flex; align-items:flex-start; gap:8px; font-size:13.5px; line-height:1.5; cursor:pointer; padding:6px 8px; border-radius:8px; border:1px solid transparent; }
  .opt-label:hover{ background:var(--paper-2); }
  .opt-label input{ margin-top:3px; flex:none; }
  .radio-inline{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-pill{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; border:1.5px solid var(--line); border-radius:99px; padding:6px 12px; cursor:pointer; color:var(--ink-soft); }
  .radio-pill input{ display:none; }
  .radio-pill.checked{ border-color:var(--red); color:var(--red); background:var(--amber-bg); }

  .fillbox{ display:inline-flex; align-items:center; gap:6px; }
  .fillbox input[type=text]{ width:130px; padding:6px 8px; border:1.5px solid var(--line); border-radius:8px; background:var(--paper-2); color:var(--ink); font-size:13.5px; }
  .fillbox input[type=text]:focus{ border-color:var(--red); }
  select.bank-select{ padding:6px 8px; border:1.5px solid var(--line); border-radius:8px; background:var(--paper-2); color:var(--ink); font-size:13.5px; }
  .summary-block{ font-size:14.5px; line-height:2.1; }
  .bank-list{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  .bank-chip{ font-size:12.5px; font-weight:600; background:var(--paper-2); border:1px solid var(--line); border-radius:99px; padding:5px 11px; }

  .notes-title{ font-family:Georgia,serif; font-weight:700; font-size:16px; margin:0 0 10px; text-align:center; }
  .note-item{ margin-bottom:10px; font-size:14.5px; line-height:1.7; }
  .note-item .fillbox input{ width:150px; }

  /* ---- result ---- */
  .score-tile{ display:flex; align-items:center; gap:20px; }
  .score-num{ font-family:Georgia,serif; font-weight:800; font-size:46px; color:var(--red); }
  .score-band{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
  .review-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .review-row:last-child{ border-bottom:none; }
  .review-badge{ flex:none; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; }
  .review-badge.ok{ background:var(--green-bg); color:var(--green); }
  .review-badge.bad{ background:var(--amber-bg); color:var(--amber); }
  .review-body{ flex:1; min-width:0; }
  .review-body .q{ color:var(--ink-soft); font-size:12.5px; margin:0 0 2px; }
  .review-body .a{ margin:0; }
  .review-body .correct-answer{ color:var(--ink-soft); font-size:12.5px; margin-top:2px; }

  /* ---- vocab flashcards ---- */
  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .filter-chip{ border:1.5px solid var(--line); background:var(--paper-2); color:var(--ink-soft); font-size:12.5px; font-weight:700; padding:6px 13px; border-radius:99px; cursor:pointer; }
  .filter-chip.active{ border-color:var(--red); color:var(--red); }

  .flash{ background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:var(--card-shadow); padding:32px 24px; text-align:center; cursor:pointer; min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .flash-src{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); background:var(--paper-2); border-radius:99px; padding:4px 10px; }
  .flash-word{ font-family:Georgia,serif; font-weight:800; font-size:30px; }
  .flash-ipa{ font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:14px; color:var(--red-ink); }
  .flash-pos{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }
  .flash-hint{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .flash-meaning{ font-size:19px; font-weight:700; color:var(--red-ink); }
  .flash-sentence{ font-size:14px; line-height:1.6; color:var(--ink); max-width:440px; }
  .flash-sentence-vi{ font-size:12.5px; line-height:1.6; color:var(--ink-soft); font-style:italic; max-width:440px; }

  .vocab-progress{ display:flex; align-items:center; gap:10px; }
  .vocab-progress-track{ flex:1; height:6px; border-radius:99px; background:var(--paper-2); overflow:hidden; border:1px solid var(--line); }
  .vocab-progress-fill{ height:100%; background:var(--red); transition:width .3s ease; }
  .vocab-progress-meta{ font-size:12px; font-weight:700; color:var(--ink-soft); white-space:nowrap; }

  .footer-note{ text-align:center; font-size:11.5px; color:var(--ink-soft); line-height:1.6; }
  .hidden{ display:none !important; }
  .crumb{ background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; padding:0; text-decoration:underline; }
</style>
</head>
<body>
<div class="stack" id="stack">
  <header class="masthead">
    <a class="mark" id="homeLink" aria-label="Về trang chủ">AZ</a>
    <div class="masthead-text">
      <p class="eyebrow">AZEnglish · Reading Trainer</p>
      <h1 class="title" id="pageTitle">Luyện Reading theo sách Cambridge IELTS</h1>
    </div>
    <button class="theme-btn" id="themeBtn" title="Đổi giao diện sáng/tối">◐</button>
  </header>

  <main id="app"></main>

  <p class="footer-note">Nội dung trích từ <em>Cambridge IELTS 19</em> (Test 1–4), dùng nội bộ cho mục đích giảng dạy tại AZEnglish.<br/>Tiến độ &amp; kết quả lưu trên trình duyệt này (localStorage), không đồng bộ giữa các thiết bị.</p>
</div>

<script src="./data/cambridge19-test1.js"></script>
<script src="./data/cambridge19-test2.js"></script>
<script src="./data/cambridge19-test3.js"></script>
<script src="./data/cambridge19-test4.js"></script>
<script>
(function(){
  "use strict";
  var STORAGE_KEY = "az_reading_trainer_v1";

  var TESTS_REGISTRY = [
    {id:"cambridge19-test1", available:true},
    {id:"cambridge19-test2", available:true},
    {id:"cambridge19-test3", available:true},
    {id:"cambridge19-test4", available:true},
  ];

  function getData(id){ return (window.AZ_READING_DATA || {})[id]; }

  function totalQuestions(d){
    var total = 0;
    d.questionGroups.forEach(function(g){
      if(g.type === "multi") total += g.range.length;
      else if(g.type === "fill") total += g.items ? g.items.length : g.summary.filter(function(s){return s.blank;}).length;
      else if(g.type === "bank_fill") total += g.summary.filter(function(s){return s.blank;}).length;
      else total += g.items.length;
    });
    return total;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {attempts:{}, vocab:{}};
  }
  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){} }
  var STATE = loadState();

  var app = document.getElementById("app");
  var pageTitle = document.getElementById("pageTitle");
  var homeLink = document.getElementById("homeLink");
  var themeBtn = document.getElementById("themeBtn");

  homeLink.addEventListener("click", function(){ location.hash = "#/home"; });
  themeBtn.addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var curEffective = cur || (sysDark ? "dark" : "light");
    var next = curEffective === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem(STORAGE_KEY + "_theme", next); }catch(e){}
  });
  (function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem(STORAGE_KEY + "_theme"); }catch(e){}
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  })();

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function esc(s){
    return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; });
  }

  // ---------- routing ----------
  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", render);

  function parseHash(){
    var h = location.hash.replace(/^#\//, "");
    var parts = h.split("/").filter(Boolean);
    return parts;
  }

  function render(){
    var parts = parseHash();
    if(parts.length === 0 || parts[0] === "home"){ pageTitle.textContent = "Luyện Reading theo sách Cambridge IELTS"; return renderHome(); }
    if(parts[0] === "test" && parts[1] && parts[2] === "intro"){ return renderIntro(parts[1]); }
    if(parts[0] === "test" && parts[1] && parts[2] === "take"){ return renderTake(parts[1]); }
    if(parts[0] === "test" && parts[1] && parts[2] === "result"){ return renderResult(parts[1]); }
    if(parts[0] === "vocab" && parts[1]){ return renderVocab(parts[1]); }
    location.hash = "#/home";
  }

  // ---------- HOME ----------
  function renderHome(){
    app.innerHTML = "";
    var lede = el("p", "lede", "Chọn sách rồi chọn Test để luyện Reading — tự chấm điểm ngay khi nộp bài, sau đó ôn lại từ vựng lấy đúng trong bài vừa làm.");
    app.appendChild(lede);

    var book = el("a", "book-card");
    book.href = "#/test/cambridge19-test1/intro";
    book.innerHTML =
      '<div class="book-badge">C19</div>' +
      '<div class="book-body">' +
        '<div class="book-title">Cambridge IELTS 19 — Academic</div>' +
        '<p class="book-desc">4 test, mỗi test 3 bài đọc / 40 câu hỏi.</p>' +
        '<div class="test-grid" style="margin-top:14px"></div>' +
      '</div>';
    var grid = book.querySelector(".test-grid");
    TESTS_REGISTRY.forEach(function(t){
      var d = getData(t.id);
      var tile = document.createElement(t.available ? "a" : "div");
      tile.className = "test-tile";
      if(t.available){
        tile.href = "#/test/" + t.id + "/intro";
        var attempt = STATE.attempts[t.id];
        tile.innerHTML = "<b>" + esc(d.test) + "</b><span>" + d.passages.length + " bài đọc &middot; " + totalQuestions(d) + " câu &middot; " + d.durationMin + " phút</span>" +
          (attempt ? '<div class="soon-chip" style="background:var(--green-bg);color:var(--green)">Đã làm: ' + attempt.score + '/40</div>' : "");
      } else {
        tile.setAttribute("disabled","disabled");
        tile.innerHTML = "<b>" + (t.label||t.id) + "</b><span>3 bài đọc &middot; 40 câu &middot; 60 phút</span><div class='soon-chip'>Sắp có</div>";
      }
      grid.appendChild(tile);
    });
    app.appendChild(book);
  }

  // ---------- TEST INTRO ----------
  function renderIntro(testId){
    var d = getData(testId);
    if(!d){ location.hash = "#/home"; return; }
    pageTitle.textContent = d.book + " — " + d.test;
    app.innerHTML = "";
    var panel = el("div", "panel");
    var totalQ = totalQuestions(d);
    panel.innerHTML =
      '<h2>' + esc(d.test) + ' &middot; Reading</h2>' +
      '<p class="desc" style="color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:0 0 4px">Làm 3 bài đọc theo đúng cấu trúc đề thi thật. Mỗi bài có nhiều dạng câu hỏi khác nhau (Đúng/Sai/Không có thông tin, điền từ, nối đoạn, chọn đáp án&hellip;). Nộp bài để xem điểm và đáp án ngay, sau đó có thể ôn lại từ vựng của 3 bài vừa đọc.</p>' +
      '<div class="meta-row">' +
        '<span class="meta-chip">' + d.passages.length + ' bài đọc</span>' +
        '<span class="meta-chip">' + totalQ + ' câu hỏi</span>' +
        '<span class="meta-chip">' + d.durationMin + ' phút</span>' +
      '</div>' +
      '<label class="check-row" style="margin-bottom:16px"><input type="checkbox" id="timerToggle" checked/> Tính giờ ' + d.durationMin + ' phút khi làm bài</label>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="startBtn">Bắt đầu làm bài</button>' +
        '<a class="btn btn-ghost" href="#/home" style="text-decoration:none;display:inline-flex;align-items:center">Về trang chủ</a>' +
      '</div>';
    app.appendChild(panel);
    document.getElementById("startBtn").addEventListener("click", function(){
      var useTimer = document.getElementById("timerToggle").checked;
      sessionStorage.setItem("az_rt_timer_" + testId, useTimer ? "1" : "0");
      sessionStorage.setItem("az_rt_start_" + testId, String(Date.now()));
      location.hash = "#/test/" + testId + "/take";
    });
  }

  // ---------- TAKE TEST ----------
  var takeCtx = null; // {testId, data, answers, activePassage, timerInterval}

  function renderTake(testId){
    var d = getData(testId);
    if(!d){ location.hash = "#/home"; return; }
    pageTitle.textContent = d.book + " — " + d.test;

    if(takeCtx && takeCtx.timerInterval) clearInterval(takeCtx.timerInterval);
    var saved = STATE.attempts[testId];
    takeCtx = {
      testId: testId, data: d,
      answers: (saved && saved.inProgress) ? saved.inProgress : {},
      activePassage: 1,
      timerInterval: null,
      useTimer: sessionStorage.getItem("az_rt_timer_" + testId) !== "0",
      startedAt: Number(sessionStorage.getItem("az_rt_start_" + testId)) || Date.now(),
    };

    app.innerHTML = "";

    var toolbar = el("div", "toolbar");
    var tabs = el("div", "tabs");
    d.passages.forEach(function(p){
      var b = el("button", "tab-btn" + (p.num===1?" active":""), "Bài " + p.num);
      b.addEventListener("click", function(){ takeCtx.activePassage = p.num; renderTakeBody(); });
      b.dataset.passage = p.num;
      tabs.appendChild(b);
    });
    toolbar.appendChild(tabs);

    toolbar.appendChild(el("div","spacer"));
    var progressMini = el("span", "progress-mini", "");
    toolbar.appendChild(progressMini);
    var timerEl = el("span", "timer", "");
    toolbar.appendChild(timerEl);
    var submitBtn = el("button", "btn btn-primary", "Nộp bài");
    submitBtn.style.padding = "8px 16px";
    submitBtn.style.fontSize = "13.5px";
    submitBtn.addEventListener("click", function(){ submitTest(); });
    toolbar.appendChild(submitBtn);

    app.appendChild(toolbar);
    var body = el("div", "split");
    body.id = "takeBody";
    app.appendChild(body);

    takeCtx.progressMini = progressMini;
    takeCtx.timerEl = timerEl;

    renderTakeBody();
    updateProgress();

    if(takeCtx.useTimer){
      takeCtx.timerInterval = setInterval(updateTimer, 1000);
      updateTimer();
    } else {
      timerEl.textContent = "Không tính giờ";
    }

    function updateTimer(){
      var elapsedSec = Math.floor((Date.now() - takeCtx.startedAt)/1000);
      var remain = d.durationMin*60 - elapsedSec;
      if(remain < 0) remain = 0;
      var m = Math.floor(remain/60), s = remain%60;
      takeCtx.timerEl.textContent = "⏱ " + m + ":" + (s<10?"0":"")+s;
      takeCtx.timerEl.classList.toggle("low", remain <= 300);
      if(remain === 0 && takeCtx.timerInterval){ clearInterval(takeCtx.timerInterval); takeCtx.timerEl.textContent = "⏱ Hết giờ"; }
    }
  }

  function updateProgress(){
    var d = takeCtx.data;
    var total = totalQuestions(d);
    var answered = 0;
    d.questionGroups.forEach(function(g){
      if(g.type==="multi"){
        var key = g.range.join("_");
        var sel = takeCtx.answers[key] || [];
        answered += sel.length;
      } else if(g.type==="tfng" || g.type==="match_single" || g.type==="mcq"){
        g.items.forEach(function(it){ if(takeCtx.answers[it.num]) answered++; });
      } else if(g.type==="fill"){
        if(g.summary){
          g.summary.forEach(function(seg){ if(seg.blank && takeCtx.answers[seg.blank] && takeCtx.answers[seg.blank].trim()) answered++; });
        } else {
          (g.items||[]).forEach(function(it){ if(takeCtx.answers[it.num] && takeCtx.answers[it.num].trim()) answered++; });
        }
      } else if(g.type==="bank_fill"){
        g.summary.forEach(function(seg){ if(seg.blank && takeCtx.answers[seg.blank]) answered++; });
      }
    });
    takeCtx.progressMini.textContent = "Đã trả lời " + answered + "/" + total;

    STATE.attempts[takeCtx.testId] = Object.assign({}, STATE.attempts[takeCtx.testId], {inProgress: takeCtx.answers});
    saveState();
  }

  function renderTakeBody(){
    var d = takeCtx.data;
    var body = document.getElementById("takeBody");
    body.innerHTML = "";
    // sync tab active state
    document.querySelectorAll(".tabs .tab-btn").forEach(function(b){
      b.classList.toggle("active", Number(b.dataset.passage) === takeCtx.activePassage);
    });

    var passage = d.passages[takeCtx.activePassage-1];

    var leftPane = el("div", "pane passage-pane");
    leftPane.appendChild(el("h2","passage-title", "Passage " + passage.num + ": " + esc(passage.title)));
    if(passage.subtitle) leftPane.appendChild(el("p","passage-subtitle", esc(passage.subtitle)));
    passage.paragraphs.forEach(function(p){
      var t = typeof p === "string" ? p : p.text;
      var letter = typeof p === "string" ? "" : ('<span class="para-letter">' + p.letter + '</span>');
      leftPane.appendChild(el("p","passage-para", letter + esc(t)));
    });

    var rightPane = el("div", "pane question-pane");
    d.questionGroups.filter(function(g){ return groupPassageNum(g) === passage.num; }).forEach(function(g){
      rightPane.appendChild(renderGroup(g, d, false));
    });

    body.appendChild(leftPane);
    body.appendChild(rightPane);
  }

  function groupPassageNum(g){
    // map question ranges to passage: 1-13 => P1, 14-26 => P2, 27-40 => P3
    var start = g.range[0];
    if(start <= 13) return 1;
    if(start <= 26) return 2;
    return 3;
  }

  function renderGroup(g, d, reviewMode){
    var wrap = el("div", "qgroup");
    wrap.appendChild(el("p","qgroup-title", esc(g.title)));
    if(g.instructions) wrap.appendChild(el("p","qgroup-instructions", esc(g.instructions)));

    if(g.type === "tfng"){
      if(g.labelHint){
        var hint = g.labelHint.map(function(pair){ return "<b>"+pair[0]+"</b> — " + esc(pair[1]); }).join("<br/>");
        wrap.appendChild(el("p","tfng-hint", hint));
      }
      g.items.forEach(function(it){
        var item = el("div","qitem");
        item.appendChild(el("p","qtext","<span class='qnum'>"+it.num+".</span>"+esc(it.text)));
        var radios = el("div","radio-inline");
        g.labels.forEach(function(lab){
          radios.appendChild(makeRadioPill(it.num, lab, reviewMode));
        });
        item.appendChild(radios);
        if(reviewMode) item.appendChild(reviewLine(it.num, d));
        wrap.appendChild(item);
      });
    }

    else if(g.type === "match_single"){
      if(g.options.some(function(o){ return o.text; })){
        var msLegend = el("div","bank-list");
        g.options.forEach(function(o){ msLegend.appendChild(el("span","bank-chip", "<b>"+o.letter+"</b> "+esc(o.text||""))); });
        wrap.appendChild(msLegend);
      }
      g.items.forEach(function(it){
        var item = el("div","qitem");
        item.appendChild(el("p","qtext","<span class='qnum'>"+it.num+".</span>"+esc(it.text)));
        var radios = el("div","radio-inline");
        g.options.forEach(function(o){ radios.appendChild(makeRadioPill(it.num, o.letter, reviewMode)); });
        item.appendChild(radios);
        if(reviewMode) item.appendChild(reviewLine(it.num, d));
        wrap.appendChild(item);
      });
    }

    else if(g.type === "mcq"){
      g.items.forEach(function(it){
        var item = el("div","qitem");
        item.appendChild(el("p","qtext","<span class='qnum'>"+it.num+".</span>"+esc(it.text)));
        var optRow = el("div","opt-row");
        it.options.forEach(function(o){
          var label = el("label","opt-label");
          var checked = takeCtx.answers[it.num] === o.letter;
          label.innerHTML = '<input type="radio" name="q'+it.num+'" value="'+o.letter+'" '+(checked?'checked':'')+(reviewMode?' disabled':'')+'/> <span><b>'+o.letter+'.</b> '+esc(o.text)+'</span>';
          if(!reviewMode){
            label.querySelector("input").addEventListener("change", function(){ takeCtx.answers[it.num] = o.letter; updateProgress(); });
          }
          optRow.appendChild(label);
        });
        item.appendChild(optRow);
        if(reviewMode) item.appendChild(reviewLine(it.num, d));
        wrap.appendChild(item);
      });
    }

    else if(g.type === "multi"){
      var key = g.range.join("_");
      wrap.appendChild(el("p","qtext","<b>Câu "+g.range[0]+" &amp; "+g.range[1]+".</b>"));
      var optRow = el("div","opt-row");
      g.options.forEach(function(o){
        var label = el("label","opt-label");
        var sel = takeCtx.answers[key] || [];
        var checked = sel.indexOf(o.letter) !== -1;
        label.innerHTML = '<input type="checkbox" value="'+o.letter+'" '+(checked?'checked':'')+(reviewMode?' disabled':'')+'/> <span><b>'+o.letter+'.</b> '+esc(o.text)+'</span>';
        if(!reviewMode){
          label.querySelector("input").addEventListener("change", function(e){
            var arr = (takeCtx.answers[key] || []).slice();
            var v = e.target.value;
            if(e.target.checked){
              if(arr.length >= g.k){ e.target.checked = false; return; }
              arr.push(v);
            } else {
              arr = arr.filter(function(x){ return x!==v; });
            }
            takeCtx.answers[key] = arr;
            updateProgress();
          });
        }
        optRow.appendChild(label);
      });
      wrap.appendChild(optRow);
      if(reviewMode) wrap.appendChild(reviewLineMulti(g, d));
    }

    else if(g.type === "fill"){
      if(g.boxTitle){
        var box = el("div","card");
        box.appendChild(el("p","notes-title", esc(g.boxTitle)));
        if(g.summary){
          var block = el("div","summary-block");
          var html = "";
          g.summary.forEach(function(seg){
            if(seg.blank){
              html += fillInputHtml(seg.blank, reviewMode);
            } else {
              html += esc(seg.text) + " ";
            }
          });
          block.innerHTML = html;
          box.appendChild(block);
        } else {
          g.items.forEach(function(it){
            var line = el("p","note-item");
            line.innerHTML = "<b>"+it.num+".</b> " + esc(it.before) + " " + fillInputHtml(it.num, reviewMode) + " " + esc(it.after);
            box.appendChild(line);
          });
        }
        wrap.appendChild(box);
      } else {
        g.items.forEach(function(it){
          var line = el("p","note-item");
          line.innerHTML = "<b>"+it.num+".</b> " + esc(it.before) + " " + fillInputHtml(it.num, reviewMode) + " " + esc(it.after);
          wrap.appendChild(line);
        });
      }
      if(reviewMode){
        var revBox = el("div", "", "");
        (g.items || []).forEach(function(it){ revBox.appendChild(reviewLine(it.num, d)); });
        if(g.summary){ g.summary.forEach(function(seg){ if(seg.blank) revBox.appendChild(reviewLine(seg.blank, d)); }); }
        wrap.appendChild(revBox);
      }
      bindFillInputs(wrap, reviewMode);
    }

    else if(g.type === "bank_fill"){
      var box2 = el("div","card");
      box2.appendChild(el("p","notes-title", esc(g.boxTitle)));
      var block2 = el("div","summary-block");
      var html2 = "";
      g.summary.forEach(function(seg){
        if(seg.blank){ html2 += bankSelectHtml(seg.blank, g.bank, reviewMode); }
        else { html2 += esc(seg.text) + " "; }
      });
      block2.innerHTML = html2;
      box2.appendChild(block2);
      var bankList = el("div","bank-list");
      g.bank.forEach(function(o){ bankList.appendChild(el("span","bank-chip", "<b>"+o.letter+"</b> "+esc(o.text))); });
      box2.appendChild(bankList);
      wrap.appendChild(box2);
      if(reviewMode){
        g.summary.forEach(function(seg){ if(seg.blank) wrap.appendChild(reviewLine(seg.blank, d)); });
      }
      bindBankSelects(wrap, reviewMode);
    }

    return wrap;
  }

  function fillInputHtml(num, reviewMode){
    var val = takeCtx.answers[num] || "";
    return '<span class="fillbox"><input type="text" data-num="'+num+'" value="'+esc(val)+'" '+(reviewMode?'disabled':'')+' placeholder="'+num+'"/></span>';
  }
  function bindFillInputs(container, reviewMode){
    if(reviewMode) return;
    container.querySelectorAll('input[type=text][data-num]').forEach(function(inp){
      inp.addEventListener("input", function(){ takeCtx.answers[inp.dataset.num] = inp.value; updateProgress(); });
    });
  }
  function bankSelectHtml(num, bank, reviewMode){
    var val = takeCtx.answers[num] || "";
    var opts = '<option value="">' + num + '</option>' + bank.map(function(o){ return '<option value="'+o.letter+'" '+(val===o.letter?'selected':'')+'>'+o.letter+' — '+esc(o.text)+'</option>'; }).join("");
    return '<select class="bank-select" data-num="'+num+'" '+(reviewMode?'disabled':'')+'>'+opts+'</select> ';
  }
  function bindBankSelects(container, reviewMode){
    if(reviewMode) return;
    container.querySelectorAll('select.bank-select[data-num]').forEach(function(sel){
      sel.addEventListener("change", function(){ takeCtx.answers[sel.dataset.num] = sel.value; updateProgress(); });
    });
  }

  function makeRadioPill(num, label, reviewMode){
    var pill = el("label","radio-pill");
    var checked = takeCtx.answers[num] === label;
    pill.classList.toggle("checked", checked);
    pill.innerHTML = '<input type="radio" name="q'+num+'" value="'+label+'" '+(checked?'checked':'')+(reviewMode?' disabled':'')+'/>'+label;
    if(!reviewMode){
      pill.querySelector("input").addEventListener("change", function(){
        takeCtx.answers[num] = label;
        pill.parentNode.querySelectorAll(".radio-pill").forEach(function(p){ p.classList.remove("checked"); });
        pill.classList.add("checked");
        updateProgress();
      });
    }
    return pill;
  }

  function normAns(s){ return String(s||"").trim().toLowerCase(); }
  function fillCorrect(userVal, correctVal){
    var alts = String(correctVal).split("/").map(normAns);
    return alts.indexOf(normAns(userVal)) !== -1;
  }

  function reviewLine(num, d){
    var correct = d.answerKey[num];
    var user = takeCtx.answers[num];
    var isFill = typeof correct === "string" && !/^[A-J]$/.test(correct) && correct.length > 1 && !["TRUE","FALSE","NOT GIVEN","YES","NO"].includes(correct);
    var ok = isFill ? fillCorrect(user, correct) : (normAns(user) === normAns(correct));
    var row = el("div","review-row");
    row.innerHTML = '<span class="review-badge '+(ok?'ok':'bad')+'">'+(ok?'✓':'✗')+'</span>' +
      '<div class="review-body"><p class="q">Câu '+num+'</p>' +
      '<p class="a">Bạn chọn: <b>'+esc(user||"(bỏ trống)")+'</b></p>' +
      (ok? '' : '<p class="correct-answer">Đáp án đúng: '+esc(correct.replace("/", " / "))+'</p>') +
      '</div>';
    return row;
  }
  function reviewLineMulti(g, d){
    var key = g.range.join("_");
    var correct = d.answerKey[key];
    var user = takeCtx.answers[key] || [];
    var correctCount = user.filter(function(x){ return correct.indexOf(x)!==-1; }).length;
    var full = user.length===2 && correctCount===2;
    var row = el("div","review-row");
    row.innerHTML = '<span class="review-badge '+(full?'ok':'bad')+'">'+(full?'✓':correctCount+'/2')+'</span>' +
      '<div class="review-body"><p class="q">Câu '+g.range[0]+' &amp; '+g.range[1]+'</p>' +
      '<p class="a">Bạn chọn: <b>'+esc(user.join(", ")||"(bỏ trống)")+'</b></p>' +
      (full? '' : '<p class="correct-answer">Đáp án đúng: '+correct.join(" &amp; ")+'</p>') +
      '</div>';
    return row;
  }

  function scoreTest(d, answers){
    var score = 0;
    d.questionGroups.forEach(function(g){
      if(g.type === "multi"){
        var key = g.range.join("_");
        var correct = d.answerKey[key];
        var user = answers[key] || [];
        user.forEach(function(v){ if(correct.indexOf(v)!==-1) score++; });
      } else if(g.type==="tfng" || g.type==="match_single" || g.type==="mcq"){
        g.items.forEach(function(it){
          var correct = d.answerKey[it.num];
          if(normAns(answers[it.num]) === normAns(correct)) score++;
        });
      } else if(g.type==="fill"){
        var nums = g.items ? g.items.map(function(it){return it.num;}) : g.summary.filter(function(s){return s.blank;}).map(function(s){return s.blank;});
        nums.forEach(function(num){
          if(fillCorrect(answers[num], d.answerKey[num])) score++;
        });
      } else if(g.type==="bank_fill"){
        g.summary.forEach(function(seg){
          if(seg.blank){ if(normAns(answers[seg.blank]) === normAns(d.answerKey[seg.blank])) score++; }
        });
      }
    });
    return score;
  }

  function submitTest(){
    if(takeCtx.timerInterval) clearInterval(takeCtx.timerInterval);
    var d = takeCtx.data;
    var score = scoreTest(d, takeCtx.answers);
    STATE.attempts[takeCtx.testId] = {
      answers: takeCtx.answers, score: score, total: totalQuestions(d),
      submittedAt: Date.now(),
    };
    saveState();
    location.hash = "#/test/" + takeCtx.testId + "/result";
  }

  // ---------- RESULT ----------
  function renderResult(testId){
    var d = getData(testId);
    var attempt = STATE.attempts[testId];
    if(!d || !attempt){ location.hash = "#/test/" + testId + "/intro"; return; }
    pageTitle.textContent = d.book + " — Kết quả " + d.test;
    takeCtx = {testId:testId, data:d, answers:attempt.answers};

    app.innerHTML = "";
    var band = d.scoreBands.find(function(b){ return attempt.score>=b[0] && attempt.score<=b[1]; });
    var top = el("div","panel");
    top.innerHTML = '<div class="score-tile">' +
      '<div class="score-num">'+attempt.score+'<span style="font-size:20px;color:var(--ink-soft)">/'+attempt.total+'</span></div>' +
      '<div class="score-band">'+ (band ? esc(band[2]) : "") +'</div>' +
      '</div>' +
      '<div class="btn-row" style="margin-top:16px">' +
        '<button class="btn btn-primary" id="vocabBtn">Ôn từ vựng 3 bài vừa làm</button>' +
        '<a class="btn btn-ghost" href="#/test/'+testId+'/intro" style="text-decoration:none;display:inline-flex;align-items:center">Làm lại</a>' +
        '<a class="btn btn-ghost" href="#/home" style="text-decoration:none;display:inline-flex;align-items:center">Trang chủ</a>' +
      '</div>';
    app.appendChild(top);
    document.getElementById("vocabBtn").addEventListener("click", function(){ location.hash = "#/vocab/" + testId; });

    d.passages.forEach(function(passage){
      var sec = el("div","panel");
      sec.appendChild(el("h2", null, "Passage " + passage.num + " — " + esc(passage.title)));
      d.questionGroups.filter(function(g){ return groupPassageNum(g)===passage.num; }).forEach(function(g){
        var block = el("div","qgroup");
        block.appendChild(el("p","qgroup-title", esc(g.title)));
        if(g.type === "multi"){
          block.appendChild(reviewLineMulti(g, d));
        } else if(g.type === "fill" && g.summary){
          g.summary.forEach(function(seg){ if(seg.blank) block.appendChild(reviewLine(seg.blank, d)); });
        } else if(g.type === "bank_fill"){
          g.summary.forEach(function(seg){ if(seg.blank) block.appendChild(reviewLine(seg.blank, d)); });
        } else {
          (g.items||[]).forEach(function(it){ block.appendChild(reviewLine(it.num, d)); });
        }
        sec.appendChild(block);
      });
      app.appendChild(sec);
    });
  }

  // ---------- VOCAB FLASHCARDS ----------
  var vocabCtx = null;
  function renderVocab(testId){
    var d = getData(testId);
    if(!d){ location.hash = "#/home"; return; }
    pageTitle.textContent = d.book + " — Ôn từ vựng";
    vocabCtx = { testId: testId, data: d, filter: "all", onlyReview:false, idx: 0, flipped: false };
    renderVocabScreen();
  }

  function vocabWordId(testId, word){ return testId + "::" + word; }
  function vocabStatus(testId, word){ return (STATE.vocab || {})[vocabWordId(testId, word)]; }
  function setVocabStatus(testId, word, status){
    STATE.vocab = STATE.vocab || {};
    STATE.vocab[vocabWordId(testId, word)] = status;
    saveState();
  }

  function currentVocabList(){
    var d = vocabCtx.data;
    var list = d.vocab;
    if(vocabCtx.filter !== "all") list = list.filter(function(w){ return w.passage === Number(vocabCtx.filter); });
    if(vocabCtx.onlyReview) list = list.filter(function(w){ return vocabStatus(vocabCtx.testId, w.word) === "review"; });
    return list;
  }

  function renderVocabScreen(){
    app.innerHTML = "";
    var d = vocabCtx.data;
    var list = currentVocabList();
    if(vocabCtx.idx >= list.length) vocabCtx.idx = 0;

    var panel = el("div","panel");
    var filterRow = el("div","filter-row");
    var filters = [["all","Tất cả"],["1","Bài 1"],["2","Bài 2"],["3","Bài 3"]];
    filters.forEach(function(f){
      var chip = el("button","filter-chip"+(vocabCtx.filter===f[0]?" active":""), f[1]);
      chip.addEventListener("click", function(){ vocabCtx.filter=f[0]; vocabCtx.idx=0; vocabCtx.flipped=false; renderVocabScreen(); });
      filterRow.appendChild(chip);
    });
    var reviewChip = el("button","filter-chip"+(vocabCtx.onlyReview?" active":""), "Chỉ từ cần ôn lại");
    reviewChip.addEventListener("click", function(){ vocabCtx.onlyReview=!vocabCtx.onlyReview; vocabCtx.idx=0; vocabCtx.flipped=false; renderVocabScreen(); });
    filterRow.appendChild(reviewChip);
    panel.appendChild(filterRow);

    var known = d.vocab.filter(function(w){ return vocabStatus(vocabCtx.testId, w.word)==="known"; }).length;
    var progWrap = el("div","vocab-progress");
    progWrap.style.marginTop = "14px";
    progWrap.innerHTML = '<div class="vocab-progress-track"><div class="vocab-progress-fill" style="width:'+Math.round(known/d.vocab.length*100)+'%"></div></div>' +
      '<span class="vocab-progress-meta">'+known+'/'+d.vocab.length+' đã nhớ</span>';
    panel.appendChild(progWrap);
    app.appendChild(panel);

    if(list.length === 0){
      var empty = el("div","panel");
      empty.innerHTML = "<p class='lede'>Không có từ nào trong bộ lọc này &mdash; thử bỏ chọn &ldquo;Chỉ từ cần ôn lại&rdquo;.</p>";
      app.appendChild(empty);
      return;
    }

    var w = list[vocabCtx.idx];
    var flash = el("div","flash");
    if(!vocabCtx.flipped){
      flash.innerHTML =
        '<span class="flash-src">Bài '+w.passage+' &middot; '+w.pos+' &middot; '+w.level+'</span>' +
        '<div class="flash-word">'+esc(w.word)+'</div>' +
        '<div class="flash-ipa">/'+esc(w.ipa)+'/</div>' +
        '<div class="flash-hint">Bấm để xem nghĩa</div>';
    } else {
      flash.innerHTML =
        '<span class="flash-src">Bài '+w.passage+' &middot; '+w.pos+'</span>' +
        '<div class="flash-word" style="font-size:24px">'+esc(w.word)+'</div>' +
        '<div class="flash-meaning">'+esc(w.meaning)+'</div>' +
        '<div class="flash-sentence">'+esc(w.sentence).replace("___","<b>"+esc(w.word)+"</b>")+'</div>' +
        '<div class="flash-sentence-vi">'+esc(w.sentenceVi)+'</div>';
    }
    flash.addEventListener("click", function(){ vocabCtx.flipped = !vocabCtx.flipped; renderVocabScreen(); });
    app.appendChild(flash);

    var idxPanel = el("div", "", "");
    idxPanel.style.textAlign = "center";
    idxPanel.style.fontSize = "12.5px";
    idxPanel.style.color = "var(--ink-soft)";
    idxPanel.textContent = (vocabCtx.idx+1) + " / " + list.length;
    app.appendChild(idxPanel);

    var btnRow = el("div","btn-row");
    btnRow.style.marginTop = "6px";
    var reviewBtn = el("button","btn btn-ghost", "Cần ôn lại");
    reviewBtn.style.borderColor = "var(--amber)";
    reviewBtn.style.color = "var(--amber)";
    reviewBtn.addEventListener("click", function(){ setVocabStatus(vocabCtx.testId, w.word, "review"); nextCard(list); });
    var knownBtn = el("button","btn btn-primary", "Đã nhớ");
    knownBtn.style.background = "var(--green)";
    knownBtn.addEventListener("click", function(){ setVocabStatus(vocabCtx.testId, w.word, "known"); nextCard(list); });
    btnRow.appendChild(reviewBtn); btnRow.appendChild(knownBtn);
    app.appendChild(btnRow);

    var navRow = el("div","btn-row");
    var prevBtn = el("button","btn btn-ghost","← Trước");
    prevBtn.addEventListener("click", function(){ vocabCtx.idx = (vocabCtx.idx-1+list.length)%list.length; vocabCtx.flipped=false; renderVocabScreen(); });
    var nextBtn = el("button","btn btn-ghost","Sau →");
    nextBtn.addEventListener("click", function(){ nextCard(list); });
    navRow.appendChild(prevBtn); navRow.appendChild(nextBtn);
    app.appendChild(navRow);

    var backLink = el("a","crumb","← Về kết quả bài thi");
    backLink.href = "#/test/" + vocabCtx.testId + "/result";
    backLink.style.display = "inline-block";
    backLink.style.marginTop = "6px";
    app.appendChild(backLink);
  }
  function nextCard(list){
    vocabCtx.idx = (vocabCtx.idx+1) % list.length;
    vocabCtx.flipped = false;
    renderVocabScreen();
  }

  render();
})();
</script>
</body>
</html>
