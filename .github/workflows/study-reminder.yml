name: Nhắc học (Web Push)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử, không gửi thật (1 = có)"
        default: "0"
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài thư viện
        run: npm install --no-save --no-audit --no-fund firebase-admin@12 web-push@3
      - name: Gửi nhắc học
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          if [ -z "$FIREBASE_SA" ] || [ -z "$VAPID_PRIVATE" ]; then echo "Chưa cài khoá (FIREBASE_SA / VAPID_PRIVATE) — bỏ qua."; exit 0; fi
          node scripts/send-reminders.mjs
