<title>Vocab Crush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Pacifico&display=swap" rel="stylesheet">
<style>
/* Layout: một cột như app hẹn hò trên điện thoại — thanh trên, chip bộ từ, xấp thẻ "hồ sơ từ vựng", 2 nút quẹt, thanh tab dưới. Giao diện đêm khuya cố định (một theme). */
:root{
  --ink:#170D1C; --panel:#241629; --panel2:#30203A; --line:#45304D;
  --text:#FBEFF5; --muted:#B49DB8;
  --flame1:#FF3D7F; --flame2:#FF8A3D; --mint:#36E2B4; --gold:#FFC94D; --bad:#FF5A5A;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,sans-serif;
  --script:"Pacifico","Be Vietnam Pro",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#3A1530 0%,var(--ink) 60%) var(--ink);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fe{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.28em;object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* thanh trên */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:12px 8px;gap:8px}
.logo{font-family:var(--script);font-size:26px;background:linear-gradient(90deg,var(--flame1),var(--flame2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.chips{display:flex;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:4px}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}

/* chọn bộ từ */
.cats{display:flex;gap:6px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.cat.on{border-color:var(--flame1);background:rgba(255,61,127,.16)}
.cat small{color:var(--muted);font-weight:500}

/* xấp thẻ */
.deck{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 18px 40px rgba(0,0,0,.45);will-change:transform;cursor:grab}
.card.under{transform:scale(.94) translateY(14px);filter:brightness(.6);cursor:default;pointer-events:none}
.art{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:32%}
.art .fe,.art .fe-n{width:clamp(130px,42vw,190px);height:clamp(130px,42vw,190px);filter:drop-shadow(0 16px 30px rgba(0,0,0,.4));animation:float 3.2s ease-in-out infinite}
.art .fe-n{font-size:clamp(100px,32vw,150px);display:grid;place-items:center}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.dots{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:5px;z-index:2}
.dots i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}
.dots i.on{background:#fff}
.ctag{position:absolute;top:24px;left:14px;z-index:2;display:flex;align-items:center;gap:4px;background:rgba(10,4,12,.45);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em}
.info{position:absolute;left:0;right:0;bottom:0;padding:70px 18px 18px;background:linear-gradient(to top,rgba(10,4,12,.95) 0%,rgba(10,4,12,.75) 55%,transparent 100%);display:flex;flex-direction:column;gap:6px}
.nm{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nm small{font-family:var(--body);font-weight:500;font-size:22px;opacity:.9}
.meta{font-size:14px;color:#EBDDF0;display:flex;flex-direction:column;gap:3px}
.bio{font-size:17px;line-height:1.5;font-weight:500}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
.hint{font-size:12px;color:var(--muted)}
.say{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;width:max-content}
.stamp{position:absolute;top:58px;padding:4px 12px;border:4px solid;border-radius:10px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.03em;opacity:0;z-index:3;pointer-events:none;white-space:nowrap}
.st-r{left:18px;color:var(--flame1);border-color:var(--flame1);transform:rotate(-14deg)}
.st-l{right:18px;color:var(--mint);border-color:var(--mint);transform:rotate(14deg)}

.controls{display:flex;justify-content:center;align-items:flex-start;gap:56px;padding-block:14px 8px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--muted)}
.rb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:38px;transition:transform .15s}
.rb .fe{width:42px;height:42px}
.rb:active{transform:scale(.88)}
.rb:hover .fe{transform:scale(1.12) rotate(-6deg)}
.rb .fe{transition:transform .2s}
.rb.l{background:radial-gradient(circle at 30% 25%,#45324D,#1D1222);border:2px solid rgba(180,157,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.rb.r{background:linear-gradient(135deg,var(--flame1),var(--flame2));box-shadow:0 8px 28px rgba(255,61,127,.5),inset 0 2px 0 rgba(255,255,255,.3)}
.mean{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 11px;display:flex;flex-direction:column;gap:3px;font-size:14px;line-height:1.45}
.mean .k{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:4px}
.mean b{font-size:17px}
.mean .exr{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.mean .say{padding:4px 9px;flex:none}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px;background:var(--panel);border-radius:22px}
.empty .big{font-size:72px}
.empty h3{margin:0;font-size:20px}
.empty p{margin:0;color:var(--muted);max-width:30ch;line-height:1.5}

.btn{background:linear-gradient(90deg,var(--flame1),var(--flame2));color:#fff;font-weight:800;border-radius:999px;padding:13px 22px;font-size:15px}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}

/* tin nhắn */
.scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
h2{font-size:20px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none;position:relative}
.av b{position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;background:var(--flame1);border:2px solid var(--ink)}
.row .t{flex:1;min-width:0}
.row .n{font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center}
.row .p{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--gold);white-space:nowrap}
.newm{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px}
.newm button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;flex:none}
.newm .av{width:64px;height:64px;font-size:34px;border:2px solid var(--flame1)}
.blank{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.6}

.chathead{display:flex;align-items:center;gap:10px;padding-block:4px 10px;border-bottom:1px solid var(--line)}
.chathead .av{width:42px;height:42px;font-size:24px}
.back{font-size:22px;padding:4px 8px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-block:12px}
.m{max-width:80%;padding:10px 14px;border-radius:18px;line-height:1.45;font-size:15px}
.m.w{background:var(--panel2);align-self:flex-start;border-bottom-left-radius:6px}
.m.me{background:linear-gradient(90deg,var(--flame1),var(--flame2));align-self:flex-end;border-bottom-right-radius:6px;color:#fff;font-weight:500}
.m em{font-style:normal;color:var(--gold);font-weight:700}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-5px)}}
.reply{display:flex;flex-wrap:wrap;gap:8px;padding-block:10px 12px;border-top:1px solid var(--line)}
.qr{border:1.5px solid var(--flame1);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--panel)}
.reply form{display:flex;gap:8px;width:100%}
.reply input{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;color:var(--text);font:inherit}
.done{color:var(--gold);font-weight:700;text-align:center;width:100%;padding:6px}

/* bạn */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.streak{background:linear-gradient(90deg,rgba(255,61,127,.18),rgba(255,138,61,.18));border:1px solid rgba(255,138,61,.4);border-radius:16px;padding:14px;margin-bottom:14px;font-weight:700;line-height:1.5}
.set{margin-bottom:16px}
.set label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;font-weight:700}
.seg{display:flex;background:var(--panel);border-radius:999px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-weight:700;font-size:14px}
.seg button.on{background:linear-gradient(90deg,var(--flame1),var(--flame2));color:#fff}
.exs{display:flex;flex-wrap:wrap;gap:6px}
.exs span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;display:flex;align-items:center;gap:4px}

/* tab dưới */
nav{display:flex;border-top:1px solid var(--line);padding-block:6px max(8px,env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px;position:relative}
nav button .ic{font-size:24px;filter:grayscale(1) opacity(.55);line-height:1}
nav button.on{color:var(--text)} nav button.on .ic{filter:none}
nav .badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--flame1);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}

/* lớp phủ */
.ov{position:fixed;inset:0;z-index:50;background:rgba(12,5,15,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:420px;max-height:100%;overflow-y:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.mt{font-family:var(--script);font-size:clamp(36px,11vw,50px);line-height:1.25;background:linear-gradient(90deg,var(--flame1),var(--flame2));-webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(-4deg)}
.pair{display:flex;justify-content:center}
.pair .av{width:100px;height:100px;font-size:56px;border:3px solid #fff}
.pair .av+.av{margin-left:-16px}
.word{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.02em}
.vi{font-size:22px;font-weight:800}
.ex{color:var(--muted);font-style:italic;line-height:1.5}
.sass{background:var(--panel);border-radius:14px;padding:10px 14px;font-weight:700}
.acts{display:flex;flex-direction:column;gap:10px}
.ob h1{margin:0}
.tag1{color:var(--muted);margin:0;line-height:1.5}
.rules{display:grid;gap:8px;text-align:left}
.rules div{background:var(--panel);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;line-height:1.4}
.rules b{font-size:30px;line-height:1}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 8px;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center}
.pick button span{font-size:32px;line-height:1}
.pick button.on{border-color:var(--flame1);background:rgba(255,61,127,.14)}
.olabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;text-align:left}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#1A0B1E;font-weight:800;padding:11px 16px;border-radius:14px;max-width:min(400px,calc(100% - 32px));text-align:center;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .25s}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}}
.heart{position:fixed;z-index:55;font-size:28px;pointer-events:none;animation:rise 1.6s ease-out forwards}
.heart .fe{width:34px;height:34px}
@keyframes rise{to{transform:translateY(-60vh) rotate(30deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>

<div class="app">
  <div class="top">
    <div class="logo">Vocab Crush</div>
    <div class="chips"><span class="chip" id="streakChip"></span><span class="chip" id="xpChip"></span></div>
  </div>
  <main id="main"></main>
  <nav>
    <button id="tab-swipe" data-tab="swipe"><span class="ic" data-fe="🔥"></span>Quẹt</button>
    <button id="tab-inbox" data-tab="inbox"><span class="ic" data-fe="💬"></span>Tin nhắn<span class="badge" id="badge" hidden>0</span></button>
    <button id="tab-me" data-tab="me"><span class="ic" data-fe="🫶"></span>Bạn</button>
  </nav>
</div>

const FE_LOAD={};
const BLANK_GIF="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
function needFe(e){
  const n=FE_CHUNK[e];if(n==null||FE[e]||FE_LOAD[n])return;
  FE_LOAD[n]=fetch(`fe/${n}.json`).then(r=>r.json()).then(o=>{Object.assign(FE,o);
    document.querySelectorAll("img[data-fw]").forEach(im=>{const u=FE[im.dataset.fw];if(u){im.src=u;im.removeAttribute("data-fw")}})
  }).catch(()=>{document.querySelectorAll("img[data-fw]").forEach(im=>{if(FE_CHUNK[im.dataset.fw]===n)im.outerHTML=`<span class="${im.className.replace("fe","fe-n")}">${im.dataset.fw}</span>`})});
}
function fe(e,cls=""){
  if(FE[e])return`<img class="fe ${cls}" src="${FE[e]}" alt="${e}" draggable="false">`;
  if(FE_CHUNK[e]!=null&&!(FE_LOAD[FE_CHUNK[e]]&&FE_LOAD[FE_CHUNK[e]].failed)){needFe(e);return`<img class="fe ${cls}" data-fw="${e}" src="${BLANK_GIF}" alt="${e}" draggable="false">`}
  return`<span class="fe-n ${cls}">${e}</span>`;
}

try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
if(!S.deck.length||S.bank!==W.length){buildDeck();S.bank=W.length}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
(function(){const t=today();if(S.streak.last!==t){const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();S.streak.n=S.streak.last===ys?S.streak.n+1:1;S.streak.last=t;save()}})();

const line=k=>pick(C[k][S.spice]);
const lab=()=>L[S.mode];
let tab="swipe",chatWith=null,busy=false,typing=false;
const $main=document.getElementById("main");
document.querySelectorAll("[data-fe]").forEach(el=>el.innerHTML=fe(el.dataset.fe));

// Giọng đọc: chọn giọng nữ Mỹ trong trẻo, cao và nhanh hơn để nghe hào hứng
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Ava","Allison","Susan","Zira","Karen"];
  VOICE=pref.map(n=>vs.find(v=>v.name.includes(n)&&/US|en-US/i.test(v.lang+v.name))||vs.find(v=>v.name.includes(n))).find(Boolean)||vs.find(v=>/en-US/i.test(v.lang))||vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(VOICE)u.voice=VOICE;u.pitch=1.55;u.rate=1.08;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let toastT;
function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}
function hearts(set){for(let k=0;k<16;k++){const h=document.createElement("span");h.className="heart";h.innerHTML=fe(pick(set));h.style.left=Math.random()*92+"vw";h.style.top=(70+Math.random()*30)+"vh";h.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),2200)}}

function hud(){
  document.getElementById("xpChip").innerHTML=fe("💎")+" "+S.xp+" XP";
  document.getElementById("streakChip").innerHTML=fe("🔥")+" "+S.streak.n;
  const n=Object.values(S.matches).filter(m=>m.lvl<3).length;
  const b=document.getElementById("badge");b.hidden=!n;b.textContent=n;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab===(tab==="chat"?"inbox":tab)));
}
function go(t){tab=t;render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{chatWith=null;go(b.dataset.tab)});
function render(){hud();if(tab==="swipe")renderSwipe();else if(tab==="inbox")renderInbox();else if(tab==="chat")renderChat();else renderMe()}

/* ---------- QUẸT ---------- */
function cardInfo(i,ph){
  const w=W[i];
  const where=S.mode==="love"?`📍 Cách bạn ${km(i)} km`:`👥 ${fans(i)} triệu fan · đang tour châu Á`;
  if(ph===0)return`<div class="nm">${esc(w.w)}<small>${age(i)}</small></div><div class="meta"><span>💼 ${esc(w.job)}</span><span>${where}</span></div><div class="hint">Chạm vào ảnh để xem bio, nghĩa và ví dụ ›</div>`;
  if(ph===1)return`<div class="nm" style="font-size:26px">${esc(w.w)}</div><div class="bio" style="font-size:15px">“${esc(w.bio)}”</div>
   <div class="mean"><span class="k">${fe("💡")} Nghĩa</span><b>${esc(w.vi)}</b></div>
   <div class="mean"><span class="k">${fe("📝")} Ví dụ</span><div class="exr"><span><i>${esc(w.ex)}</i>${w.exv?`<br><span style="color:var(--muted);font-size:13px">${esc(w.exv)}</span>`:""}</span><button class="say" data-say="${esc(w.ex)}" aria-label="Nghe câu ví dụ">${fe("🔊")}</button></div></div>`;
  return`<div class="nm" style="font-size:26px">${esc(w.w)}</div><div class="tags"><span class="tag">${esc(w.ipa)}</span>${w.pos?`<span class="tag">${esc(w.pos)}</span>`:""}${w.lvl?`<span class="tag">${esc(w.lvl)}</span>`:""}</div><button class="say" data-say="${esc(w.w)}">${fe("🔊")} Nghe giọng</button><div class="hint">Quen thì quẹt trái. Lạ thì quẹt phải để làm quen.</div>`;
}
function cardEl(i,under){
  const c=document.createElement("div");c.className="card"+(under?" under":"");c.style.background=grad(i);c.dataset.ph=0;
  c.innerHTML=`<div class="dots"><i class="on"></i><i></i><i></i></div><div class="ctag">${fe(CATS[W[i].c].ic)} ${CATS[W[i].c].name.toUpperCase()}</div><div class="art">${fe(W[i].emo)}</div><div class="info">${cardInfo(i,0)}</div>
  <div class="stamp st-r">${lab().stampR} ${fe(lab().rightIc)}</div><div class="stamp st-l">${lab().stampL} ${fe(lab().leftIc)}</div>`;
  return c;
}
function renderSwipe(){
  const cats=Object.keys(CATS).map(k=>`<button class="cat${S.cat===k?" on":""}" data-cat="${k}">${fe(CATS[k].ic)} ${CATS[k].name} <small>${pool(k).length}</small></button>`).join("");
  $main.innerHTML=`<div class="view"><div class="cats">${cats}</div><div class="deck" id="deck"></div>
  <div class="controls">
   <div class="ctl"><button class="rb l" id="bL" aria-label="Quen rồi, quẹt trái">${fe(lab().leftIc)}</button>${lab().left}</div>
   <div class="ctl"><button class="rb r" id="bR" aria-label="Lạ, quẹt phải">${fe(lab().rightIc)}</button>${lab().right}</div>
  </div></div>`;
  $main.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;buildDeck();save();renderSwipe()});
  const deck=document.getElementById("deck");
  while(S.pos<S.deck.length&&((S.deck[S.pos] in S.matches)||S.ex.includes(S.deck[S.pos])))S.pos++;
  if(S.pos>=S.deck.length){
    const others=Object.keys(CATS).filter(k=>k!==S.cat&&pool(k).length);
    const n=Object.values(S.matches).filter(m=>m.lvl<3).length;
    deck.innerHTML=`<div class="empty"><div class="big">${fe(others.length?"🥲":"🏆")}</div><h3>Hết hồ sơ ${CATS[S.cat].name} rồi</h3>
      <p>${others.length?`Qua khu khác tìm tiếp, hoặc vào Tin nhắn chạy thử ${n} ${lab().right.toLowerCase()} đang chờ.`:`Bạn đã quẹt hết ${W.length} hồ sơ. Vào Tin nhắn chạy thử ${n} ${lab().right.toLowerCase()} đang chờ nha.`}</p>
      <button class="btn" id="toInbox">Mở tin nhắn 💬</button></div>`;
    document.getElementById("toInbox").onclick=()=>go("inbox");
    ["bL","bR"].forEach(id=>document.getElementById(id).disabled=true);
    return;
  }
  for(let k=1;k<=4;k++)if(S.pos+k<S.deck.length)needFe(W[S.deck[S.pos+k]].emo);
  if(S.pos+1<S.deck.length)deck.appendChild(cardEl(S.deck[S.pos+1],true));
  const c=cardEl(S.deck[S.pos],false);deck.appendChild(c);bindCard(c,S.deck[S.pos]);
  document.getElementById("bL").onclick=()=>fling(c,"left");
  document.getElementById("bR").onclick=()=>fling(c,"right");
}
function setStamps(c,dx){
  c.querySelector(".st-r").style.opacity=Math.max(0,Math.min(1,dx/100));
  c.querySelector(".st-l").style.opacity=Math.max(0,Math.min(1,-dx/100));
}
function bindCard(c,i){
  let d=null;
  c.addEventListener("pointerdown",e=>{
    if(busy)return;
    const s=e.target.closest("[data-say]");if(s){say(s.dataset.say);return}
    d={x:e.clientX,y:e.clientY,dx:0,dy:0,moved:false};c.setPointerCapture(e.pointerId);c.style.transition="none";
  });
  c.addEventListener("pointermove",e=>{
    if(!d)return;d.dx=e.clientX-d.x;d.dy=e.clientY-d.y;
    if(Math.hypot(d.dx,d.dy)>6)d.moved=true;
    c.style.transform=`translate(${d.dx}px,${d.dy*.3}px) rotate(${d.dx/18}deg)`;setStamps(c,d.dx);
  });
  const end=e=>{
    if(!d)return;const {dx,moved}=d;d=null;
    if(!moved){const r=c.getBoundingClientRect();let ph=+c.dataset.ph;ph=e.clientX-r.left<r.width/3?Math.max(0,ph-1):Math.min(2,ph+1);c.dataset.ph=ph;
      c.querySelector(".info").innerHTML=cardInfo(i,ph);c.querySelectorAll(".dots i").forEach((x,k)=>x.classList.toggle("on",k===ph));c.style.transform="";return}
    if(dx>110)fling(c,"right");else if(dx<-110)fling(c,"left");
    else{c.style.transition="transform .3s cubic-bezier(.2,1.4,.4,1)";c.style.transform="";setStamps(c,0)}
  };
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
}
function fling(c,dir){
  if(busy||S.pos>=S.deck.length)return;busy=true;
  const i=S.deck[S.pos];
  const tx=dir==="right"?innerWidth*1.2:-innerWidth*1.2;
  setStamps(c,dir==="right"?120:-120);
  c.style.transition="transform .32s ease-in";c.style.transform=`translate(${tx}px,40px) rotate(${tx/25}deg)`;
  buzz(15);say(W[i].w+"!");
  setTimeout(()=>{S.pos++;
    if(dir==="left"){if(!S.ex.includes(i))S.ex.push(i);S.xp+=2;toast(line(S.mode==="love"?"left":"leftIdol"))}
    save();busy=false;renderSwipe();hud();
    if(dir==="right")doMatch(i)},300);
}
document.addEventListener("keydown",e=>{
  if(tab!=="swipe"||busy||document.querySelector(".ov"))return;
  const c=document.querySelector(".card:not(.under)");if(!c)return;
  if(e.key==="ArrowLeft")fling(c,"left");else if(e.key==="ArrowRight")fling(c,"right");
});

function overlay(html){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(o);busy=true;return o}
function closeOv(o){o.remove();busy=false}

function doMatch(i){
  const w=W[i];
  S.matches[i]={lvl:0,at:Date.now(),msgs:[{f:"w",t:`Hey 👋 cảm ơn đã quẹt phải. Tui là <em>${esc(w.w)}</em>, nghĩa là <em>${esc(w.vi)}</em>. Ví dụ nè: “${esc(w.ex)}” Nhớ kỹ nha, lát tui hỏi bài đó 😏`}]};
  S.xp+=5;save();hud();buzz([30,60,30]);hearts(S.mode==="love"?["💞","💖","✨","💘"]:["🌟","⭐","✨","💖"]);
  const o=overlay(`<div class="mt">${lab().title}</div><div class="pair"><div class="av" style="background:var(--panel2)">${fe("🫶")}</div><div class="av" style="background:${grad(i)}">${fe(w.emo)}</div></div>
   <div><div class="word">${esc(w.w)}</div><div class="vi">${esc(w.vi)}</div></div>
   <div class="ex">“${esc(w.ex)}”</div>
   <div class="sass">${esc(line(S.mode==="love"?"match":"matchIdol"))}</div>
   <div class="acts"><button class="btn" id="mChat">Nhắn tin ngay 💬</button><button class="btn ghost" id="mSay">${fe("🔊")} Nghe lại giọng ${esc(w.w)}</button><button class="btn ghost" id="mNext">Quẹt tiếp 🔥</button></div>`);
  o.querySelector("#mSay").onclick=()=>say(w.w+"!");
  o.querySelector("#mNext").onclick=()=>closeOv(o);
  o.querySelector("#mChat").onclick=()=>{closeOv(o);chatWith=i;go("chat")};
}

/* ---------- TIN NHẮN: chỉ ôn các từ lạ đã quẹt phải ---------- */
function lastText(m){const l=m.msgs[m.msgs.length-1];return(l.f==="me"?"Bạn: ":"")+l.t.replace(/<[^>]+>/g,"")}
function renderInbox(){
  const ids=Object.keys(S.matches).map(Number).sort((a,b)=>S.matches[b].at-S.matches[a].at);
  const fresh=ids.filter(i=>S.matches[i].msgs.length===1);
  const conv=ids.filter(i=>S.matches[i].msgs.length>1);
  $main.innerHTML=`<div class="view"><div class="scroll">
   <h2>${fe(lab().rightIc)} ${lab().right} chờ bạn nhắn</h2>
   ${fresh.length?`<div class="newm">${fresh.map(i=>`<button data-i="${i}"><div class="av" style="background:${grad(i)}">${fe(W[i].emo)}</div>${esc(W[i].w)}</button>`).join("")}</div>`:`<p class="blank" style="padding:10px">Chưa có ${lab().right.toLowerCase()}. Quẹt phải một từ lạ đi ${lab().rightIc}</p>`}
   <h2>Tin nhắn</h2>
   ${conv.length?conv.map(i=>{const m=S.matches[i];return`<button class="row" data-i="${i}"><div class="av" style="background:${grad(i)}">${fe(W[i].emo)}${m.lvl<3?"<b></b>":""}</div><div class="t"><div class="n">${esc(W[i].w)}<span class="lv">${lab().lv[m.lvl]}</span></div><div class="p">${esc(lastText(m))}</div></div></button>`}).join(""):`<p class="blank">Chưa có cuộc trò chuyện nào.<br>Chạm vào một ${lab().right.toLowerCase()} ở trên để bắt chuyện 👀</p>`}
  </div></div>`;
  $main.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{chatWith=+b.dataset.i;go("chat")});
}
function ask(i){
  const m=S.matches[i],w=W[i];
  if(m.lvl===0){const o=shuffle([i,...shuffle(W.map((_,k)=>k).filter(k=>k!==i)).slice(0,2)]);m.msgs.push({f:"w",q:0,o,t:"Còn nhớ tui nghĩa là gì không? 👀"})}
  else if(m.lvl===1){let same=W.map((_,k)=>k).filter(k=>k!==i&&W[k].pos===w.pos);if(same.length<2)same=W.map((_,k)=>k).filter(k=>k!==i);
    const o=shuffle([i,...shuffle(same).slice(0,2)]);
    const blank=w.gap||w.ex.replace(new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),"_____");m.msgs.push({f:"w",q:1,o,t:`Điền tui vào câu này coi: “${esc(blank)}”`})}
  else if(m.lvl===2)m.msgs.push({f:"w",q:2,t:`Tui là <em>${esc(w.vi)}</em>. Gõ đúng tên tui đi, sai chính tả là tui giận 😤`});
}
function pending(m){const l=m.msgs[m.msgs.length-1];return l.f==="w"&&l.q===m.lvl}
function renderChat(){
  const i=chatWith,m=S.matches[i],w=W[i];if(m==null)return go("inbox");
  if(m.lvl<3&&!pending(m)&&!typing){ask(i);save()}
  const last=m.msgs[m.msgs.length-1];
  let reply="";
  if(typing)reply="";
  else if(m.lvl>=3)reply=`<div class="done">${lab().lv[3]} · ${esc(w.w)} đã là của bạn</div><button class="qr" data-say="${esc(w.w)}">${fe("🔊")} Nghe giọng</button>`;
  else if(last.q===0)reply=last.o.map(k=>`<button class="qr" data-a="${k}">${esc(W[k].vi)}</button>`).join("");
  else if(last.q===1)reply=last.o.map(k=>`<button class="qr" data-a="${k}">${esc(W[k].w)}</button>`).join("");
  else reply=`<form id="spell"><input id="spellIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ tên tiếng Anh…" aria-label="Gõ từ tiếng Anh"><button class="btn" type="submit">Gửi</button></form>`;
  $main.innerHTML=`<div class="view">
   <div class="chathead"><button class="back" id="back" aria-label="Quay lại">‹</button><div class="av" style="background:${grad(i)}">${fe(w.emo)}</div><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:17px">${esc(w.w)}</div><div style="font-size:12px;color:var(--gold);font-weight:700">${lab().lv[m.lvl]} · ${m.lvl}/3</div></div><button class="qr" data-say="${esc(w.w)}" aria-label="Nghe phát âm">${fe("🔊")}</button></div>
   <div class="msgs" id="msgs">${m.msgs.map(x=>`<div class="m ${x.f}">${x.t}</div>`).join("")}${typing?`<div class="m w typing"><i></i><i></i><i></i></div>`:""}</div>
   <div class="reply">${reply}</div></div>`;
  const ms=document.getElementById("msgs");ms.scrollTop=ms.scrollHeight;
  document.getElementById("back").onclick=()=>{chatWith=null;go("inbox")};
  $main.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say+"!"));
  $main.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(i,+b.dataset.a));
  const f=document.getElementById("spell");if(f){f.onsubmit=e=>{e.preventDefault();const v=document.getElementById("spellIn").value.trim();if(v)answer(i,v)}}
}
function answer(i,v){
  const m=S.matches[i],w=W[i],lv=m.lvl;
  const norm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,"");
  const ok=lv===2?norm(v)===norm(w.w):v===i;
  m.msgs.push({f:"me",t:esc(lv===0?W[v].vi:lv===1?W[v].w:v)});
  if(ok){m.lvl++;S.xp+=15;m.msgs.push({f:"w",t:esc(line("chatRight"))});buzz(20);say(w.w+"!");
    if(m.lvl===3){m.msgs.push({f:"w",t:S.mode==="love"?"Từ giờ mình chính thức là của nhau nha 💍 Nhớ dùng tui khi nói chuyện đó.":"Bạn là fan số 1 của tui rồi 👑 Nhớ mang tui vào bài thi nha."});hearts(["💍","💞","✨","👑"]);toast(`${w.w}: ${lab().lv[3]} 🎉`)}
  }else{m.msgs.push({f:"w",t:esc(line("chatWrong"))+` Tui là <em>${esc(w.w)}</em> = <em>${esc(w.vi)}</em> đó nha.`});buzz([40,40,40])}
  m.at=Date.now();save();hud();
  if(m.lvl<3){typing=true;renderChat();setTimeout(()=>{typing=false;if(tab==="chat"&&chatWith===i){ask(i);save();renderChat()}},800)}
  else renderChat();
}

/* ---------- BẠN ---------- */
let confirmReset=false;
function renderMe(){
  const ms=Object.values(S.matches);
  const official=ms.filter(m=>m.lvl>=3).length;
  $main.innerHTML=`<div class="view"><div class="scroll">
   <div class="streak">${fe("🔥")} Bạn và tiếng Anh đã yêu nhau ${S.streak.n} ngày.<br><span style="font-weight:500;color:var(--muted)">Mai không vào là tiếng Anh đổi trạng thái thành “Độc thân” 💔</span></div>
   <div class="stats">
    <div class="stat"><b>${S.xp}</b><span>${fe("💎")} XP</span></div>
    <div class="stat"><b>${ms.length}</b><span>${fe(lab().rightIc)} ${lab().right} (từ lạ)</span></div>
    <div class="stat"><b>${official}</b><span>${fe("💍")} Chính thức (đã thuộc)</span></div>
    <div class="stat"><b>${S.ex.length}</b><span>${fe(lab().leftIc)} ${lab().left} (đã quen)</span></div>
   </div>
   <div class="set"><label>Bạn đang tìm</label><div class="seg" id="segMode"><button data-v="love">💘 Người yêu</button><button data-v="idol">⭐ Idol</button></div></div>
   <div class="set"><label>Độ hỗn</label><div class="seg" id="segSpice"><button data-v="mild">🧊 Hiền</button><button data-v="spicy">🌶️ Hơi hỗn</button><button data-v="toxic">🔥 Toxic</button></div></div>
   <div class="set"><label>${lab().exList}</label><div class="exs">${S.ex.length?S.ex.map(i=>`<span>${fe(W[i].emo)} ${esc(W[i].w)}</span>`).join(""):`<span>Chưa có ai. Quẹt trái từ bạn đã biết nhé.</span>`}</div></div>
   <div class="set"><button class="btn ghost" id="reset" style="width:100%">${confirmReset?"Chắc chưa? Bấm lần nữa để xoá hết 💔":"Chia tay tất cả, quẹt lại từ đầu"}</button></div>
  </div></div>`;
  const seg=(id,key)=>document.querySelectorAll(`#${id} button`).forEach(b=>{b.classList.toggle("on",S[key]===b.dataset.v);b.onclick=()=>{S[key]=b.dataset.v;save();renderMe()}});
  seg("segMode","mode");seg("segSpice","spice");
  document.getElementById("reset").onclick=()=>{if(!confirmReset){confirmReset=true;return renderMe()}
    const keep={mode:S.mode,spice:S.spice,streak:S.streak};S=Object.assign(fresh(),keep,{onboarded:true});buildDeck();confirmReset=false;save();toast("Đã chia tay tất cả. Làm lại cuộc đời 🌱");render()};
}

/* ---------- BẮT ĐẦU ---------- */
function onboard(){
  const o=overlay(`<div class="ob"><div class="mt" style="transform:none">Vocab Crush</div><p class="tag1">Cô đơn thì quẹt. Quẹt xong giỏi tiếng Anh.<br>${W.length.toLocaleString("vi-VN")} hồ sơ Giao tiếp, TOEIC, IELTS đang chờ bạn tối nay.</p></div>
   <div class="rules"><div><b>${fe("💘")}</b><span><strong>Quẹt phải = Lạ.</strong> Lốp mới (tân binh), sẽ nhắn tin để bạn học từ đó.</span></div><div><b>${fe("🥀")}</b><span><strong>Quẹt trái = Quen.</strong> Người yêu cũ (idol cũ), cho qua luôn.</span></div></div>
   <div class="olabel">Bạn đang tìm</div><div class="pick" id="pMode"><button data-v="love"><span>${fe("💘")}</span>Người yêu</button><button data-v="idol"><span>${fe("⭐")}</span>Idol</button></div>
   <div class="olabel">Độ hỗn của app</div><div class="pick" id="pSpice" style="grid-template-columns:repeat(3,1fr)"><button data-v="mild"><span>${fe("🧊")}</span>Hiền</button><button data-v="spicy"><span>${fe("🌶️")}</span>Hơi hỗn</button><button data-v="toxic"><span>${fe("🔥")}</span>Toxic</button></div>
   <button class="btn" id="start">Bắt đầu quẹt 🔥</button>`);
  const pk=(id,key)=>{const bs=o.querySelectorAll(`#${id} button`);const up=()=>bs.forEach(b=>b.classList.toggle("on",S[key]===b.dataset.v));bs.forEach(b=>b.onclick=()=>{S[key]=b.dataset.v;up()});up()};
  pk("pMode","mode");pk("pSpice","spice");
  o.querySelector("#start").onclick=()=>{S.onboarded=true;save();closeOv(o);say("Hey! Let's find your new crush!");render()};
}
render();
if(!S.onboarded)onboard();
</script>
